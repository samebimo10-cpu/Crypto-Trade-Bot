# Publishes the Legends Road game (games/legends-road) to GitHub Pages so it can be
# installed on a phone and played offline. Requires Settings > Pages > Source: GitHub Actions.
name: Legends Road on GitHub Pages

on:
  push:
    branches: [main]
    paths: ['games/legends-road/**', '.github/workflows/legends-road-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/legends-road
      - id: deployment
        uses: actions/deploy-pages@v4
