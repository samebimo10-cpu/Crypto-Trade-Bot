"RAKE","REAL","REAP","REPS","SAKE","SALE","SEAL","SLAP","LAKES","LASER","LEAKS","PARKS","PARSE","PEAKS","SPARE","SPEAK","SPEAR","LAKERS","PEARLS"]}},{"id":"d_indigo","title":"Purple Pits","background":"kano","lines":[{"speaker":"narrator","text":"Something strange happened at the Kofar Mata dye pits this morning…"},{"speaker":"hadiza","mood":"smile","text":"Every pit turned purple overnight. The dyers say it's a blessing. I say it's chemistry."}],"puzzle":{"id":"daily_indigo","theme":"kano","prompt":"The dye pits glow in the morning light.","hint":"Kano's most famous colour.","letters":["I","N","D","I","G","O"],"requiredWords":["INDIGO","DOING","DING"],"bonusWords":["DIG","DIN","DOG","DON","GIN","GOD","ING","ION","NOD","DINO","DONG"]}},{"id":"d_lantern","title":"The Empty Canoe","background":"bayelsa","lines":[{"speaker":"narrator","text":"Something strange happened on the creeks this morning…"},{"speaker":"tari","mood":"worried","text":"A canoe drifted up to the jetty with nobody in it. Just a lantern, still burning."}],"puzzle":{"id":"daily_lantern","theme":"creeks","prompt":"A lantern burning in an empty canoe.","hint":"A light you carry in the dark.","letters":["L","A","N","T","E","R","N"],"requiredWords":["LANTERN","LATER","RENT"],"bonusWords":["ALE","ALT","ANN","ANT","ARE","ART","ATE","EAN","EAR","EAT","ERA","ETA","LAT","LEA","LET","NAN","NAT","NET","RAN","RAT","REN","RET","TAN","TAR","TEA","TEL","TEN","ANTE","EARL","EARN","LANE","LATE","LEAN","LENT","NEAL","NEAR","NEAT","RANT","RATE","REAL","TALE","TEAL","TEAR","ALERT","ALTER","LEARN","RENAL","LEARNT","RENTAL","TANNER"]}},{"id":"d_ocean","title":"Message in a Shell","background":"caribbean","lines":[{"speaker":"narrator","text":"Something strange washed up in Tobago this morning…"},{"speaker":"marcus","mood":"smile","text":"A conch shell on my doorstep, and inside it a ring. Gold, with two rivers engraved on it."}],"puzzle":{"id":"daily_ocean","theme":"caribbean","prompt":"The tide brings in a shell with a ring inside.","hint":"What the shell came out of.","letters":["O","C","E","A","N","S"],"requiredWords":["OCEAN","CANOE","ONCE"],"bonusWords":["ACE","ANS","CAN","CON","COS","EAN","EAS","ECO","NAS","NOS","ONE","ONS","SAC","SAN","SEA","SEC","SEN","SOC","SON","ACES","ACNE","CANE","CANS","CASE","CONE","CONS","NOSE","ONES","SANE","SCAN","SEAN","OCEANS"]}}]},"chapters/prologue.json":{"id":"prologue","number":0,"title":"The Last Storm","place":"Port Harcourt, Rivers State","teaser":"A storm over the Bonny River. Four letters sealed in red wax. One old lion who won't see morning.","start":"pr_storm","initialStats":{"trust":50,"affection":50,"reputation":50},"scenes":[{"id":"pr_storm","background":"ph_night","memory":"m_storm","lines":[{"speaker":"narrator","text":"Port Harcourt. The rain came in off the Bonny River like it had a grudge."},{"speaker":"narrator","text":"In the big house on the waterfront, Chief Gideon Okoro sat alone with a cup of tea that had gone cold."},{"speaker":"narrator","text":"Ships in the Delta. Tin on the Plateau. Cloth in Kano. Money in Lagos. Everything he touched became an empire."},{"speaker":"gideon","mood":"worried","text":"Four rivers. One crown. And not one of them knows what I have done."},{"speaker":"gideon","mood":"sad","text":"Forgive me, Kaneng. I should have come back for you. For both of you."},{"speaker":"narrator","text":"He sealed four letters with red wax, pressed his ring into each one, and called for his driver."},{"speaker":"gideon","text":"If I do not wake up, send them. All four. Before the vultures land."}],"puzzle":"pr_crown","next":"pr_dawn"},{"id":"pr_dawn","background":"ph_day","lines":[{"speaker":"narrator","text":"Chief Gideon Okoro did not wake up."},{"speaker":"narrator","text":"By dawn, four letters were racing across Nigeria: north to the granite rocks of Jos, south to the creeks of Bayelsa, up to the ancient walls of Kano, and west to Lagos, which never sleeps."},{"speaker":"narrator","text":"Four houses. One crown. A death that started everything."}],"prompt":"Whose story will you follow?","choices":[{"id":"pick_nabyen","pov":"nabyen","text":"Nabyen Dalyop, House of the Rock"},{"id":"pick_tari","pov":"tari","text":"Tari Ebiowei, House of the Creeks"},{"id":"pick_hadiza","pov":"hadiza","text":"Hadiza Lawan, House of the Walls"},{"id":"pick_kolade","pov":"kolade","text":"Kolade Balogun, House of the Lagoon"}],"next":null}],"outcomes":[{"id":"pro_nabyen","if":{"pov":"nabyen"},"title":"The Daughter of the Rock","text":"You follow Nabyen. The letter in her hands has her name on it twice, and she doesn't yet know why."},{"id":"pro_tari","if":{"pov":"tari"},"title":"The Prince of the Creeks","text":"You follow Tari. The Chief pulled him from the river as a boy. Now the river wants something back."},{"id":"pro_hadiza","if":{"pov":"hadiza"},"title":"The Keeper of Ledgers","text":"You follow Hadiza. In Kano, the walls listen, and she has always listened better."},{"id":"pro_kolade","title":"The Lagos Gambler","text":"You follow Kolade. He wants the crown. The only question is what he'll trade for it."}],"memories":{"m_storm":{"title":"The Last Storm","background":"ph_night","text":"Red wax, four letters, and a cold cup of tea."}}},"chapters/c1_nabyen.json":{"id":"c1_nabyen","number":1,"title":"Daughter of the Rock","place":"Jos, Plateau State","teaser":"Granite hills, blue tourmaline, and a letter that turns Nabyen's whole life upside down.","start":"n1_rocks","scenes":[{"id":"n1_rocks","background":"jos","memory":"m_jos","lines":[{"speaker":"narrator","text":"Jos, Plateau State. Morning sun on the granite hills, and air cool enough to make Lagos jealous."},{"speaker":"narrator","text":"Nabyen Dalyop had a tray of blue tourmaline in one hand and a customer haggling in her ear when the boy came running."},{"speaker":"nabyen","mood":"smile","text":"Slow down, Dung! Who is chasing you?"},{"speaker":"narrator","text":"He pressed an envelope into her hands. Red wax, stamped with two rivers meeting."},{"speaker":"letter","text":"Nabyen. If you are reading this, I am gone. Come to Port Harcourt. Trust the rivers, not the men who sail them. — G.O."},{"speaker":"nabyen","mood":"surprised","text":"Chief Gideon Okoro? THE Chief Gideon? Why would a man like that write to me?"},{"speaker":"kaneng","mood":"surprised","text":"Give me that."},{"speaker":"narrator","text":"Her mother's hands were shaking."}],"prompt":"Mama Kaneng is hiding something.","choices":[{"id":"c_press","text":"\"Mama. What aren't you telling me?\"","effects":{"trust":-5,"affection":5},"setFlags":["pressed_mama"],"response":[{"speaker":"kaneng","mood":"sad","text":"Not here. Not in front of the whole market. Tonight, at the rocks."}]},{"id":"c_watch","text":"Say nothing. Watch her face.","effects":{"trust":5},"setFlags":["watched_mama"],"response":[{"speaker":"narrator","text":"Kaneng folds the letter into her wrapper the way you fold away a prayer. Her eyes are wet."},{"speaker":"kaneng","text":"Close the stall early, my daughter. We need to talk."}]},{"id":"c_burn","text":"Drop the letter in the brazier. Rich men's problems are not hers.","effects":{"reputation":5,"affection":-5},"setFlags":["burned_letter"],"echo":"Mama will remember this.","response":[{"speaker":"narrator","text":"The wax hisses. Kaneng snatches the letter out of the coals with her bare hand."},{"speaker":"kaneng","mood":"angry","text":"This IS your problem. It has been your problem since before you were born."}]}],"puzzle":"n_stones","next":"n2_dusk"},{"id":"n2_dusk","background":"jos_dusk","setFlags":["has_bracelet"],"lines":[{"speaker":"narrator","text":"Evening at the balancing rocks. The sky goes orange, then violet, then full of stars."},{"speaker":"kaneng","mood":"sad","text":"Thirty years ago, a young man came up from the river to buy tin. Tall. Loud. He laughed like thunder."},{"speaker":"kaneng","text":"He stayed one rainy season. Then his father called him home to build an empire, and he went."},{"speaker":"kaneng","mood":"worried","text":"He sent money every year. I sent it back every year. Pride is a heavy wrapper to wear, Nabyen."}],"prompt":"The rocks are very quiet.","choices":[{"id":"c_father","text":"\"Chief Gideon was my father.\"","effects":{"affection":5},"setFlags":["knows_father"],"response":[{"speaker":"kaneng","text":"Was. Is. Blood doesn't care about funerals."},{"speaker":"narrator","text":"She presses half a coral bracelet into Nabyen's palm. \"He kept the other half. Every day of his life.\""}]},{"id":"c_why","text":"\"Why did you never tell me?\"","effects":{"trust":5},"response":[{"speaker":"kaneng","mood":"angry","text":"Because men with empires have enemies, and I wanted you to have a life, not a crown."},{"speaker":"narrator","text":"She presses half a coral bracelet into Nabyen's palm. \"He kept the other half.\""}]},{"id":"c_go","text":"\"Then I'm going to Port Harcourt.\"","effects":{"reputation":5},"setFlags":["determined"],"response":[{"speaker":"kaneng","mood":"smile","text":"Of course you are. You are his daughter as much as mine."},{"speaker":"narrator","text":"She presses half a coral bracelet into Nabyen's palm. \"Take this. He has the other half.\""}]}],"puzzle":"n_plateau","next":"n3_market"},{"id":"n3_market","background":"jos_market","lines":[{"speaker":"narrator","text":"Next morning the market is louder than usual, because a black SUV with Lagos plates is parked in the middle of it."},{"speaker":"kolade","mood":"smile","text":"Nabyen Dalyop. Kolade Balogun, House of the Lagoon. I flew up at dawn just to meet you."},{"speaker":"kolade","text":"We got the same letter. Mine said 'earn it.' I'm guessing yours said something kinder."},{"speaker":"kolade","mood":"smile","text":"I have a jet waiting at Heipang. Port Harcourt by lunch. We could be allies, you and I."},{"speaker":"narrator","text":"Then her phone buzzes. A voice she hasn't heard since she was twelve and learning to swim in the creeks."},{"speaker":"tari","mood":"worried","text":"Nabyen? It's Tari. Tari Ebiowei. The Chief asked me to keep you safe. Don't get in any car from Lagos."}],"prompt":"Two men. Two offers.","choices":[{"id":"c_jet","text":"Fly with Kolade.","effects":{"affection":5,"reputation":5},"setFlags":["ally_kolade","spark_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"Smart woman. Lagos and the Plateau. Together we'd be unstoppable."}]},{"id":"c_tari","text":"Tell Tari to come and get her.","effects":{"trust":5,"affection":5},"setFlags":["ally_tari","spark_tari"],"echo":"Kolade will remember this.","response":[{"speaker":"tari","mood":"smile","text":"Take the bus to Makurdi. I'll meet you at the river. I'm already on my way."},{"speaker":"kolade","text":"Suit yourself. I'll save you a seat at the table."}]},{"id":"c_alone","text":"Take the night bus. Alone.","effects":{"reputation":5,"trust":5},"setFlags":["independent"],"response":[{"speaker":"nabyen","mood":"smile","text":"I carry my own stones down the hill, Mr Balogun. I can carry myself to Port Harcourt."}]}],"next":"n4_road"},{"id":"n4_road","background":"road_night","memory":"m_road","lines":[{"speaker":"narrator","if":{"flags":["ally_kolade"]},"text":"The jet hums south over the dark Benue. Kolade sleeps. Nabyen doesn't."},{"speaker":"narrator","if":{"notFlags":["ally_kolade"]},"text":"The bus rattles south through the night, past dark hills and sleeping towns."},{"speaker":"narrator","text":"She opens her bag for water and finds something that wasn't there this morning."},{"speaker":"narrator","text":"A business card. Heavy cream paper. 'Banque Moreau, Genève.' On the back, in neat handwriting: 'Stay in Jos.'"},{"speaker":"nabyen","mood":"worried","text":"Someone was in my room."}],"prompt":"Somebody wants her to stay home.","choices":[{"id":"c_keep_card","text":"Keep the card hidden. Whoever sent it is watching.","effects":{"trust":5},"setFlags":["clue_moreau"],"response":[{"speaker":"nabyen","text":"Moreau. I'll remember you."}]},{"id":"c_tear_card","text":"Tear it in half. She doesn't take orders from strangers.","effects":{"reputation":5},"setFlags":["clue_moreau","defiant"],"response":[{"speaker":"narrator","text":"She keeps the half with the name on it, though. She's angry, not foolish."}]}],"next":null}],"outcomes":[{"id":"n_wings","if":{"flags":["ally_kolade"]},"title":"Wings over the Benue","text":"Nabyen flew south with Lagos at her side. Kolade is charming, generous and very interested in her future. Maybe a little too interested."},{"id":"n_river","if":{"flags":["ally_tari"]},"title":"The River Remembers","text":"Nabyen called the boy who taught her to swim. He came at once, the way rivers do."},{"id":"n_road","title":"Her Own Road","text":"Nabyen went south alone, owing nobody anything. In a game of thrones, that's rare and dangerous."}],"reflections":[{"if":{"flags":["burned_letter"]},"text":"Mama Kaneng's hand is bandaged. She hasn't mentioned it."},{"if":{"flags":["knows_father"]},"text":"Nabyen knows who her father was. Soon everyone else will too."},{"if":{"min":{"affection":60}},"text":"Hearts are opening. Hers included."}],"secrets":{"s_plea":{"title":"A father's plea","text":"PLEA, hidden in the Plateau. On the back of the Chief's letter, in pencil so faint she almost missed it: 'Forgive me, Kaneng.'"}},"memories":{"m_jos":{"title":"Morning on the Rocks","background":"jos","text":"Blue tourmaline, cool air, and a boy running with a red-wax letter."},"m_road":{"title":"The Road South","background":"road_night","text":"A card that says 'Stay in Jos.' She didn't."}}},"chapters/c1_tari.json":{"id":"c1_tari","number":1,"title":"Prince of the Creeks","place":"Bayelsa State","teaser":"Mangroves, mist and a midnight ambush. Someone doesn't want Tari to reach Port Harcourt alive.","start":"t1_creek","scenes":[{"id":"t1_creek","background":"bayelsa","memory":"m_creeks","lines":[{"speaker":"narrator","text":"Bayelsa. Mist on the creeks, and mangrove roots reaching into the water like old men's fingers."},{"speaker":"narrator","text":"Tari Ebiowei had been on the water since four. The fishermen had already told him. The Chief was dead."},{"speaker":"tari","mood":"sad","text":"He pulled me out of this river when I was six. Raised me like his own. And I wasn't there."},{"speaker":"letter","text":"Tari. You were the son I chose. Protect the girl from the Rock. Nabyen. Do not let them near her. — G.O."},{"speaker":"tari","mood":"surprised","text":"Nabyen? Little Nabyen from Jos? She used to scream at every fish."}],"prompt":"The crew are watching him.","choices":[{"id":"c_crew","text":"\"Gather the crew. We sail for Port Harcourt tonight.\"","effects":{"reputation":10},"setFlags":["crew_loyal"],"response":[{"speaker":"narrator","text":"Twelve boats. Twelve men. Every one of them owes the Chief their life."}]},{"id":"c_alone_t","text":"Go alone. Fewer eyes, fewer mouths.","effects":{"trust":5},"setFlags":["travels_light"],"response":[{"speaker":"tari","text":"If someone poisoned an old lion in his own house, they'll be watching the river."}]},{"id":"c_killer","text":"\"First, I find out who killed him.\"","effects":{"trust":5,"reputation":-5},"setFlags":["suspects_poison"],"response":[{"speaker":"tari","mood":"angry","text":"Old men don't die of 'tiredness' the same week they rewrite their will. Somebody did this."}]}],"puzzle":"t_waters","next":"t2_call"},{"id":"t2_call","background":"bayelsa","lines":[{"speaker":"narrator","text":"His phone rings. Port Harcourt. The widow."},{"speaker":"ibiere","mood":"angry","text":"Tari. You will stay away from the funeral. My husband's charity ended when his heart stopped."},{"speaker":"ibiere","text":"This is family business, and you are not family."}],"prompt":"Ibiere Okoro, the Chief's widow, wants him gone.","choices":[{"id":"c_defy","text":"\"With respect, Madam, I'll be there.\"","effects":{"reputation":5},"setFlags":["defied_ibiere"],"response":[{"speaker":"ibiere","mood":"angry","text":"Then come. And see how quickly respect runs out."}]},{"id":"c_lie_ib","text":"\"Of course, Madam. I'll stay in the creeks.\"","effects":{"trust":-5},"setFlags":["lied_ibiere"],"echo":"Ibiere believed you.","response":[{"speaker":"ibiere","mood":"smile","text":"Good boy."},{"speaker":"narrator","text":"He's already untying the boat."}]},{"id":"c_ask_ib","text":"\"Madam, who was with him the night he died?\"","effects":{"trust":5,"reputation":-5},"setFlags":["suspects_ibiere","clue_moreau"],"response":[{"speaker":"ibiere","mood":"surprised","text":"How dare you."},{"speaker":"narrator","text":"She hangs up, but not before he hears another woman's voice in the room. An accent. French, or Swiss."}]}],"next":"t3_night"},{"id":"t3_night","background":"creek_night","memory":"m_night_creek","lines":[{"speaker":"narrator","text":"Midnight on the creeks. No moon cover, no engines but his own."},{"speaker":"narrator","text":"Then another engine. Fast. Lights off."},{"speaker":"tari","mood":"angry","text":"DOWN!"},{"speaker":"narrator","text":"Bullets chew the mangroves. A speedboat swings past, and something heavy splashes into the water beside him."},{"speaker":"narrator","text":"One of the attackers has gone overboard. He can't swim."}],"prompt":"The speedboat is getting away. The man in the water is going under.","choices":[{"id":"c_chase","text":"Chase the boat.","effects":{"reputation":5},"setFlags":["chased","suspects_kolade"],"response":[{"speaker":"narrator","text":"He loses them in the mangroves, but they drop something in the chase: a bank card. First Lagoon Bank, Lagos."},{"speaker":"tari","mood":"angry","text":"Kolade Balogun's bank."}]},{"id":"c_save","text":"Save the drowning man.","effects":{"affection":5,"trust":5},"setFlags":["saved_attacker","clue_moreau"],"response":[{"speaker":"narrator","text":"Tari hauls him into the boat, coughing up river."},{"speaker":"narrator","text":"'The white woman pays in francs,' the man gasps. 'She said nobody from the creeks reaches Port Harcourt.'"}]}],"puzzle":"t_rivers","next":"t4_dawn"},{"id":"t4_dawn","background":"ph_day","lines":[{"speaker":"narrator","text":"Dawn. The Port Harcourt jetty. Tari ties up the boat with hands that won't stop shaking."},{"speaker":"narrator","text":"And there at the end of the jetty, in an orange ankara dress, is a woman he hasn't seen since she was twelve."},{"speaker":"nabyen","mood":"surprised","text":"Tari? Tari Ebiowei? Since when are you so tall?"},{"speaker":"nabyen","mood":"smile","text":"You still owe me a fish, you know. A big one. You promised."}],"prompt":"Nabyen Dalyop, all grown up.","choices":[{"id":"c_hug","text":"Pull her into a hug. Fish later.","effects":{"affection":10},"setFlags":["spark_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"Okay. Okay! You smell like the river."}]},{"id":"c_warn","text":"\"Someone tried to kill me last night. Stay close.\"","effects":{"trust":10},"setFlags":["ally_nabyen"],"response":[{"speaker":"nabyen","mood":"worried","text":"Then we stay close."}]},{"id":"c_formal","text":"\"Miss Dalyop. The Chief asked me to look after you.\"","effects":{"reputation":5},"response":[{"speaker":"nabyen","mood":"sad","text":"Miss Dalyop. Wow. Okay, Captain."}]}],"next":null}],"outcomes":[{"id":"t_blood","if":{"flags":["suspects_kolade"]},"title":"Blood in the Water","text":"A Lagos bank card, dropped by men who tried to kill him. Tari now has a name to hate. It might even be the right one."},{"id":"t_francs","if":{"flags":["clue_moreau"]},"title":"The Woman Who Pays in Francs","text":"Someone far from the creeks is paying in Swiss money for Nigerian blood."},{"id":"t_tide","title":"Turning Tide","text":"Tari reached Port Harcourt alive. On the creeks, that's a kind of victory."}],"reflections":[{"if":{"flags":["spark_nabyen"]},"text":"Something old and warm is waking up between the captain and the girl from the rocks."},{"if":{"flags":["crew_loyal"]},"text":"Twelve boats answer to Tari now."},{"if":{"flags":["lied_ibiere"]},"text":"Ibiere thinks Tari is in the creeks. She'll find out soon."}],"secrets":{"s_swear":{"title":"An oath on the water","text":"SWEAR, from the waters. Tari's father swore on the Nun River to protect the Chief, and died keeping that oath. The Chief never forgave himself."}},"memories":{"m_creeks":{"title":"Mist on the Creeks","background":"bayelsa","text":"Mangroves, a canoe, and news nobody wanted to deliver."},"m_night_creek":{"title":"Ambush at Midnight","background":"creek_night","text":"Fireflies, bullets, and a man who couldn't swim."}}},"chapters/c1_hadiza.json":{"id":"c1_hadiza","number":1,"title":"The Long Game","place":"Kano, Kano State","teaser":"Indigo dye pits, a decade of ledgers, and four million dollars a year that vanished into Switzerland.","start":"h1_pits","scenes":[{"id":"h1_pits","background":"kano","memory":"m_kano","lines":[{"speaker":"narrator","text":"Kano. The old city walls glow red in the morning, and the dye pits of Kofar Mata breathe indigo into the air."},{"speaker":"narrator","text":"Hadiza Lawan had her father's ledgers open on her knees when the letter came."},{"speaker":"letter","text":"Hadiza. You always saw what I missed. Count the money. Someone has been counting it for me. — G.O."},{"speaker":"hadiza","mood":"worried","text":"Count the money. You never asked me for anything, Chief. And now you're gone."}],"prompt":"The ledgers are heavy.","choices":[{"id":"c_audit","text":"Open every ledger tonight. All ten years.","effects":{"trust":5},"setFlags":["audited"],"response":[{"speaker":"hadiza","mood":"smile","text":"Bring me tea. A great deal of tea."}]},{"id":"c_call_lagos","text":"Call Kolade in Lagos. Bankers know where money hides.","effects":{"reputation":5},"setFlags":["ally_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"Hadiza Lawan, calling me? I'm flattered. And suspicious."}]},{"id":"c_silent","text":"Tell no one. Not even family.","effects":{"trust":5,"reputation":-5},"setFlags":["silent"],"response":[{"speaker":"hadiza","text":"In Kano, the walls listen. Then they talk."}]}],"puzzle":"h_ledger","next":"h2_market"},{"id":"h2_market","background":"kano_market","lines":[{"speaker":"narrator","text":"Midnight at Kurmi market, among the lanterns and bolts of bright cloth, she finds it."},{"speaker":"hadiza","mood":"surprised","text":"Four million dollars a year. Every year. Out of Confluence Holdings and into a private bank in Geneva."},{"speaker":"hadiza","text":"Banque Moreau. Someone has been bleeding the Chief for a decade, and nobody noticed."},{"speaker":"kolade","if":{"flags":["ally_kolade"]},"text":"Moreau? Very old, very private, very Swiss. Why do you ask?"},{"speaker":"narrator","if":{"flags":["ally_kolade"]},"text":"He answers a little too smoothly."}],"prompt":"This is either evidence or leverage.","choices":[{"id":"c_share","text":"Send it to the other heirs. Nobody wins a rigged game.","effects":{"trust":10},"setFlags":["shared_ledger","clue_moreau"],"response":[{"speaker":"hadiza","text":"Let them all see. Thieves hate the light."}]},{"id":"c_leverage","text":"Keep it. Whoever holds this holds the crown.","effects":{"reputation":10,"trust":-5},"setFlags":["leverage","clue_moreau"],"echo":"Knowledge is a blade.","response":[{"speaker":"hadiza","mood":"smile","text":"My father taught me: never show your best cloth on the first day of the market."}]},{"id":"c_for_nd","text":"Send it to one person only: the 'N.D.' in the margins.","effects":{"affection":5,"trust":5},"setFlags":["ally_nabyen","clue_moreau"],"response":[{"speaker":"narrator","text":"In the margin of the oldest ledger, in the Chief's handwriting: 'For N.D., if anything happens to me.'"},{"speaker":"hadiza","text":"Nabyen Dalyop. Jos. Let's see who you are."}]}],"next":"h3_durbar"},{"id":"h3_durbar","background":"kano_durbar","memory":"m_durbar","lines":[{"speaker":"narrator","text":"Sallah Durbar. Horsemen in red and gold, trumpets, dust, the whole city cheering."},{"speaker":"narrator","text":"And in the middle of it all, a man in a Lagos suit, sweating."},{"speaker":"kolade","mood":"smile","text":"Hadiza. I came all the way to Kano to make you an offer."},{"speaker":"kolade","text":"You have the numbers. I have the bank. Together we walk into Port Harcourt already wearing the crown."}],"prompt":"Kolade Balogun, House of the Lagoon.","choices":[{"id":"c_shake","text":"Shake his hand.","effects":{"reputation":5},"setFlags":["ally_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"A pleasure doing business."}]},{"id":"c_refuse_k","text":"\"I don't share crowns, Kolade.\"","effects":{"reputation":5,"trust":-5},"setFlags":["refused_kolade"],"response":[{"speaker":"kolade","text":"Then I'll see you on the other side of the table."}]},{"id":"c_test","text":"Ask him about Banque Moreau. Watch his eyes.","effects":{"trust":5},"setFlags":["suspects_kolade"],"response":[{"speaker":"narrator","text":"He blinks. Once. Then he laughs."},{"speaker":"kolade","mood":"smile","text":"Never heard of them."},{"speaker":"narrator","text":"Hadiza has played enough cards to know a bluff."}]}],"puzzle":"h_horses","next":"h4_south"},{"id":"h4_south","background":"kano","lines":[{"speaker":"narrator","text":"Evening. The last flight south out of Mallam Aminu Kano International."},{"speaker":"hadiza","mood":"smile","text":"Port Harcourt. Let's see who's lying."}],"next":null}],"outcomes":[{"id":"h_open","if":{"flags":["shared_ledger"]},"title":"Open Books","text":"Hadiza showed everyone the truth. Honest, brave, and now a target."},{"id":"h_blade","if":{"flags":["leverage"]},"title":"The Blade","text":"Hadiza kept the proof to herself. In a game of thrones, the one who knows the most usually wins. Usually."},{"id":"h_nd","title":"For N.D.","text":"Hadiza found a name in the Chief's margins and followed it. N.D. Nabyen Dalyop. Why did a billionaire write a gem trader into his ledgers?"}],"reflections":[{"if":{"flags":["suspects_kolade"]},"text":"Kolade's laugh came a second too late."},{"if":{"flags":["ally_kolade"]},"text":"Lagos and Kano have shaken hands. For now."}],"secrets":{"s_greed":{"title":"Circled three times","text":"GREED, circled three times in red ink in the margin of the 2019 ledger, in the Chief's own hand. He knew, a year before he died."}},"memories":{"m_kano":{"title":"Indigo Morning","background":"kano","text":"Red walls, indigo pits, and a letter that said: count the money."},"m_durbar":{"title":"The Durbar","background":"kano_durbar","text":"Horsemen in red and gold, and a Lagos banker in the dust."}}},"chapters/c1_kolade.json":{"id":"c1_kolade","number":1,"title":"Lagos Never Sleeps","place":"Lagos, Lagos State","teaser":"Third Mainland traffic, a rooftop on Victoria Island, and a Swiss banker with a very dangerous offer.","start":"k1_bridge","scenes":[{"id":"k1_bridge","background":"lagos","memory":"m_lagos","lines":[{"speaker":"narrator","text":"Lagos. Third Mainland Bridge at six in the evening. Nothing on it moves except the danfo drivers' mouths."},{"speaker":"narrator","text":"In the back of his car, Kolade Balogun reads the letter for the third time."},{"speaker":"letter","text":"Kolade. You wanted everything. Earn it. — G.O."},{"speaker":"kolade","mood":"smile","text":"Earn it. Old man, I've been earning it since I was sixteen."},{"speaker":"kolade","mood":"sad","text":"...You could have said goodbye."}],"prompt":"The traffic hasn't moved in twenty minutes.","choices":[{"id":"c_widow","text":"Call the widow. Lock in the board votes before anyone else lands.","effects":{"reputation":10,"trust":-5},"setFlags":["courted_ibiere"],"response":[{"speaker":"ibiere","mood":"smile","text":"Kolade. You always were the practical one. Come and see me."}]},{"id":"c_research","text":"Look up the other names under the seal.","effects":{"trust":5},"setFlags":["researched"],"response":[{"speaker":"kolade","text":"Dalyop. Ebiowei. Lawan. And me. A gem trader, a boat captain, a Kano accountant and a banker. What were you building, Chief?"}]},{"id":"c_drink","text":"\"Driver. Victoria Island. I need a drink first.\"","effects":{"affection":5},"response":[{"speaker":"kolade","mood":"sad","text":"Grief can wait until the second bottle."}]}],"puzzle":"k_bridge","next":"k2_vi"},{"id":"k2_vi","background":"lagos_night","lines":[{"speaker":"narrator","text":"Victoria Island. A rooftop bar, the whole city lit up like money."},{"speaker":"narrator","text":"A video call from a private number: a woman with pale hair and Lake Geneva behind her."},{"speaker":"elise","mood":"smile","text":"Monsieur Balogun. Elise Moreau, Banque Moreau. I managed Chief Okoro's private accounts for many years."},{"speaker":"elise","text":"His will is... complicated. Help me keep his accounts quiet for a few weeks, and I can make sure the crown goes to you."},{"speaker":"elise","mood":"smile","text":"Lagos deserves a king. Don't you think?"}],"prompt":"The most dangerous offer of his life.","choices":[{"id":"c_accept","text":"\"Tell me more.\"","effects":{"reputation":10,"trust":-10},"setFlags":["elise_deal"],"echo":"Elise will remember this.","response":[{"speaker":"elise","mood":"smile","text":"I knew you were the clever one."}]},{"id":"c_refuse_e","text":"\"He was my godfather. Find another fool.\"","effects":{"trust":10},"setFlags":["refused_elise","clue_moreau"],"response":[{"speaker":"elise","text":"A pity. Fools live longer, Monsieur."}]},{"id":"c_spy","text":"Pretend to accept. Record every word.","effects":{"trust":5,"reputation":5},"setFlags":["double_agent","clue_moreau"],"response":[{"speaker":"kolade","mood":"smile","text":"Of course, Madame. Let's talk numbers."},{"speaker":"narrator","text":"In his pocket, his phone is recording."}]}],"next":"k3_beach"},{"id":"k3_beach","background":"lagos_beach","memory":"m_beach","lines":[{"speaker":"narrator","text":"Dawn on the beach at Lekki. The Atlantic doesn't care about crowns."},{"speaker":"kolade","text":"Two ways to play this. Fly straight to Port Harcourt and be first in the room."},{"speaker":"kolade","text":"Or fly north to Jos and meet the woman whose name the old man wrote twice."}],"prompt":"Where does Kolade go first?","choices":[{"id":"c_to_jos","text":"Fly to Jos. Meet Nabyen Dalyop.","effects":{"affection":5},"setFlags":["ally_nabyen","spark_nabyen"],"response":[{"speaker":"narrator","text":"Later he'll tell everyone it was strategy. It wasn't."}]},{"id":"c_to_ph","text":"Fly straight to Port Harcourt. Be first in the room.","effects":{"reputation":5},"setFlags":["first_in_room"],"response":[{"speaker":"kolade","mood":"smile","text":"In Lagos, the early bird doesn't just catch the worm. He buys the farm."}]}],"puzzle":"k_lagos","next":null}],"outcomes":[{"id":"k_wolf","if":{"flags":["elise_deal"]},"title":"A Deal in the Dark","text":"Kolade said yes to Elise Moreau. Lagos might get its king. But kings who are made by other people can be unmade by them too."},{"id":"k_two","if":{"flags":["double_agent"]},"title":"Two Faces","text":"Kolade smiled at the wolf and kept the tape running. A dangerous game, played well. So far."},{"id":"k_not","title":"Not for Sale","text":"Kolade turned Elise down. For once, the man who wanted everything wouldn't sell anything."}],"reflections":[{"if":{"flags":["spark_nabyen"]},"text":"A Lagos banker is flying north for a woman he has never met."},{"if":{"flags":["courted_ibiere"]},"text":"The widow is in Kolade's pocket. Or he's in hers."}],"secrets":{"s_bride":{"title":"A promised bride","text":"BRIDE. Thirty years ago, two fathers promised a Lagos boy a bride from the Plateau. The Chief tore the agreement up the day Nabyen was born."}},"memories":{"m_lagos":{"title":"Third Mainland at Dusk","background":"lagos","text":"Yellow danfos, a gold lagoon, and two words: earn it."},"m_beach":{"title":"Dawn at Lekki","background":"lagos_beach","text":"The Atlantic, a choice, and a woman he hadn't met yet."}}},"chapters/c2_funeral.json":{"id":"c2_funeral","number":2,"title":"The Funeral","place":"Port Harcourt, Rivers State","teaser":"White lilies, gold columns, a furious widow, and a will that says the crown must be chosen.","start":"f1_hall","scenes":[{"id":"f1_hall","background":"mansion","memory":"m_funeral","lines":[{"speaker":"narrator","text":"Port Harcourt. White lilies, gold columns, and three hundred mourners pretending not to watch each other."},{"speaker":"narrator","text":"For the first time in years, all four houses stand under one roof."},{"speaker":"narrator","if":{"pov":"nabyen"},"text":"Nabyen keeps one hand in her pocket, closed tight around half a coral bracelet."},{"speaker":"narrator","if":{"pov":"tari"},"text":"Tari stands at the back, still smelling of the creeks, watching the doors."},{"speaker":"narrator","if":{"pov":"hadiza"},"text":"Hadiza counts the exits, then the guests, then the guards."},{"speaker":"narrator","if":{"pov":"kolade"},"text":"Kolade works the room like it's the opening of a new bank."},{"speaker":"ibiere","mood":"angry","text":"Four strangers at my husband's funeral. He collected people the way other men collect cars."},{"speaker":"narrator","text":"A thin Englishman with rain still on his coat clears his throat. Oliver Ashworth, the family's London solicitor."},{"speaker":"oliver","text":"Chief Okoro left instructions. The chairmanship of Confluence Holdings, what he called the Crown of the Confluence, is not inherited."},{"speaker":"oliver","text":"It is chosen, by the four houses together. Once they have brought back the second half of his will from Geneva, and the last seal from his brother."},{"speaker":"ibiere","mood":"surprised","text":"His brother? Gideon had no brother."},{"speaker":"oliver","mood":"worried","text":"He did, Madam. And the first half of the will is waiting in my office in London."}],"next":"f2_accuse"},{"id":"f2_accuse","background":"mansion","lines":[{"speaker":"ibiere","mood":"angry","text":"And this one. A trader from the hills? In my husband's will?"},{"speaker":"ibiere","text":"Do you know what they call girls like you, Nabyen Dalyop? Gold-diggers."},{"speaker":"nabyen","mood":"angry","text":"My mother dug tin, Madam. Not gold."}],"prompt":"Ibiere has drawn first blood.","choices":[{"id":"c_defend","if":{"notPov":"nabyen"},"text":"Step in front of Nabyen. \"Say that again, Madam. To me.\"","effects":{"affection":10,"reputation":-5},"setFlags":["defended_nabyen"],"response":[{"speaker":"nabyen","mood":"surprised","text":"...Thank you."},{"speaker":"ibiere","text":"How touching."}]},{"id":"c_answer","if":{"pov":"nabyen"},"text":"\"He was my father, Madam. And I didn't come here for his money.\"","effects":{"trust":10,"reputation":-5},"setFlags":["revealed_father"],"response":[{"speaker":"ibiere","mood":"surprised","text":"...Liar."},{"speaker":"narrator","text":"But her face has gone grey."}]},{"id":"c_accuse","text":"\"Where were YOU the night he died, Madam?\"","effects":{"trust":5,"reputation":-10},"setFlags":["accused_ibiere"],"echo":"Ibiere will remember this.","response":[{"speaker":"ibiere","mood":"angry","text":"Get out of my house."},{"speaker":"narrator","text":"Three hundred people heard that. By evening, so has all of Port Harcourt."}]},{"id":"c_calm","text":"\"We're all grieving. Let's bury him in peace.\"","effects":{"reputation":10},"setFlags":["peacemaker"],"response":[{"speaker":"ibiere","mood":"sad","text":"...Fine. For him. Not for you."}]}],"puzzle":"f_funeral","next":"f3_garden"},{"id":"f3_garden","background":"ph_garden","memory":"m_garden","lines":[{"speaker":"narrator","text":"Midnight. The garden behind the mansion, fireflies over the fountain."},{"speaker":"narrator","text":"On the stone bench: the Chief's tea tray, taken from his study before the police arrived. One silver spoon has gone black at the tip."},{"speaker":"hadiza","text":"And this. Four million dollars a year into Banque Moreau, Geneva. For ten years."},{"speaker":"tari","mood":"angry","text":"Moreau. The man I pulled out of the creek said a white woman was paying in francs."},{"speaker":"kolade","text":"Banks are boring. Let's talk about who flies to London tomorrow."},{"speaker":"narrator","if":{"pov":"kolade","flags":["elise_deal"]},"text":"In Kolade's pocket, his phone buzzes. Geneva. He doesn't answer it."}],"prompt":"Who do you trust most?","choices":[{"id":"c_trust_nabyen","if":{"notPov":"nabyen"},"text":"Nabyen. The Chief did.","effects":{"affection":5},"setFlags":["ally_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"Then I'll try to deserve it."}]},{"id":"c_trust_tari","if":{"notPov":"tari"},"text":"Tari. He's already bled for this.","effects":{"trust":5},"setFlags":["ally_tari"],"response":[{"speaker":"tari","text":"Nobody touches you while I'm breathing."}]},{"id":"c_trust_hadiza","if":{"notPov":"hadiza"},"text":"Hadiza. She found the money.","effects":{"reputation":5},"setFlags":["ally_hadiza"],"response":[{"speaker":"hadiza","mood":"smile","text":"Wise. Numbers don't lie. People do."}]},{"id":"c_trust_kolade","if":{"notPov":"kolade"},"text":"Kolade. Lagos knows Geneva.","effects":{"reputation":5,"trust":-5},"setFlags":["ally_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"Finally, somebody with taste."}]}],"puzzle":"f_poison","next":"f4_moment"},{"id":"f4_moment","background":"ph_garden","lines":[{"speaker":"narrator","if":{"notPov":"nabyen"},"text":"Later, everyone else has gone inside. Nabyen is still by the fountain, turning half a coral bracelet in her fingers."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"mood":"sad","text":"He was my father, you know. I never met him. I only ever saw him in newspapers."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"text":"Do you think he was a good man?"},{"speaker":"narrator","if":{"pov":"nabyen"},"text":"Later, Nabyen sits alone by the fountain. Two men find excuses to walk past it."},{"speaker":"tari","if":{"pov":"nabyen"},"mood":"worried","text":"You shouldn't be out here alone. Not tonight."},{"speaker":"kolade","if":{"pov":"nabyen"},"mood":"smile","text":"Or she should, and I should keep her company."}],"prompt":"The fireflies are very bright tonight.","choices":[{"id":"c_hold","if":{"notPov":"nabyen"},"text":"Take her hand. \"I think he loved you more than he knew how to say.\"","effects":{"affection":10},"setFlags":["spark_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"...You're kind. I didn't expect kind, here."}]},{"id":"c_honest","if":{"notPov":"nabyen"},"text":"\"He was a great man. Not always a good one.\"","effects":{"trust":10},"response":[{"speaker":"nabyen","text":"Honest. I'll take honest."}]},{"id":"c_sit_tari","if":{"pov":"nabyen"},"text":"Ask Tari to sit with her.","effects":{"affection":10},"setFlags":["spark_tari"],"response":[{"speaker":"tari","mood":"smile","text":"I'll sit here until the sun comes up, if you want."}]},{"id":"c_sit_kolade","if":{"pov":"nabyen"},"text":"Let Kolade stay.","effects":{"affection":10},"setFlags":["spark_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"I'm told I'm excellent company. Mostly by me."}]},{"id":"c_leave","text":"Leave the fireflies to their silence.","effects":{"reputation":5},"response":[{"speaker":"narrator","text":"Tomorrow: London. Some conversations can wait."}]}],"next":null}],"outcomes":[{"id":"f_blood","if":{"flags":["accused_ibiere"]},"title":"Blood on the Lilies","text":"You called the widow a murderer in front of three hundred people. If you're wrong, you've made a powerful enemy. If you're right, you've warned her."},{"id":"f_daughter","if":{"flags":["revealed_father"]},"title":"His Daughter","text":"Nabyen told the world whose daughter she is. There's no taking that back now."},{"id":"f_shield","if":{"flags":["defended_nabyen"]},"title":"Shield of the Rock","text":"You stood between Nabyen and the widow's anger. She noticed. Everyone noticed."},{"id":"f_peace","title":"The Peacemaker","text":"The Chief was buried in peace. Peace is rare in this family. Enjoy it."}],"reflections":[{"if":{"anyFlags":["spark_nabyen","spark_tari","spark_kolade"]},"text":"Something started by the fountain tonight."},{"if":{"flags":["clue_moreau"]},"text":"The name Moreau keeps coming up."}],"secrets":{"s_spoon":{"title":"The silver spoon","text":"SPOON. The poison was never in the tea. It was on the silver spoon, a gift from Geneva, engraved 'E.M.'"}},"memories":{"m_funeral":{"title":"White Lilies","background":"mansion","text":"Gold columns, three hundred mourners, and four heirs under one roof."},"m_garden":{"title":"Fireflies at Midnight","background":"ph_garden","text":"A blackened spoon, a fountain, and a hand held in the dark."}}},"chapters/c3_london.json":{"id":"c3_london","number":3,"title":"Fog on the Thames","place":"London, United Kingdom","teaser":"Rain, red buses, a frightened solicitor, and a murder on the Embankment.","start":"l1_office","scenes":[{"id":"l1_office","background":"london","memory":"m_london","lines":[{"speaker":"narrator","text":"London. Rain that doesn't fall so much as hang in the air and wait for you."},{"speaker":"narrator","text":"Oliver Ashworth's office at Lincoln's Inn smells of old paper and older secrets."},{"speaker":"oliver","mood":"worried","text":"Someone was here last night. They took nothing. Which means they were looking for something they didn't find."},{"speaker":"oliver","text":"The first half of the will. And a key. The Chief said only his blood could open his box in Geneva."},{"speaker":"oliver","text":"I never understood what he meant. Perhaps one of you does."},{"speaker":"narrator","text":"Nabyen's hand closes around the coral bracelet in her pocket."}],"prompt":"Oliver looks like a man who hasn't slept in a week.","choices":[{"id":"c_invite","text":"\"Come with us to Geneva, Oliver. You're not safe here.\"","effects":{"trust":5,"affection":5},"setFlags":["invited_oliver"],"response":[{"speaker":"oliver","mood":"smile","text":"That's... very kind. I have one thing to collect first. Meet me on the Embankment at nine."}]},{"id":"c_doubt","text":"\"How do we know you're not part of this?\"","effects":{"trust":-5,"reputation":5},"setFlags":["doubted_oliver"],"response":[{"speaker":"oliver","mood":"sad","text":"You don't. That's rather the point of trust."},{"speaker":"oliver","text":"The Embankment, nine o'clock. There's something you need to see."}]}],"puzzle":"l_thames","next":"l2_embankment"},{"id":"l2_embankment","background":"london_night","setFlags":["dead_oliver"],"lines":[{"speaker":"narrator","text":"Nine o'clock. Fog on the Embankment, and lamps like drowned moons."},{"speaker":"narrator","text":"Oliver is late. Then he isn't late. He's lying on the stone steps down to the river."},{"speaker":"oliver","mood":"sad","text":"...Moreau... it was always... Moreau..."},{"speaker":"narrator","text":"His hand opens. In his palm is a small brass key."},{"speaker":"narrator","text":"Footsteps, running. A shadow in a long coat is disappearing toward Waterloo Bridge."}],"prompt":"Oliver Ashworth is dying.","choices":[{"id":"c_stay_o","text":"Stay with Oliver.","effects":{"affection":5,"trust":5},"setFlags":["stayed_oliver","clue_moreau"],"response":[{"speaker":"oliver","mood":"sad","text":"Tell the girl... her father... was so proud..."},{"speaker":"narrator","text":"Oliver Ashworth, solicitor, sixty-one years old, dies on the steps of the Thames as the fog closes over him."}]},{"id":"c_chase_s","text":"Chase the shadow.","effects":{"reputation":10},"setFlags":["chased_shadow"],"response":[{"speaker":"narrator","text":"Down the Embankment, across the bridge, and into a black car with Swiss diplomatic plates."},{"speaker":"narrator","text":"When the chase is over, so is Oliver."}]},{"id":"c_police","text":"Call the police. Do this properly.","effects":{"trust":10,"reputation":-5},"setFlags":["called_police"],"response":[{"speaker":"narrator","text":"The Met arrive in eleven minutes. Oliver Ashworth has been dead for ten."}]}],"puzzle":"l_murder","next":[{"if":{"pov":"kolade","flags":["elise_deal"]},"to":"l3_dark"},{"to":"l3_pub"}]},{"id":"l3_pub","background":"london_night","lines":[{"speaker":"narrator","text":"A pub off the Strand, near closing. Nobody is drinking."},{"speaker":"narrator","if":{"notPov":"kolade","flags":["suspects_kolade"]},"text":"Kolade keeps checking his phone. Every time it buzzes, he turns it face down."},{"speaker":"tari","mood":"angry","text":"They killed him for a key. For a KEY."},{"speaker":"hadiza","text":"They killed him because he knew where the money went. And now so do we."}],"prompt":"London has already taken one life.","choices":[{"id":"c_confront_k","if":{"notPov":"kolade","flags":["suspects_kolade"]},"text":"\"Kolade. Who keeps calling you?\"","effects":{"trust":5},"setFlags":["confronted_kolade"],"response":[{"speaker":"kolade","mood":"surprised","text":"My mother."},{"speaker":"narrator","text":"Nobody believes him. Nobody can prove otherwise, either."}]},{"id":"c_vow","text":"\"We finish this. For the Chief, and for Oliver.\"","effects":{"trust":5,"reputation":5},"setFlags":["vowed"],"response":[{"speaker":"hadiza","text":"For Oliver."},{"speaker":"tari","text":"For the Chief."}]},{"id":"c_lone","text":"Trust no one at this table.","effects":{"trust":-5,"reputation":5},"setFlags":["lone_wolf"],"response":[{"speaker":"narrator","text":"In this game, the cautious ones live longest."}]}],"next":"l4_bridge"},{"id":"l3_dark","background":"london_night","lines":[{"speaker":"narrator","text":"A pub off the Strand, near closing. Kolade's phone buzzes. Geneva."},{"speaker":"phone","text":"Unfortunate about the solicitor. Bring me the key, Monsieur Balogun. Then the crown is yours."},{"speaker":"tari","mood":"angry","text":"They killed him for a key. For a KEY."},{"speaker":"narrator","text":"Across the table, Nabyen is crying without making a sound."}],"prompt":"Elise wants the key. The others are watching Kolade.","choices":[{"id":"c_confess","text":"Tell them everything about Elise's offer.","effects":{"trust":15,"reputation":-10},"setFlags":["confessed"],"response":[{"speaker":"tari","mood":"angry","text":"You WHAT?"},{"speaker":"hadiza","text":"...Then she trusts him. That's useful. Very useful."},{"speaker":"nabyen","mood":"sad","text":"Thank you for telling us. Don't ever lie to me again."}]},{"id":"c_betray","text":"Say nothing. Text Elise one word: 'Soon.'","effects":{"reputation":10,"trust":-15},"setFlags":["betrayer"],"echo":"There is no undoing this.","response":[{"speaker":"narrator","text":"Sent. Delivered. Read."}]}],"next":"l4_bridge"},{"id":"l4_bridge","background":"london_night","memory":"m_bridge","lines":[{"speaker":"narrator","if":{"notPov":"nabyen"},"text":"Westminster Bridge, two in the morning. Nabyen has been crying, and is pretending she hasn't."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"mood":"sad","text":"Everyone who gets close to this ends up dead."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"text":"Maybe you should go home."},{"speaker":"narrator","if":{"pov":"nabyen","flags":["spark_tari"]},"text":"Westminster Bridge, two in the morning. Tari found her, because Tari always finds her."},{"speaker":"tari","if":{"pov":"nabyen","flags":["spark_tari"]},"mood":"sad","text":"I'm not going home. Not without you."},{"speaker":"narrator","if":{"pov":"nabyen","flags":["spark_kolade"]},"text":"Westminster Bridge, two in the morning. Kolade found her, with two cups of terrible coffee."},{"speaker":"kolade","if":{"pov":"nabyen","flags":["spark_kolade"]},"mood":"smile","text":"Lagos can wait. You can't."},{"speaker":"narrator","if":{"pov":"nabyen","notFlags":["spark_tari","spark_kolade"]},"text":"Westminster Bridge, two in the morning. She's alone, and that's how she wanted it."}],"prompt":"Big Ben strikes two.","choices":[{"id":"c_kiss_n","if":{"notPov":"nabyen","flags":["spark_nabyen"]},"text":"Kiss her.","effects":{"affection":15},"setFlags":["romance_nabyen"],"response":[{"speaker":"narrator","text":"The fog swallows the bridge, the river, the whole city. For a moment, there's nobody left in London but the two of them."},{"speaker":"nabyen","mood":"smile","text":"...Okay. So that happened."}]},{"id":"c_stay_n","if":{"notPov":"nabyen"},"text":"\"I'm not going anywhere.\"","effects":{"affection":5,"trust":5},"setFlags":["promised_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"Good. I'd hate to have to come and find you."}]},{"id":"c_walk_back","if":{"notPov":"nabyen"},"text":"Walk her back to the hotel without a word.","effects":{"trust":5},"response":[{"speaker":"narrator","text":"Some silences say more than speeches. This is one of them."}]},{"id":"c_kiss_tari","if":{"pov":"nabyen","flags":["spark_tari"]},"text":"Kiss Tari.","effects":{"affection":15},"setFlags":["romance_tari"],"response":[{"speaker":"narrator","text":"He tastes like rain and the river. Big Ben strikes again, and neither of them hears it."},{"speaker":"tari","mood":"smile","text":"Twenty years I've wanted to do that."}]},{"id":"c_kiss_kolade","if":{"pov":"nabyen","flags":["spark_kolade"]},"text":"Kiss Kolade.","effects":{"affection":15},"setFlags":["romance_kolade"],"response":[{"speaker":"narrator","text":"The coffee goes into the Thames. Neither of them notices."},{"speaker":"kolade","mood":"smile","text":"For once in my life, I have nothing clever to say."}]},{"id":"c_call_mama","if":{"pov":"nabyen"},"text":"Call Mama Kaneng in Jos.","effects":{"affection":5,"trust":5},"response":[{"speaker":"kaneng","mood":"sad","text":"My daughter. Come home in one piece. That is all I'm asking."}]}],"next":null}],"outcomes":[{"id":"l_betray","if":{"flags":["betrayer"]},"title":"Thirty Pieces of Silver","text":"Kolade chose Elise. Nobody knows yet. Everybody will."},{"id":"l_confess","if":{"flags":["confessed"]},"title":"The Confession","text":"Kolade told the truth when lying would have been easier. That's rarer than gold."},{"id":"l_kiss","if":{"anyFlags":["romance_nabyen","romance_tari","romance_kolade"]},"title":"A Kiss in the Fog","text":"A man died tonight, and something else began. London is like that."},{"id":"l_death","title":"Death on the Embankment","text":"Oliver Ashworth died for a brass key. The killers are already in Geneva."}],"reflections":[{"if":{"flags":["stayed_oliver"]},"text":"Oliver's last words were for Nabyen."},{"if":{"flags":["chased_shadow"]},"text":"Swiss diplomatic plates. Whoever this is, they're protected."}],"secrets":{"s_shame":{"title":"Oliver's diary","text":"SHAME. From Oliver's diary, found in his coat: 'My shame: I knew about Geneva for two years and said nothing.'"}},"memories":{"m_london":{"title":"Rain at Lincoln's Inn","background":"london","text":"Red buses, old paper, and a frightened man with a key."},"m_bridge":{"title":"Westminster, 2 a.m.","background":"london_night","text":"Fog, lamplight, and Big Ben striking two."}}},"chapters/c4_alps.json":{"id":"c4_alps","number":4,"title":"The Vault in the Alps","place":"Geneva and Zermatt, Switzerland","teaser":"A blue lake, a vault that only opens for blood, and a choice on the mountain that someone won't come back from.","start":"a1_geneva","scenes":[{"id":"a1_geneva","background":"geneva","memory":"m_geneva","lines":[{"speaker":"narrator","text":"Geneva. A lake so blue it looks painted, and a fountain throwing water a hundred and forty metres into the sky."},{"speaker":"narrator","text":"Banque Moreau is a grey stone building with no sign on the door."},{"speaker":"elise","mood":"smile","text":"Welcome. Elise Moreau. I was so sorry to hear about Mr Ashworth. London is a dangerous city."},{"speaker":"elise","if":{"flags":["betrayer"]},"mood":"smile","text":"And Monsieur Balogun. How nice to see a familiar face."},{"speaker":"narrator","if":{"flags":["betrayer"]},"text":"Every head turns toward Kolade."},{"speaker":"elise","text":"Chief Okoro's box requires his key and the blood of an Okoro. I'm afraid none of you qualify."}],"next":"a2_vault"},{"id":"a2_vault","background":"vault","memory":"m_vault","lines":[{"speaker":"narrator","text":"Ten floors underground, a round steel door older than the bank above it."},{"speaker":"narrator","text":"The brass key turns. The vault doesn't open. Beside the lock is a small glass plate, the size of a fingertip."},{"speaker":"nabyen","mood":"worried","text":"The blood of an Okoro..."},{"speaker":"narrator","text":"Nabyen presses her finger to the glass. A needle, a single drop of red, and the great door begins to turn."},{"speaker":"elise","mood":"surprised","text":"That's... impossible."},{"speaker":"narrator","text":"Inside: the second half of the will, half of a coral bracelet that matches Nabyen's exactly, and a ledger bound in black leather."},{"speaker":"letter","text":"To my daughter Nabyen, and to the three children I chose: the crown belongs to whoever you choose, together. Elise Moreau has robbed me for ten years. The proof is in this book. — G.O."},{"speaker":"elise","mood":"angry","text":"Guards!"}],"prompt":"Elise Moreau's guards are pounding down the stairs.","choices":[{"id":"c_grab","text":"Grab the ledger and run.","effects":{"reputation":5},"setFlags":["has_ledger"],"response":[{"speaker":"narrator","text":"Up the stairs, through the lobby, out into the sunlight with alarms screaming."}]},{"id":"c_hold","text":"Hold the vault door so the others can get out.","effects":{"trust":10,"reputation":5},"setFlags":["has_ledger","held_door"],"response":[{"speaker":"narrator","text":"Steel against shoulder, ten seconds that feel like ten years. Long enough."}]}],"puzzle":"a_geneva","next":"a3_train"},{"id":"a3_train","background":"alps","lines":[{"speaker":"narrator","text":"The mountain train to Zermatt. Snow, pines, and a red carriage crawling up the edge of the world."},{"speaker":"narrator","text":"Elise's men are two carriages behind them."},{"speaker":"hadiza","mood":"worried","text":"There's a footpath from the next station down to the police post at Täsch. Steep, and in this weather, deadly."},{"speaker":"hadiza","text":"One person carries the ledger down. The rest of us lead them up the mountain."},{"speaker":"narrator","if":{"flags":["betrayer"]},"text":"Kolade is texting. Elise's men know exactly which carriage they're in."}],"prompt":"Who carries the ledger down the mountain?","choices":[{"id":"c_send_tari","if":{"notPov":"tari"},"text":"Tari. He's the strongest of us.","effects":{"trust":5},"setFlags":["sent_tari","dead_tari","elise_caught"],"echo":"Nobody says goodbye properly.","response":[{"speaker":"tari","mood":"smile","text":"Easy. It's only downhill."}]},{"id":"c_send_hadiza","if":{"notPov":"hadiza"},"text":"Hadiza. She knows exactly what the ledger proves.","effects":{"trust":5},"setFlags":["sent_hadiza","dead_hadiza","elise_caught"],"echo":"Nobody says goodbye properly.","response":[{"speaker":"hadiza","text":"Page by page. Don't wait for me."}]},{"id":"c_send_kolade","if":{"notPov":"kolade"},"text":"Kolade. Lagos men run fast.","effects":{"trust":5},"setFlags":["sent_kolade","dead_kolade","elise_caught"],"echo":"Nobody says goodbye properly.","response":[{"speaker":"kolade","mood":"smile","text":"Finally, a job that pays in glory."}]},{"id":"c_send_self","text":"Carry it yourself.","effects":{"reputation":10},"setFlags":["went_self","elise_escaped"],"response":[{"speaker":"narrator","text":"{pov} zips the ledger into a coat pocket and steps off the train into the white."}]}],"puzzle":"a_snow","next":"a4_storm"},{"id":"a4_storm","background":"alps_storm","memory":"m_storm_alps","lines":[{"speaker":"narrator","text":"The storm comes in off the Matterhorn like the end of the world."},{"speaker":"narrator","if":{"flags":["sent_tari"]},"text":"Tari reaches the police post at Täsch with the ledger inside his jacket. The police find two bullets in him, and not one in the ledger."},{"speaker":"tari","if":{"flags":["sent_tari"]},"mood":"sad","text":"Tell Nabyen... I owe her... a fish..."},{"speaker":"narrator","if":{"flags":["sent_tari"]},"text":"Tari Ebiowei, Prince of the Creeks, dies in the snow, very far from the river."},{"speaker":"narrator","if":{"flags":["sent_hadiza"]},"text":"Hadiza reaches the police post at Täsch an hour after dark, the ledger dry and every page in order. Then she sits down in the snow and doesn't get up."},{"speaker":"hadiza","if":{"flags":["sent_hadiza"]},"mood":"sad","text":"Count it... properly... all of it..."},{"speaker":"narrator","if":{"flags":["sent_hadiza"]},"text":"Hadiza Lawan, the sharpest mind in Kano, dies with the numbers balanced."},{"speaker":"narrator","if":{"flags":["sent_kolade"]},"text":"Kolade reaches the police post at Täsch running on pride and nothing else. Elise's men reach it a minute later."},{"speaker":"kolade","if":{"flags":["sent_kolade"]},"mood":"sad","text":"Tell Lagos... I earned it..."},{"speaker":"narrator","if":{"flags":["sent_kolade"]},"text":"Kolade Balogun dies with his phone still recording. The recording is enough to convict Elise twice over."},{"speaker":"narrator","if":{"flags":["elise_caught"]},"text":"The Swiss police arrest Elise Moreau at her chalet before midnight. Her lawyers arrive by breakfast. It won't help her."},{"speaker":"narrator","if":{"flags":["went_self"]},"text":"{pov} carries the ledger down alone. Frostbitten, half-blind, alive."},{"speaker":"narrator","if":{"flags":["went_self"]},"text":"But by the time the police reach the chalet, Elise Moreau is gone. Everyone else came down the mountain."},{"speaker":"narrator","if":{"flags":["betrayer"]},"text":"The others know now what Kolade did. Elise made sure of it, out of spite."}],"prompt":"The storm is passing.","choices":[{"id":"c_justice","if":{"flags":["elise_caught"]},"text":"Hand everything to the Swiss courts. Let the law have her.","effects":{"trust":10},"setFlags":["justice"],"response":[{"speaker":"narrator","text":"Elise Moreau will spend the next twenty years looking at a very small piece of Swiss sky."}]},{"id":"c_deal","if":{"flags":["elise_caught"]},"text":"Offer Elise a deal: return every franc, and she walks.","effects":{"reputation":10,"trust":-10},"setFlags":["deal_elise"],"response":[{"speaker":"elise","mood":"smile","text":"You're more like him than you know."},{"speaker":"narrator","text":"Forty million dollars comes home. The woman who stole it walks free."}]},{"id":"c_hunt","if":{"flags":["elise_escaped"]},"text":"\"Wherever she runs, we'll find her.\"","effects":{"reputation":5},"setFlags":["vengeance"],"response":[{"speaker":"narrator","text":"Somewhere, a woman with pale hair is buying a ticket to somewhere warm."}]},{"id":"c_let","if":{"flags":["elise_escaped"]},"text":"Let her go. You have the truth, and everyone is alive.","effects":{"affection":10},"setFlags":["mercy"],"response":[{"speaker":"narrator","text":"Everyone is alive. In this story, that's the rarest treasure of all."}]}],"next":null}],"outcomes":[{"id":"a_tari","if":{"flags":["dead_tari"]},"title":"The Prince Falls","text":"Tari carried the ledger down the mountain and gave his life for it. The creeks will sing about him for a hundred years."},{"id":"a_hadiza","if":{"flags":["dead_hadiza"]},"title":"The Last Ledger","text":"Hadiza carried the proof down the mountain, every page in order. Kano has lost its sharpest mind."},{"id":"a_kolade","if":{"flags":["dead_kolade"]},"title":"The Banker's Debt","text":"Kolade wanted to earn it. On the mountain, he paid in full."},{"id":"a_self","title":"Alone on the Mountain","text":"You carried it yourself. Everyone lived. Elise escaped. Every choice has a price."}],"reflections":[{"if":{"flags":["held_door"]},"text":"Ten seconds at the vault door. The others won't forget them."},{"if":{"flags":["deal_elise"]},"text":"The money came home. Justice didn't."}],"secrets":{"s_wolf":{"title":"Le Loup","text":"WOLF. In Banque Moreau's private files, Elise signed every stolen transfer 'Le Loup'. The wolf."}},"memories":{"m_geneva":{"title":"The Blue Lake","background":"geneva","text":"A fountain touching the sky, and a bank with no sign."},"m_vault":{"title":"Blood and Steel","background":"vault","text":"One drop of red, and a door that remembered who her father was."},"m_storm_alps":{"title":"The Storm on the Pass","background":"alps_storm","text":"Somebody didn't come back down the mountain."}}},"chapters/c5_caribbean.json":{"id":"c5_caribbean","number":5,"title":"Where the Rivers Meet","place":"Tobago, the Caribbean","teaser":"Turquoise water, a pink house on the hill, the Chief's long-lost brother, and the vote for the crown.","start":"c1_beach","scenes":[{"id":"c1_beach","background":"caribbean","memory":"m_tobago","lines":[{"speaker":"narrator","text":"Tobago. Water the colour of a peacock's throat, sand like sugar, and a pink house on the hill above Castara Bay."},{"speaker":"marcus","mood":"smile","text":"So. The children my brother collected. Come, come. There's fish on the fire and rum in the shade."},{"speaker":"marcus","text":"I'm Marcus, Gideon's little brother. Our mother was from Trinidad. He got the empire and I got the sea. I think I got the better deal."},{"speaker":"marcus","if":{"flags":["dead_tari"]},"mood":"sad","text":"I'm sorry about the boy from the creeks. Gideon wrote about him every Christmas."},{"speaker":"marcus","if":{"flags":["dead_hadiza"]},"mood":"sad","text":"Gideon said the Lawan girl could count the stars and tell you which ones were missing. I'm so sorry."},{"speaker":"marcus","if":{"flags":["dead_kolade"]},"mood":"sad","text":"The Lagos boy. Gideon said he was all ambition and no peace. I hope he has peace now."},{"speaker":"marcus","text":"I have the last seal, and his last instruction: you choose. Together."}],"prompt":"Marcus pours the rum.","choices":[{"id":"c_toast","text":"Raise a glass to Chief Gideon.","effects":{"affection":5},"response":[{"speaker":"marcus","mood":"smile","text":"To my big, loud, impossible brother."}]},{"id":"c_toast_fallen","text":"Raise a glass to everyone this crown has cost.","effects":{"trust":5},"resp   profile = { ...res.profile, coins: res.profile.coins + extra, puzzleProgress: null };
  ui.overlay = {
    type: 'solved',
    stars,
    coins: res.reward.coins + extra,
    streak: res.reward.streak,
    hintsGained: res.reward.hintsGained,
    words: [...p.state.found, ...p.state.bonus],
    context: p.context,
  };
  if (p.context === 'story') {
    profile.run = Story.completePuzzle(currentChapter(), profile.run, p.puzzle.id, {
      stars,
      coins: res.reward.coins + extra,
      words: [...p.state.found, ...p.state.bonus],
      flags: p.secretFlags,
    });
  } else {
    const daily = Progress.completeDaily(profile, ui.daily.key);
    profile = daily.profile;
    ui.overlay.daily = daily.reward;
  }
  persist();
}

function renderOverlay() {
  const o = ui.overlay;
  if (!o) return '';
  if (o.type === 'solved') {
    const stars = [1, 2, 3].map((n) => `<span class="${n <= o.stars ? 'on' : ''}">★</span>`).join('');
    const extras = [
      `+${o.coins} 🪙`,
      o.streak > 1 ? `🔥 ${o.streak} in a row` : '',
      o.hintsGained ? `+${o.hintsGained} 💡` : '',
      o.daily ? `+${o.daily.coins} 🪙 +${o.daily.stars} ⭐ daily · 🔥 ${o.daily.streak} day${o.daily.streak === 1 ? '' : 's'}` : '',
    ].filter(Boolean);
    return `<div class="overlay"><div class="sheet pop">
      <h2>Solved</h2>
      <div class="stars">${stars}</div>
      <p class="reward-line">${extras.map(esc).join(' · ')}</p>
      <p class="chips">${o.words.map((w) => `<span class="chip">${esc(w)}</span>`).join('')}</p>
      <button class="btn primary" data-action="overlay-continue">${o.context === 'story' ? 'Continue the story' : 'Done'}</button>
    </div></div>`;
  }
  if (o.type === 'confirm-reset') {
    return `<div class="overlay"><div class="sheet pop">
      <h2>Start over?</h2>
      <p>This erases your choices, words, memories and rewards.</p>
      <button class="btn danger" data-action="reset-confirm">Erase progress</button>
      <button class="btn" data-action="overlay-close">Keep playing</button>
    </div></div>`;
  }
  return '';
}

// --- Results ----------------------------------------------------------------

function finishChapter() {
  const run = profile.run;
  if (run.finished) return;
  const chapter = currentChapter();
  const outcome = Story.pickOutcome(chapter, run);
  const res = Progress.completeChapter(profile, chapter.id, outcome?.id);
  // Endings (including the secret one) are recorded by the flags their
  // scenes set, so a secret ending and a main ending can both count.
  const endings = run.flags.filter((f) => f.startsWith('end_'));
  profile = { ...res.profile, lastStats: run.stats, endings: [...new Set([...res.profile.endings, ...endings])] };
  profile.run = { ...run, finished: true, chapterReward: res.reward, outcomeId: outcome?.id ?? null };
  persist();
}

function statBar(name, value) {
  return `<div class="stat"><span>${name}</span><div class="bar"><i style="width:${value}%"></i></div><b>${value}</b></div>`;
}

const FALLEN = ['tari', 'hadiza', 'kolade'];
const fallenIn = (run) => FALLEN.filter((id) => run.flags.includes(`dead_${id}`));
const endingsSeen = () => profile.endings.filter((e) => e.startsWith('end_')).length;

function renderResults() {
  const run = profile.run;
  if (!run?.complete) return renderHome();
  setScene(null);
  const chapter = currentChapter();
  const outcome = (chapter.outcomes || []).find((o) => o.id === run.outcomeId);
  const reflections = (chapter.reflections || []).filter((r) => Story.checkCondition(r.if, run));
  const puzzles = Object.values(run.puzzles);
  const stars = puzzles.reduce((s, p) => s + p.stars, 0) + (run.chapterReward?.stars ?? 0);
  const coins = puzzles.reduce((s, p) => s + p.coins, 0) + (run.chapterReward?.coins ?? 0);
  const words = puzzles.reduce((s, p) => s + p.words.length, 0);
  const next = Story.nextChapter(C.story, run.chapterId, run);
  const nextChapter = next && chapterById(next.id);
  const fallen = fallenIn(run).map((id) => C.characters[id].name);
  const isFinale = !next && chapter.number > 0;
  return `<main class="screen results">
    ${topbar(chapter.number === 0 ? 'Prologue' : `${chapterLabel(chapter)} of ${C.story.totalChapters}`)}
    <p class="eyebrow center">${isFinale ? 'The end' : `${chapterLabel(chapter)} complete`}</p>
    <h1 class="center">${esc(chapter.title)}</h1>
    ${outcome ? `<section class="card outcome"><h2>${esc(outcome.title)}</h2><p>${fmt(outcome.text)}</p>
      ${reflections.length ? `<ul>${reflections.map((r) => `<li>${fmt(r.text)}</li>`).join('')}</ul>` : ''}</section>` : ''}
    ${fallen.length || run.flags.includes('dead_oliver') ? `<section class="card fallen"><h3>The fallen</h3><p>Chief Gideon Okoro${run.flags.includes('dead_oliver') ? ' · Oliver Ashworth' : ''}${fallen.map((n) => ` · ${esc(n)}`).join('')}</p></section>` : ''}
    ${chapter.number > 0 ? `<section class="card">
      ${statBar('Trust', run.stats.trust)}
      ${statBar('Affection', run.stats.affection)}
      ${statBar('Reputation', run.stats.reputation)}
    </section>` : ''}
    <section class="card reward-grid">
      <div><b>⭐ ${stars}</b><span>stars</span></div>
      <div><b>🪙 ${coins}</b><span>coins</span></div>
      <div><b>${words}</b><span>words</span></div>
      <div><b>🔍 ${profile.secrets.length}</b><span>secrets</span></div>
    </section>
    ${run.choices.length ? `<section class="card path">
      <h3>Your path</h3>
      <p class="muted">Wonder what would have happened? Rewind to any decision.</p>
      <ol>${run.choices
        .map((c, i) => `<li><div><span>${fmt(c.text)}</span><button class="mini" data-action="rewind" data-i="${i}" aria-label="Replay from this choice">↺</button></div></li>`)
        .join('')}</ol>
    </section>` : ''}
    ${isFinale ? `<p class="muted center">Endings seen: ${endingsSeen()} of ${C.story.totalEndings}. Play as another house to see the rest.</p>` : ''}
    <div class="actions">
      ${chapter.number > 0 ? '<button class="btn" data-action="replay">Replay chapter</button>' : ''}
      ${nextChapter
        ? `<button class="btn primary" data-action="next-chapter">${chapterLabel(nextChapter)}: ${esc(nextChapter.title)} →</button>`
        : '<button class="btn primary" data-action="new-saga">Start a new story</button>'}
    </div>
  </main>`;
}

// --- Profile and memories ---------------------------------------------------

function renderProfile() {
  setScene(null);
  const run = profile.run;
  const chapter = run && currentChapter();
  const stats = run?.stats ?? profile.lastStats;
  const row = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
  const fallen = run ? fallenIn(run).map((id) => C.characters[id].name) : [];
  return `<main class="screen profile">
    ${topbar('Your story')}
    <section class="card">
      ${row('Playing as', run?.pov ? esc(C.characters[run.pov].fullName) : '—')}
      ${row('Chapter', chapter ? `${chapter.number}/${C.story.totalChapters}` : '—')}
      ${row('Words Found', profile.wordsFound.length)}
      ${row('Trust', stats?.trust ?? '—')}
      ${row('Affection', stats?.affection ?? '—')}
      ${row('Reputation', stats?.reputation ?? '—')}
      ${row('Secrets Discovered', `${profile.secrets.length}/${C.story.totalSecrets}`)}
      ${row('Endings seen', `${endingsSeen()}/${C.story.totalEndings}`)}
      ${fallen.length ? row('Fallen', esc(fallen.join(', '))) : ''}
    </section>
    <section class="card">
      ${row('⭐ Stars', profile.stars)}
      ${row('🪙 Coins', profile.coins)}
      ${row('💡 Hints', profile.hints)}
      ${row('🔥 Best word streak', profile.bestStreak)}
      ${row('📅 Daily streak', profile.daily.streak)}
    </section>
    <button class="btn link danger" data-action="reset">Reset progress</button>
  </main>`;
}

function renderMemories() {
  setScene(null);
  const cards = C.chapters.flatMap((ch) =>
    Object.entries(ch.memories || {}).map(([id, m]) =>
      profile.memories.includes(id)
        ? `<figure class="memory"><div class="memory-art">${sceneSVG(m.background)}</div><figcaption><b>${esc(m.title)}</b><span>${esc(m.text)}</span></figcaption></figure>`
        : `<figure class="memory locked"><figcaption><b>???</b><span>Keep playing to remember.</span></figcaption></figure>`,
    ),
  );
  const found = (C.story.secretFlags || [])
    .filter((id) => profile.secrets.includes(id))
    .map((id) => secretById(id))
    .map((s) => `<li><b>${esc(s.title)}</b><span>${esc(s.text)}</span></li>`);
  const hidden = C.story.totalSecrets - found.length;
  return `<main class="screen memories">
    ${topbar('Memories')}
    <div class="memory-grid">${cards.join('')}</div>
    <h3>Secrets <small>${found.length}/${C.story.totalSecrets}</small></h3>
    <ul class="secrets">${found.join('')}${hidden > 0 ? `<li class="locked"><b>${hidden} still hidden</b><span>Some words hide more than they say. Find four in one story to unlock the secret ending.</span></li>` : ''}</ul>
  </main>`;
}

// --- Daily Word -------------------------------------------------------------

function openDaily() {
  const key = Progress.dateKey();
  if (ui.daily?.key !== key) {
    ui.daily = { key, entry: Progress.dailyEntryFor(C.daily.entries, key), lineIndex: 0, phase: 'lines' };
  }
  go('daily');
}

function renderDaily() {
  const d = ui.daily;
  const e = d.entry;
  if (Progress.dailyDone(profile, d.key) && !ui.overlay) {
    setScene(e.background, 'full');
    return `<main class="screen story">
      ${topbar('Daily Word')}
      <div class="stage"></div>
      <div class="dialogue narration"><p class="speaker">${esc(e.title)}</p>
        <p class="line">Today's story is told. Come back tomorrow for the next one.</p>
        <p class="muted-light">🔥 ${profile.daily.streak} day streak</p>
        <button class="btn primary" data-action="home">Home</button></div>
    </main>`;
  }
  if (d.phase === 'puzzle') {
    setScene(e.background, 'dim');
    startPuzzle(`daily:${d.key}`, e.puzzle, 'daily');
    return renderPuzzle('Daily Word');
  }
  setScene(e.background, 'full');
  return `<main class="screen story" data-action="daily-advance">
    ${topbar(`Daily Word · ${e.title}`)}
    ${lineHTML(e.lines[d.lineIndex], null)}
  </main>`;
}

// --- Input ------------------------------------------------------------------

function startNewSaga() {
  profile.run = Story.newRun(C.chapters[0]);
  profile.puzzleProgress = null;
  ui.puzzle = null;
  persist();
  go('story');
}

const actions = {
  home: () => go('home'),
  profile: () => go('profile'),
  memories: () => go('memories'),
  daily: openDaily,
  play() {
    if (!profile.run) return startNewSaga();
    go(profile.run.complete ? 'results' : 'story');
  },
  'new-saga': startNewSaga,
  'next-chapter'() {
    const run = profile.run;
    const next = Story.nextChapter(C.story, run.chapterId, run);
    if (!next) return;
    profile.run = Story.newRun(chapterById(next.id), Story.carryFrom(run));
    profile.puzzleProgress = null;
    ui.puzzle = null;
    persist();
    go('story');
  },
  replay() {
    const run = profile.run;
    profile.run = Story.newRun(currentChapter(), run.carry);
    profile.puzzleProgress = null;
    ui.puzzle = null;
    persist();
    go('story');
  },
  rewind(el) {
    profile.run = Story.restoreCheckpoint(currentChapter(), profile.run, Number(el.dataset.i));
    profile.puzzleProgress = null;
    ui.puzzle = null;
    persist();
    go('story');
  },
  advance() {
    profile.run = Story.advance(currentChapter(), profile.run);
    persist();
    render();
  },
  choose(el) {
    const { run, choice } = Story.choose(currentChapter(), profile.run, el.dataset.id);
    profile.run = run;
    collectSecrets(run.flags);
    persist();
    if (choice.echo) toast(choice.echo);
    if (choice.pov) toast(`You are ${C.characters[choice.pov].fullName}.`);
    render();
  },
  'daily-advance'() {
    const d = ui.daily;
    if (d.lineIndex + 1 < d.entry.lines.length) d.lineIndex += 1;
    else d.phase = 'puzzle';
    render();
  },
  tile(el) {
    const i = Number(el.dataset.i);
    const p = ui.puzzle;
    if (!p.guess.includes(i) && !p.state.disabledTiles.includes(i)) {
      p.guess.push(i);
      p.feedback = '';
      render();
    }
  },
  backspace() {
    ui.puzzle.guess.pop();
    render();
  },
  clear() {
    ui.puzzle.guess = [];
    render();
  },
  shuffle() {
    ui.puzzle.order = shuffledOrder(ui.puzzle.puzzle.letters.length);
    render();
  },
  submit: submitGuess,
  hint: useHint,
  'overlay-continue'() {
    const context = ui.overlay?.context;
    ui.overlay = null;
    ui.puzzle = null;
    if (context === 'daily') go('home');
    else render();
  },
  'overlay-close'() {
    ui.overlay = null;
    render();
  },
  reset() {
    ui.overlay = { type: 'confirm-reset' };
    render();
  },
  'reset-confirm'() {
    profile = Progress.reset(storage);
    ui.puzzle = null;
    ui.daily = null;
    go('home');
  },
};

function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  // While an overlay is up, only its own buttons respond.
  if (ui.overlay && !el.closest('.overlay')) return;
  actions[el.dataset.action]?.(el);
}

function onKey(e) {
  if (e.metaKey || e.ctrlKey || e.altKey || ui.overlay) return;
  const inPuzzle = app.querySelector('.screen.puzzle');
  if (inPuzzle) {
    const p = ui.puzzle;
    if (e.key === 'Enter') return submitGuess();
    if (e.key === 'Backspace') return actions.backspace();
    const letter = e.key.length === 1 ? e.key.toUpperCase() : '';
    const i = p.order.find((idx) => p.puzzle.letters[idx] === letter && !p.guess.includes(idx) && !p.state.disabledTiles.includes(idx));
    if (i !== undefined) {
      p.guess.push(i);
      p.feedback = '';
      render();
    }
    return;
  }
  if (e.key === ' ' || e.key === 'Enter') {
    const tappable = app.querySelector('main[data-action]');
    if (tappable) {
      e.preventDefault();
      actions[tappable.dataset.action]?.(tappable);
    }
  }
}

boot();

return {  };
})();
})();
</script>
</body>
</html>
