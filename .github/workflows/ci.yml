name: CI
on:
  push:
  pull_request:
jobs:
  tradesys:
    name: Crypto trading system
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest -q
      - name: Doctests
        run: python -m pytest --doctest-modules src/tradesys -q
      - name: Phase 0 gates
        run: python -m tradesys.cli selfcheck
      - name: Chaos scenarios
        run: python -m tradesys.cli chaos
