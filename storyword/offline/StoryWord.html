o","lines":[{"speaker":"narrator","text":"Something strange happened at the Kofar Mata dye pits this morning…"},{"speaker":"hadiza","mood":"smile","text":"Every pit turned purple overnight. The dyers say it's a blessing. I say it's chemistry."}],"puzzle":{"id":"daily_indigo","theme":"kano","prompt":"The dye pits glow in the morning light.","hint":"Kano's most famous colour.","letters":["I","N","D","I","G","O"],"requiredWords":["INDIGO","DOING","DING"],"bonusWords":["DIG","DIN","DOG","DON","GIN","GOD","ING","ION","NOD","DINO","DONG"]}},{"id":"d_lantern","title":"The Empty Canoe","background":"bayelsa","lines":[{"speaker":"narrator","text":"Something strange happened on the creeks this morning…"},{"speaker":"tari","mood":"worried","text":"A canoe drifted up to the jetty with nobody in it. Just a lantern, still burning."}],"puzzle":{"id":"daily_lantern","theme":"creeks","prompt":"A lantern burning in an empty canoe.","hint":"A light you carry in the dark.","letters":["L","A","N","T","E","R","N"],"requiredWords":["LANTERN","LATER","RENT"],"bonusWords":["ALE","ALT","ANN","ANT","ARE","ART","ATE","EAN","EAR","EAT","ERA","ETA","LAT","LEA","LET","NAN","NAT","NET","RAN","RAT","REN","RET","TAN","TAR","TEA","TEL","TEN","ANTE","EARL","EARN","LANE","LATE","LEAN","LENT","NEAL","NEAR","NEAT","RANT","RATE","REAL","TALE","TEAL","TEAR","ALERT","ALTER","LEARN","RENAL","LEARNT","RENTAL","TANNER"]}},{"id":"d_ocean","title":"Message in a Shell","background":"caribbean","lines":[{"speaker":"narrator","text":"Something strange washed up in Tobago this morning…"},{"speaker":"marcus","mood":"smile","text":"A conch shell on my doorstep, and inside it a ring. Gold, with two rivers engraved on it."}],"puzzle":{"id":"daily_ocean","theme":"caribbean","prompt":"The tide brings in a shell with a ring inside.","hint":"What the shell came out of.","letters":["O","C","E","A","N","S"],"requiredWords":["OCEAN","CANOE","ONCE"],"bonusWords":["ACE","ANS","CAN","CON","COS","EAN","EAS","ECO","NAS","NOS","ONE","ONS","SAC","SAN","SEA","SEC","SEN","SOC","SON","ACES","ACNE","CANE","CANS","CASE","CONE","CONS","NOSE","ONES","SANE","SCAN","SEAN","OCEANS"]}}]},"chapters/prologue.json":{"id":"prologue","number":0,"title":"The Last Storm","place":"Port Harcourt, Rivers State","teaser":"A storm over the Bonny River. Four letters sealed in red wax. One old lion who won't see morning.","start":"pr_dream","initialStats":{"trust":50,"affection":50,"reputation":50,"desire":50,"control":50,"loyalty":50},"scenes":[{"id":"pr_dream","background":"dream_river","music":"mystic","memory":"m_dream","lines":[{"speaker":"narrator","text":"Before the storm. Before the letters. Before anyone died."},{"speaker":"narrator","text":"On the night it began, in Jos, Nabyen Dalyop dreamed of a river she had never seen."},{"speaker":"narrator","text":"Black water. A thousand floating lanterns. And a woman in white, standing on the surface as if it were glass.","sfx":"whisper"},{"speaker":"river","text":"Two halves, daughter of the Rock. When they meet, the river will choose."},{"speaker":"river","text":"Someone is watching you. Someone has always been watching you."},{"speaker":"narrator","text":"Nabyen woke with river water on her pillow."},{"speaker":"narrator","text":"And on her windowsill, three floors up, a single red rose that had not been there when she fell asleep.","sfx":"sting_reveal"},{"speaker":"narrator","text":"Four hundred kilometres south, in Port Harcourt, an old man was writing his last letters."}],"next":"pr_storm"},{"id":"pr_storm","background":"ph_night","memory":"m_storm","lines":[{"speaker":"narrator","text":"Port Harcourt. The rain came in off the Bonny River like it had a grudge.","sfx":"thunder"},{"speaker":"narrator","text":"In the big house on the waterfront, Chief Gideon Okoro sat alone with a cup of tea that had gone cold."},{"speaker":"narrator","text":"Ships in the Delta. Tin on the Plateau. Cloth in Kano. Money in Lagos. Everything he touched became an empire."},{"speaker":"narrator","text":"Through the rain-streaked window, for one moment, he thought he saw a woman in white standing on the river. He had seen her once before, forty years ago. The night his father died.","sfx":"whisper"},{"speaker":"gideon","mood":"worried","text":"Four rivers. One crown. And not one of them knows what I have done."},{"speaker":"gideon","mood":"sad","text":"Forgive me, Kaneng. I should have come back for you. For both of you."},{"speaker":"narrator","text":"A silver spoon lay on the saucer beside his cup. A gift from Geneva. He had stirred his tea with it twice."},{"speaker":"narrator","text":"Somewhere in the house, a door closed very softly. The Chief did not hear it.","sfx":"door"},{"speaker":"narrator","text":"He sealed four letters with red wax, pressed his ring into each one, and called for his driver."},{"speaker":"gideon","text":"If I do not wake up, send them. All four. Before the vultures land."}],"puzzle":"pr_crown","next":"pr_dawn","keepsake":"k_voice_gideon","music":"night","tension":true},{"id":"pr_dawn","background":"ph_day","lines":[{"speaker":"narrator","text":"Chief Gideon Okoro did not wake up.","sfx":"sting_death"},{"speaker":"narrator","text":"By dawn, four letters were racing across Nigeria: north to the granite rocks of Jos, south to the creeks of Bayelsa, up to the ancient walls of Kano, and west to Lagos, which never sleeps."},{"speaker":"narrator","text":"Four houses. One crown. A death that started everything."}],"prompt":"Whose story will you follow?","choices":[{"id":"pick_nabyen","pov":"nabyen","text":"Nabyen Dalyop, House of the Rock"},{"id":"pick_tari","pov":"tari","text":"Tari Ebiowei, House of the Creeks"},{"id":"pick_hadiza","pov":"hadiza","text":"Hadiza Lawan, House of the Walls"},{"id":"pick_kolade","pov":"kolade","text":"Kolade Balogun, House of the Lagoon"}],"next":null,"music":"title"}],"outcomes":[{"id":"pro_nabyen","if":{"pov":"nabyen"},"title":"The Daughter of the Rock","text":"You follow Nabyen. The letter in her hands has her name on it twice, and she doesn't yet know why."},{"id":"pro_tari","if":{"pov":"tari"},"title":"The Prince of the Creeks","text":"You follow Tari. The Chief pulled him from the river as a boy. Now the river wants something back."},{"id":"pro_hadiza","if":{"pov":"hadiza"},"title":"The Keeper of Ledgers","text":"You follow Hadiza. In Kano, the walls listen, and she has always listened better."},{"id":"pro_kolade","title":"The Lagos Gambler","text":"You follow Kolade. He wants the crown. The only question is what he'll trade for it."}],"memories":{"m_storm":{"title":"The Last Storm","background":"ph_night","text":"Red wax, four letters, and a cold cup of tea."},"m_dream":{"title":"The Woman in the Water","background":"dream_river","text":"Black water, a thousand lanterns, and a rose that should not have been there."}},"initialRel":{"tari":{"intimacy":10,"tension":30},"kolade":{"intimacy":20,"tension":60},"hadiza":{"intimacy":15,"tension":40},"nabyen":{"intimacy":15,"tension":30}},"keepsakes":{"k_voice_gideon":{"type":"voice","title":"A voice note, never sent","from":"Chief Gideon Okoro","text":"Kaneng. It's me. Thirty years, and I still can't say it properly. I'm sorry. Tell her... no. I'll tell her myself. Soon."}},"epigraph":{"text":"The river remembers every name it has ever been told.","source":"Nana Rinji's diary"}},"chapters/c1_nabyen.json":{"id":"c1_nabyen","number":1,"title":"Daughter of the Rock","place":"Jos, Plateau State","teaser":"Granite hills, blue tourmaline, and a letter that turns Nabyen's whole life upside down.","start":"n1_rocks","scenes":[{"id":"n1_rocks","background":"jos","memory":"m_jos","lines":[{"speaker":"narrator","text":"Jos, Plateau State. Morning sun on the granite hills, and air cool enough to make Lagos jealous."},{"speaker":"narrator","text":"Nabyen Dalyop had a tray of blue tourmaline in one hand and a customer haggling in her ear when the boy came running."},{"speaker":"nabyen","mood":"smile","text":"Slow down, Dung! Who is chasing you?"},{"speaker":"narrator","text":"He pressed an envelope into her hands. Red wax, stamped with two rivers meeting."},{"speaker":"letter","text":"Nabyen. If you are reading this, I am gone. Come to Port Harcourt. Trust the rivers, not the men who sail them. — G.O."},{"speaker":"narrator","text":"Pressed flat inside the envelope: a single red rose petal. Like the rose on her windowsill.","sfx":"sting_reveal"},{"speaker":"nabyen","mood":"surprised","text":"Chief Gideon Okoro? THE Chief Gideon? Why would a man like that write to me?"},{"speaker":"kaneng","mood":"surprised","text":"Give me that."},{"speaker":"narrator","text":"Her mother's hands were shaking."}],"prompt":"Mama Kaneng is hiding something.","choices":[{"id":"c_press","text":"\"Mama. What aren't you telling me?\"","effects":{"trust":-5,"affection":5,"control":5},"setFlags":["pressed_mama"],"response":[{"speaker":"kaneng","mood":"sad","text":"Not here. Not in front of the whole market. Tonight, at the rocks."}],"tag":"CONTROL"},{"id":"c_watch","text":"Say nothing. Watch her face.","effects":{"trust":5,"loyalty":5},"setFlags":["watched_mama"],"response":[{"speaker":"narrator","text":"Kaneng folds the letter into her wrapper the way you fold away a prayer. Her eyes are wet."},{"speaker":"kaneng","text":"Close the stall early, my daughter. We need to talk."}],"tag":"LOYALTY"},{"id":"c_burn","text":"Drop the letter in the brazier. Rich men's problems are not hers.","effects":{"reputation":5,"affection":-5,"control":5,"loyalty":-10},"setFlags":["burned_letter"],"echo":"Mama will remember this.","response":[{"speaker":"narrator","text":"The wax hisses. Kaneng snatches the letter out of the coals with her bare hand."},{"speaker":"kaneng","mood":"angry","text":"This IS your problem. It has been your problem since before you were born."}],"tag":"CONTROL"}],"puzzle":"n_stones","next":"n1b_note","music":"calm"},{"id":"n1b_note","background":"jos_dusk","music":"mystic","tension":true,"lines":[{"speaker":"narrator","text":"That evening, there is a note tucked into the frame of her front door. Cream paper. Old-fashioned handwriting, the kind nobody learns any more."},{"speaker":"note","text":"You don't know me yet. But I have known you all your life. Don't go to Port Harcourt alone. — W.","flower":"rose"},{"speaker":"nabyen","mood":"worried","text":"Who are you?"},{"speaker":"narrator","text":"Across the street, under the jacaranda, something moves in the dark. When she looks properly, there is nobody there.","sfx":"heartbeat"}],"prompt":"The note smells faintly of the river.","choices":[{"id":"c_burn_note","tag":"CONTROL","text":"Burn it. Nobody watches a Dalyop woman.","effects":{"control":10},"response":[{"speaker":"narrator","text":"The paper curls in the flame. The ink, strangely, doesn't burn. The letter W glows for a moment, then the ash blows away."}]},{"id":"c_keep_note","tag":"DESIRE","text":"Keep it. Sleep with it under her pillow.","effects":{"desire":10},"setFlags":["kept_watcher_note"],"response":[{"speaker":"narrator","text":"She tells herself it's so she won't lose the evidence. She doesn't believe herself."}]},{"id":"c_reply_note","tag":"LOYALTY","risk":"High risk","text":"Write a reply and leave it on the step: \"Then show yourself.\"","effects":{"loyalty":5,"desire":5},"setFlags":["reply_watcher"],"response":[{"speaker":"narrator","text":"In the morning, her note is gone. In its place, a red rose, still wet with dew.","sfx":"chime"}]}],"next":"n2_dusk"},{"id":"n2_dusk","background":"jos_dusk","setFlags":["has_bracelet"],"lines":[{"speaker":"narrator","text":"Evening at the balancing rocks. The sky goes orange, then violet, then full of stars."},{"speaker":"narrator","text":"Mama Kaneng brings out a bundle wrapped in faded ankara. Inside, a leather diary, its pages brown with age."},{"speaker":"kaneng","mood":"sad","text":"Your grandmother's. Nana Rinji. She could see things. I never wanted you to read this."},{"speaker":"diary","text":"The women of our line see the river before a death. My mother saw it. I saw it. Forgive me, child: you will see it too."},{"speaker":"diary","text":"When the coral is broken, the family is broken. When the two halves meet, the river will choose, and the dead will rest.","sfx":"whisper"},{"speaker":"nabyen","mood":"surprised","text":"Mama. Last night I dreamed of a river."},{"speaker":"kaneng","mood":"worried","text":"...I know. So did I."},{"speaker":"kaneng","mood":"sad","text":"Thirty years ago, a young man came up from the river to buy tin. Tall. Loud. He laughed like thunder."},{"speaker":"kaneng","text":"He stayed one rainy season. Then his father called him home to build an empire, and he went."},{"speaker":"kaneng","mood":"worried","text":"He sent money every year. I sent it back every year. Pride is a heavy wrapper to wear, Nabyen."}],"prompt":"The rocks are very quiet.","choices":[{"id":"c_father","text":"\"Chief Gideon was my father.\"","effects":{"affection":5,"loyalty":5},"setFlags":["knows_father"],"response":[{"speaker":"kaneng","text":"Was. Is. Blood doesn't care about funerals."},{"speaker":"narrator","text":"She presses half a coral bracelet into Nabyen's palm. \"He kept the other half. Every day of his life.\""}],"tag":"LOYALTY"},{"id":"c_why","text":"\"Why did you never tell me?\"","effects":{"trust":5,"control":5},"response":[{"speaker":"kaneng","mood":"angry","text":"Because men with empires have enemies, and I wanted you to have a life, not a crown."},{"speaker":"narrator","text":"She presses half a coral bracelet into Nabyen's palm. \"He kept the other half.\""}],"tag":"CONTROL"},{"id":"c_go","text":"\"Then I'm going to Port Harcourt.\"","effects":{"reputation":5,"desire":5},"setFlags":["determined"],"response":[{"speaker":"kaneng","mood":"smile","text":"Of course you are. You are his daughter as much as mine."},{"speaker":"narrator","text":"She presses half a coral bracelet into Nabyen's palm. \"Take this. He has the other half.\""}],"tag":"DESIRE"}],"puzzle":"n_plateau","next":"n3_market","keepsake":"k_diary","music":"sorrow"},{"id":"n3_market","background":"jos_market","lines":[{"speaker":"narrator","text":"Next morning the market is louder than usual, because a black SUV with Lagos plates is parked in the middle of it."},{"speaker":"kolade","mood":"smile","text":"Nabyen Dalyop. Kolade Balogun, House of the Lagoon. I flew up at dawn just to meet you."},{"speaker":"kolade","text":"We got the same letter. Mine said 'earn it.' I'm guessing yours said something kinder."},{"speaker":"kolade","mood":"smile","text":"I have a jet waiting at Heipang. Port Harcourt by lunch. We could be allies, you and I."},{"speaker":"narrator","text":"Then her phone buzzes. A voice she hasn't heard since she was twelve and learning to swim in the creeks."},{"speaker":"tari","mood":"worried","text":"Nabyen? It's Tari. Tari Ebiowei. The Chief asked me to keep you safe. Don't get in any car from Lagos.","sfx":"phone"}],"prompt":"Two men. Two offers.","choices":[{"id":"c_jet","text":"Fly with Kolade.","effects":{"affection":5,"reputation":5,"loyalty":-10},"setFlags":["ally_kolade","spark_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"Smart woman. Lagos and the Plateau. Together we'd be unstoppable."}],"tag":"LUXURY","rel":{"kolade":{"intimacy":10,"tension":5}}},{"id":"c_tari","text":"Tell Tari to come and get her.","effects":{"trust":5,"affection":5,"loyalty":10},"setFlags":["ally_tari","spark_tari"],"echo":"Kolade will remember this.","response":[{"speaker":"tari","mood":"smile","text":"Take the bus to Makurdi. I'll meet you at the river. I'm already on my way."},{"speaker":"kolade","text":"Suit yourself. I'll save you a seat at the table."}],"tag":"LOYALTY","rel":{"tari":{"intimacy":15,"tension":5}}},{"id":"c_alone","text":"Take the night bus. Alone.","effects":{"reputation":5,"trust":5,"control":10},"setFlags":["independent"],"response":[{"speaker":"nabyen","mood":"smile","text":"I carry my own stones down the hill, Mr Balogun. I can carry myself to Port Harcourt."}],"tag":"CONTROL"}],"next":"n4_road","music":"romance"},{"id":"n4_road","background":"road_night","memory":"m_road","lines":[{"speaker":"narrator","text":"As the road climbs out of Jos, Nabyen looks back. The sky over Terminus market is glowing orange.","sfx":"fire"},{"speaker":"narrator","text":"Her stall. Her mother's stall. Thirty years of it, burning."},{"speaker":"phone","text":"That was a warning, Miss Dalyop. The next one won't be."},{"speaker":"nabyen","mood":"defiant","text":"Whoever you are, you just made the worst mistake of your life."},{"speaker":"narrator","if":{"flags":["ally_kolade"]},"text":"The jet hums south over the dark Benue. Kolade sleeps. Nabyen doesn't."},{"speaker":"narrator","if":{"notFlags":["ally_kolade"]},"text":"The bus rattles south through the night, past dark hills and sleeping towns."},{"speaker":"note","if":{"notFlags":["reply_watcher"]},"text":"I saw the fire. I am sorry about your mother's stall. I will not let them touch you. — W.","flower":"rose"},{"speaker":"note","if":{"flags":["reply_watcher"]},"text":"You wrote back. Nobody has ever written back. I will show myself when it is safe, I promise. — W.","flower":"rose"},{"speaker":"narrator","text":"She opens her bag for water and finds something that wasn't there this morning."},{"speaker":"narrator","text":"A business card. Heavy cream paper. 'Banque Moreau, Genève.' On the back, in neat handwriting: 'Stay in Jos.'"},{"speaker":"nabyen","mood":"worried","text":"Someone was in my room."}],"prompt":"Somebody wants her to stay home.","choices":[{"id":"c_keep_card","text":"Keep the card hidden. Whoever sent it is watching.","effects":{"trust":5,"control":5},"setFlags":["clue_moreau"],"response":[{"speaker":"nabyen","text":"Moreau. I'll remember you."}],"tag":"CONTROL"},{"id":"c_tear_card","text":"Tear it in half. She doesn't take orders from strangers.","effects":{"reputation":5,"desire":5},"setFlags":["clue_moreau","defiant"],"response":[{"speaker":"narrator","text":"She keeps the half with the name on it, though. She's angry, not foolish."}],"tag":"DESIRE"}],"next":null,"keepsake":"k_card","music":"danger","tension":true}],"outcomes":[{"id":"n_wings","if":{"flags":["ally_kolade"]},"title":"Wings over the Benue","text":"Nabyen flew south with Lagos at her side. Kolade is charming, generous and very interested in her future. Maybe a little too interested."},{"id":"n_river","if":{"flags":["ally_tari"]},"title":"The River Remembers","text":"Nabyen called the boy who taught her to swim. He came at once, the way rivers do."},{"id":"n_road","title":"Her Own Road","text":"Nabyen went south alone, owing nobody anything. In a game of thrones, that's rare and dangerous."}],"reflections":[{"if":{"flags":["reply_watcher"]},"text":"Someone out there has your handwriting now."},{"if":{"flags":["burned_letter"]},"text":"Mama Kaneng's hand is bandaged. She hasn't mentioned it."},{"if":{"flags":["knows_father"]},"text":"Nabyen knows who her father was. Soon everyone else will too."},{"if":{"min":{"affection":60}},"text":"Hearts are opening. Hers included."}],"secrets":{"s_plea":{"title":"A father's plea","text":"PLEA, hidden in the Plateau. On the back of the Chief's letter, in pencil so faint she almost missed it: 'Forgive me, Kaneng.'"}},"memories":{"m_jos":{"title":"Morning on the Rocks","background":"jos","text":"Blue tourmaline, cool air, and a boy running with a red-wax letter."},"m_road":{"title":"The Road South","background":"road_night","text":"A card that says 'Stay in Jos.' She didn't."}},"keepsakes":{"k_bracelet":{"type":"memento","title":"Half a coral bracelet","from":"Mama Kaneng","text":"Warm from Mama's hand. The break is clean, as if someone always meant to mend it."},"k_card":{"type":"memento","title":"A cream business card","from":"Banque Moreau, Genève","text":"'Stay in Jos.' Neat handwriting. A woman's, she thinks."},"k_diary":{"type":"letter","title":"Nana Rinji's diary","from":"Your grandmother","text":"\"When the coral is broken, the family is broken. When the two halves meet, the river will choose.\""}},"epigraph":{"text":"The women of the Rock see the river before a death.","source":"Nana Rinji's diary"}},"chapters/c1_tari.json":{"id":"c1_tari","number":1,"title":"Prince of the Creeks","place":"Bayelsa State","teaser":"Mangroves, mist and a midnight ambush. Someone doesn't want Tari to reach Port Harcourt alive.","start":"t1_creek","scenes":[{"id":"t1_creek","background":"bayelsa","memory":"m_creeks","lines":[{"speaker":"narrator","text":"Bayelsa. Mist on the creeks, and mangrove roots reaching into the water like old men's fingers."},{"speaker":"narrator","text":"Tari Ebiowei had been on the water since four. The fishermen had already told him. The Chief was dead."},{"speaker":"tari","mood":"sad","text":"He pulled me out of this river when I was six. Raised me like his own. And I wasn't there."},{"speaker":"narrator","text":"The fishermen tell it differently. They say a woman in white pulled the boy out of the creek, and the Chief only found him on the bank. Some nights, Tari isn't sure they are wrong.","sfx":"whisper"},{"speaker":"letter","text":"Tari. You were the son I chose. Protect the girl from the Rock. Nabyen. Do not let them near her. — G.O."},{"speaker":"tari","mood":"surprised","text":"Nabyen? Little Nabyen from Jos? She used to scream at every fish."},{"speaker":"narrator","text":"In his jacket, folded small, is a note he has written a hundred times and never signed with his own name. A red hibiscus is pressed inside. At the bottom, one letter: W.","sfx":"sting_reveal"}],"prompt":"The crew are watching him.","choices":[{"id":"c_crew","text":"\"Gather the crew. We sail for Port Harcourt tonight.\"","effects":{"reputation":10,"loyalty":10},"setFlags":["crew_loyal"],"response":[{"speaker":"narrator","text":"Twelve boats. Twelve men. Every one of them owes the Chief their life."}],"tag":"LOYALTY"},{"id":"c_alone_t","text":"Go alone. Fewer eyes, fewer mouths.","effects":{"trust":5,"control":5},"setFlags":["travels_light"],"response":[{"speaker":"tari","text":"If someone poisoned an old lion in his own house, they'll be watching the river."}],"tag":"CONTROL"},{"id":"c_killer","text":"\"First, I find out who killed him.\"","effects":{"trust":5,"reputation":-5,"desire":10},"setFlags":["suspects_poison"],"response":[{"speaker":"tari","mood":"angry","text":"Old men don't die of 'tiredness' the same week they rewrite their will. Somebody did this."}],"tag":"DESIRE"}],"puzzle":"t_waters","next":"t2_call","music":"night"},{"id":"t2_call","background":"bayelsa","lines":[{"speaker":"narrator","text":"His phone rings. Port Harcourt. The widow.","sfx":"phone"},{"speaker":"ibiere","mood":"angry","text":"Tari. You will stay away from the funeral. My husband's charity ended when his heart stopped."},{"speaker":"ibiere","text":"This is family business, and you are not family."}],"prompt":"Ibiere Okoro, the Chief's widow, wants him gone.","choices":[{"id":"c_defy","text":"\"With respect, Madam, I'll be there.\"","effects":{"reputation":5,"loyalty":5},"setFlags":["defied_ibiere"],"response":[{"speaker":"ibiere","mood":"angry","text":"Then come. And see how quickly respect runs out."}],"tag":"LOYALTY"},{"id":"c_lie_ib","text":"\"Of course, Madam. I'll stay in the creeks.\"","effects":{"trust":-5,"control":10},"setFlags":["lied_ibiere"],"echo":"Ibiere believed you.","response":[{"speaker":"ibiere","mood":"smile","text":"Good boy."},{"speaker":"narrator","text":"He's already untying the boat."}],"tag":"CONTROL"},{"id":"c_ask_ib","text":"\"Madam, who was with him the night he died?\"","effects":{"trust":5,"reputation":-5,"control":5},"setFlags":["suspects_ibiere","clue_moreau"],"response":[{"speaker":"ibiere","mood":"surprised","text":"How dare you."},{"speaker":"narrator","text":"She hangs up, but not before he hears another woman's voice in the room. An accent. French, or Swiss."}],"tag":"CONTROL"}],"next":"t3_night","music":"tension"},{"id":"t3_night","background":"creek_night","memory":"m_night_creek","lines":[{"speaker":"narrator","text":"Midnight on the creeks. No moon cover, no engines but his own."},{"speaker":"narrator","text":"Then another engine. Fast. Lights off.","sfx":"engine"},{"speaker":"tari","mood":"angry","text":"DOWN!","sfx":"gunshot"},{"speaker":"narrator","text":"Bullets chew the mangroves. A speedboat swings past, and something heavy splashes into the water beside him.","sfx":"gunshot"},{"speaker":"narrator","text":"One of the attackers has gone overboard. He can't swim.","sfx":"splash"}],"prompt":"The speedboat is getting away. The man in the water is going under.","choices":[{"id":"c_chase","text":"Chase the boat.","effects":{"reputation":5,"desire":5},"setFlags":["chased","suspects_kolade"],"response":[{"speaker":"narrator","text":"He loses them in the mangroves, but they drop something in the chase: a bank card. First Lagoon Bank, Lagos."},{"speaker":"tari","mood":"angry","text":"Kolade Balogun's bank."}],"tag":"DESIRE","rel":{"kolade":{"tension":15}}},{"id":"c_save","text":"Save the drowning man.","effects":{"affection":5,"trust":5,"loyalty":5},"setFlags":["saved_attacker","clue_moreau"],"response":[{"speaker":"narrator","text":"Tari hauls him into the boat, coughing up river."},{"speaker":"narrator","text":"For a moment, under the black water, Tari sees a pale hand pushing the man up towards him. Then it is gone.","sfx":"whisper"},{"speaker":"narrator","text":"'The white woman pays in francs,' the man gasps. 'She said nobody from the creeks reaches Port Harcourt.'"}],"tag":"LOYALTY","keepsake":"k_francs"}],"puzzle":"t_rivers","next":"t4_dawn","music":"danger","tension":true},{"id":"t4_dawn","background":"ph_day","lines":[{"speaker":"narrator","text":"Dawn. The Port Harcourt jetty. Tari ties up the boat with hands that won't stop shaking."},{"speaker":"narrator","text":"And there at the end of the jetty, in an orange ankara dress, is a woman he hasn't seen since she was twelve."},{"speaker":"nabyen","mood":"surprised","text":"Tari? Tari Ebiowei? Since when are you so tall?"},{"speaker":"nabyen","mood":"smile","text":"You still owe me a fish, you know. A big one. You promised."},{"speaker":"narrator","if":{"pov":"tari"},"text":"She has a red rose petal pinned inside her collar. Tari recognises it. He should. He sent it."}],"prompt":"Nabyen Dalyop, all grown up.","choices":[{"id":"c_hug","text":"Pull her into a hug. Fish later.","effects":{"affection":10,"desire":10},"setFlags":["spark_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"Okay. Okay! You smell like the river."}],"tag":"DESIRE","rel":{"nabyen":{"intimacy":15}}},{"id":"c_warn","text":"\"Someone tried to kill me last night. Stay close.\"","effects":{"trust":10,"loyalty":5},"setFlags":["ally_nabyen"],"response":[{"speaker":"nabyen","mood":"worried","text":"Then we stay close."}],"tag":"LOYALTY","rel":{"nabyen":{"intimacy":5,"tension":5}}},{"id":"c_formal","text":"\"Miss Dalyop. The Chief asked me to look after you.\"","effects":{"reputation":5,"control":10},"response":[{"speaker":"nabyen","mood":"sad","text":"Miss Dalyop. Wow. Okay, Captain."}],"tag":"CONTROL","rel":{"nabyen":{"tension":10}}}],"next":null,"music":"romance"}],"outcomes":[{"id":"t_blood","if":{"flags":["suspects_kolade"]},"title":"Blood in the Water","text":"A Lagos bank card, dropped by men who tried to kill him. Tari now has a name to hate. It might even be the right one."},{"id":"t_francs","if":{"flags":["clue_moreau"]},"title":"The Woman Who Pays in Francs","text":"Someone far from the creeks is paying in Swiss money for Nigerian blood."},{"id":"t_tide","title":"Turning Tide","text":"Tari reached Port Harcourt alive. On the creeks, that's a kind of victory."}],"reflections":[{"if":{"flags":["spark_nabyen"]},"text":"Something old and warm is waking up between the captain and the girl from the rocks."},{"if":{"flags":["crew_loyal"]},"text":"Twelve boats answer to Tari now."},{"if":{"flags":["lied_ibiere"]},"text":"Ibiere thinks Tari is in the creeks. She'll find out soon."}],"secrets":{"s_swear":{"title":"An oath on the water","text":"SWEAR, from the waters. Tari's father swore on the Nun River to protect the Chief, and died keeping that oath. The Chief never forgave himself."}},"memories":{"m_creeks":{"title":"Mist on the Creeks","background":"bayelsa","text":"Mangroves, a canoe, and news nobody wanted to deliver."},"m_night_creek":{"title":"Ambush at Midnight","background":"creek_night","text":"Fireflies, bullets, and a man who couldn't swim."}},"keepsakes":{"k_francs":{"type":"memento","title":"A wet ten-franc note","from":"The man in the water","text":"What a life costs on the creeks, apparently. Paid in Swiss money."}},"epigraph":{"text":"What the creek takes, the creek keeps.","source":"A fisherman's saying"}},"chapters/c1_hadiza.json":{"id":"c1_hadiza","number":1,"title":"The Long Game","place":"Kano, Kano State","teaser":"Indigo dye pits, a decade of ledgers, and four million dollars a year that vanished into Switzerland.","start":"h1_pits","scenes":[{"id":"h1_pits","background":"kano","memory":"m_kano","lines":[{"speaker":"narrator","text":"Kano. The old city walls glow red in the morning, and the dye pits of Kofar Mata breathe indigo into the air."},{"speaker":"narrator","text":"Hadiza Lawan had her father's ledgers open on her knees when the letter came."},{"speaker":"narrator","text":"Mallama Binta, the oldest dyer at Kofar Mata, blind for forty years, catches Hadiza's wrist with indigo-black fingers."},{"speaker":"narrator","text":"\"Three will cross the cold mountain,\" the old woman whispers. \"Not all of them will come down.\"","sfx":"whisper"},{"speaker":"letter","text":"Hadiza. You always saw what I missed. Count the money. Someone has been counting it for me. — G.O."},{"speaker":"hadiza","mood":"worried","text":"Count the money. You never asked me for anything, Chief. And now you're gone."}],"prompt":"The ledgers are heavy.","choices":[{"id":"c_audit","text":"Open every ledger tonight. All ten years.","effects":{"trust":5,"control":5},"setFlags":["audited"],"response":[{"speaker":"hadiza","mood":"smile","text":"Bring me tea. A great deal of tea."}],"tag":"CONTROL"},{"id":"c_call_lagos","text":"Call Kolade in Lagos. Bankers know where money hides.","effects":{"reputation":5,"loyalty":-5},"setFlags":["ally_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"Hadiza Lawan, calling me? I'm flattered. And suspicious."}],"tag":"LUXURY","rel":{"kolade":{"intimacy":5,"tension":5}}},{"id":"c_silent","text":"Tell no one. Not even family.","effects":{"trust":5,"reputation":-5,"control":10},"setFlags":["silent"],"response":[{"speaker":"hadiza","text":"In Kano, the walls listen. Then they talk."}],"tag":"CONTROL"}],"puzzle":"h_ledger","next":"h2_market","music":"calm"},{"id":"h2_market","background":"kano_market","lines":[{"speaker":"narrator","text":"Midnight at Kurmi market, among the lanterns and bolts of bright cloth, she finds it."},{"speaker":"hadiza","mood":"surprised","text":"Four million dollars a year. Every year. Out of Confluence Holdings and into a private bank in Geneva.","sfx":"sting_reveal"},{"speaker":"hadiza","text":"Banque Moreau. Someone has been bleeding the Chief for a decade, and nobody noticed."},{"speaker":"kolade","if":{"flags":["ally_kolade"]},"text":"Moreau? Very old, very private, very Swiss. Why do you ask?"},{"speaker":"narrator","if":{"flags":["ally_kolade"]},"text":"He answers a little too smoothly."}],"prompt":"This is either evidence or leverage.","choices":[{"id":"c_share","text":"Send it to the other heirs. Nobody wins a rigged game.","effects":{"trust":10,"loyalty":10},"setFlags":["shared_ledger","clue_moreau"],"response":[{"speaker":"hadiza","text":"Let them all see. Thieves hate the light."}],"tag":"LOYALTY"},{"id":"c_leverage","text":"Keep it. Whoever holds this holds the crown.","effects":{"reputation":10,"trust":-5,"control":15,"loyalty":-5},"setFlags":["leverage","clue_moreau"],"echo":"Knowledge is a blade.","response":[{"speaker":"hadiza","mood":"smile","text":"My father taught me: never show your best cloth on the first day of the market."}],"tag":"CONTROL"},{"id":"c_for_nd","text":"Send it to one person only: the 'N.D.' in the margins.","effects":{"affection":5,"trust":5,"loyalty":5},"setFlags":["ally_nabyen","clue_moreau"],"response":[{"speaker":"narrator","text":"In the margin of the oldest ledger, in the Chief's handwriting: 'For N.D., if anything happens to me.'"},{"speaker":"hadiza","text":"Nabyen Dalyop. Jos. Let's see who you are."}],"tag":"LOYALTY","rel":{"nabyen":{"intimacy":10}}}],"next":"h3_durbar","keepsake":"k_ledger_page","music":"night"},{"id":"h3_durbar","background":"kano_durbar","memory":"m_durbar","lines":[{"speaker":"narrator","text":"Sallah Durbar. Horsemen in red and gold, trumpets, dust, the whole city cheering."},{"speaker":"narrator","text":"And in the middle of it all, a man in a Lagos suit, sweating."},{"speaker":"kolade","mood":"smile","text":"Hadiza. I came all the way to Kano to make you an offer."},{"speaker":"kolade","text":"You have the numbers. I have the bank. Together we walk into Port Harcourt already wearing the crown."}],"prompt":"Kolade Balogun, House of the Lagoon.","choices":[{"id":"c_shake","text":"Shake his hand.","effects":{"reputation":5,"loyalty":-5},"setFlags":["ally_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"A pleasure doing business."}],"tag":"LUXURY","rel":{"kolade":{"intimacy":10}}},{"id":"c_refuse_k","text":"\"I don't share crowns, Kolade.\"","effects":{"reputation":5,"trust":-5,"control":5},"setFlags":["refused_kolade"],"response":[{"speaker":"kolade","text":"Then I'll see you on the other side of the table."}],"tag":"CONTROL","rel":{"kolade":{"tension":15}}},{"id":"c_test","text":"Ask him about Banque Moreau. Watch his eyes.","effects":{"trust":5,"control":5},"setFlags":["suspects_kolade"],"response":[{"speaker":"narrator","text":"He blinks. Once. Then he laughs."},{"speaker":"kolade","mood":"smile","text":"Never heard of them."},{"speaker":"narrator","text":"Hadiza has played enough cards to know a bluff."}],"tag":"CONTROL","rel":{"kolade":{"tension":10}}}],"puzzle":"h_horses","next":"h4_south","music":"triumph"},{"id":"h4_south","background":"kano","lines":[{"speaker":"narrator","text":"Before she leaves, a boy brings a calabash of kunu, 'with the Lagos gentleman's compliments.'"},{"speaker":"narrator","text":"Hadiza tips it onto the sand. The sand hisses and turns black.","sfx":"sting_reveal"},{"speaker":"hadiza","mood":"angry","text":"Someone wants me to think Kolade did this. Which means someone is very afraid of what I've found."},{"speaker":"narrator","text":"Evening. The last flight south out of Mallam Aminu Kano International."},{"speaker":"hadiza","mood":"smile","text":"Port Harcourt. Let's see who's lying."}],"next":null,"music":"tension","tension":true}],"outcomes":[{"id":"h_open","if":{"flags":["shared_ledger"]},"title":"Open Books","text":"Hadiza showed everyone the truth. Honest, brave, and now a target."},{"id":"h_blade","if":{"flags":["leverage"]},"title":"The Blade","text":"Hadiza kept the proof to herself. In a game of thrones, the one who knows the most usually wins. Usually."},{"id":"h_nd","title":"For N.D.","text":"Hadiza found a name in the Chief's margins and followed it. N.D. Nabyen Dalyop. Why did a billionaire write a gem trader into his ledgers?"}],"reflections":[{"if":{"flags":["suspects_kolade"]},"text":"Kolade's laugh came a second too late."},{"if":{"flags":["ally_kolade"]},"text":"Lagos and Kano have shaken hands. For now."}],"secrets":{"s_greed":{"title":"Circled three times","text":"GREED, circled three times in red ink in the margin of the 2019 ledger, in the Chief's own hand. He knew, a year before he died."}},"memories":{"m_kano":{"title":"Indigo Morning","background":"kano","text":"Red walls, indigo pits, and a letter that said: count the money."},"m_durbar":{"title":"The Durbar","background":"kano_durbar","text":"Horsemen in red and gold, and a Lagos banker in the dust."}},"keepsakes":{"k_ledger_page":{"type":"memento","title":"A torn ledger page","from":"Confluence Holdings, 2019","text":"Four million, out. Four million, out. Four million, out. Every line initialled E.M."}},"epigraph":{"text":"In Kano, the walls listen. Then they talk.","source":"Hadiza Lawan"}},"chapters/c1_kolade.json":{"id":"c1_kolade","number":1,"title":"Lagos Never Sleeps","place":"Lagos, Lagos State","teaser":"Third Mainland traffic, a rooftop on Victoria Island, and a Swiss banker with a very dangerous offer.","start":"k1_bridge","scenes":[{"id":"k1_bridge","background":"lagos","memory":"m_lagos","lines":[{"speaker":"narrator","text":"Lagos. Third Mainland Bridge at six in the evening. Nothing on it moves except the danfo drivers' mouths."},{"speaker":"narrator","text":"In the back of his car, Kolade Balogun reads the letter for the third time."},{"speaker":"letter","text":"Kolade. You wanted everything. Earn it. — G.O."},{"speaker":"kolade","mood":"smile","text":"Earn it. Old man, I've been earning it since I was sixteen."},{"speaker":"kolade","mood":"sad","text":"...You could have said goodbye."}],"prompt":"The traffic hasn't moved in twenty minutes.","choices":[{"id":"c_widow","text":"Call the widow. Lock in the board votes before anyone else lands.","effects":{"reputation":10,"trust":-5,"loyalty":-10,"control":5},"setFlags":["courted_ibiere"],"response":[{"speaker":"ibiere","mood":"smile","text":"Kolade. You always were the practical one. Come and see me."}],"tag":"LUXURY"},{"id":"c_research","text":"Look up the other names under the seal.","effects":{"trust":5,"control":5},"setFlags":["researched"],"response":[{"speaker":"kolade","text":"Dalyop. Ebiowei. Lawan. And me. A gem trader, a boat captain, a Kano accountant and a banker. What were you building, Chief?"}],"tag":"CONTROL"},{"id":"c_drink","text":"\"Driver. Victoria Island. I need a drink first.\"","effects":{"affection":5,"desire":5},"response":[{"speaker":"kolade","mood":"sad","text":"Grief can wait until the second bottle."}],"tag":"DESIRE"}],"puzzle":"k_bridge","next":"k2_vi","music":"calm"},{"id":"k2_vi","background":"lagos_night","lines":[{"speaker":"narrator","text":"Victoria Island. A rooftop bar, the whole city lit up like money."},{"speaker":"narrator","text":"A video call from a private number: a woman with pale hair and Lake Geneva behind her."},{"speaker":"elise","mood":"smile","text":"Monsieur Balogun. Elise Moreau, Banque Moreau. I managed Chief Okoro's private accounts for many years."},{"speaker":"elise","text":"His will is... complicated. Help me keep his accounts quiet for a few weeks, and I can make sure the crown goes to you."},{"speaker":"elise","mood":"smile","text":"Lagos deserves a king. Don't you think?"}],"prompt":"The most dangerous offer of his life.","choices":[{"id":"c_accept","text":"\"Tell me more.\"","effects":{"reputation":10,"trust":-10,"loyalty":-20,"desire":5},"setFlags":["elise_deal"],"echo":"Elise will remember this.","response":[{"speaker":"elise","mood":"smile","text":"I knew you were the clever one."}],"tag":"LUXURY"},{"id":"c_refuse_e","text":"\"He was my godfather. Find another fool.\"","effects":{"trust":10,"loyalty":15},"setFlags":["refused_elise","clue_moreau"],"response":[{"speaker":"elise","text":"A pity. Fools live longer, Monsieur."}],"tag":"LOYALTY"},{"id":"c_spy","text":"Pretend to accept. Record every word.","effects":{"trust":5,"reputation":5,"control":15},"setFlags":["double_agent","clue_moreau"],"response":[{"speaker":"kolade","mood":"smile","text":"Of course, Madame. Let's talk numbers."},{"speaker":"narrator","text":"In his pocket, his phone is recording."}],"tag":"CONTROL","keepsake":"k_voice_elise"}],"next":"k3_beach","music":"tension","tension":true},{"id":"k3_beach","background":"lagos_beach","memory":"m_beach","lines":[{"speaker":"narrator","text":"On the drive to Lekki, a motorbike pulls level with his window. The rider lifts two fingers like a gun, taps the glass twice, and is gone into the traffic.","sfx":"engine"},{"speaker":"phone","if":{"flags":["elise_deal"]},"text":"A photo, from a private number: Kolade asleep in his own bed, taken last night. 'We keep our partners close, Monsieur.'"},{"speaker":"phone","if":{"flags":["refused_elise"]},"text":"'Fools live longer, Monsieur. Usually.'"},{"speaker":"narrator","if":{"flags":["double_agent"]},"text":"He checks the cloud for his recording of Elise. Someone has already deleted it. Only the copy on his phone survived.","sfx":"sting_reveal"},{"speaker":"narrator","text":"Dawn on the beach at Lekki. The Atlantic doesn't care about crowns."},{"speaker":"narrator","text":"An old woman selling kola nuts on the sand presses one into his palm and closes his fingers over it."},{"speaker":"narrator","text":"\"You will be offered a crown and a heart, Lagos boy. You cannot carry both.\"","sfx":"whisper"},{"speaker":"kolade","text":"Two ways to play this. Fly straight to Port Harcourt and be first in the room."},{"speaker":"kolade","text":"Or fly north to Jos and meet the woman whose name the old man wrote twice."}],"prompt":"Where does Kolade go first?","choices":[{"id":"c_to_jos","text":"Fly to Jos. Meet Nabyen Dalyop.","effects":{"affection":5,"desire":10},"setFlags":["ally_nabyen","spark_nabyen"],"response":[{"speaker":"narrator","text":"Later he'll tell everyone it was strategy. It wasn't."}],"tag":"DESIRE","rel":{"nabyen":{"intimacy":10,"tension":10}}},{"id":"c_to_ph","text":"Fly straight to Port Harcourt. Be first in the room.","effects":{"reputation":5,"control":5},"setFlags":["first_in_room"],"response":[{"speaker":"kolade","mood":"smile","text":"In Lagos, the early bird doesn't just catch the worm. He buys the farm."}],"tag":"CONTROL"}],"puzzle":"k_lagos","next":null,"music":"danger"}],"outcomes":[{"id":"k_wolf","if":{"flags":["elise_deal"]},"title":"A Deal in the Dark","text":"Kolade said yes to Elise Moreau. Lagos might get its king. But kings who are made by other people can be unmade by them too."},{"id":"k_two","if":{"flags":["double_agent"]},"title":"Two Faces","text":"Kolade smiled at the wolf and kept the tape running. A dangerous game, played well. So far."},{"id":"k_not","title":"Not for Sale","text":"Kolade turned Elise down. For once, the man who wanted everything wouldn't sell anything."}],"reflections":[{"if":{"flags":["spark_nabyen"]},"text":"A Lagos banker is flying north for a woman he has never met."},{"if":{"flags":["courted_ibiere"]},"text":"The widow is in Kolade's pocket. Or he's in hers."}],"secrets":{"s_bride":{"title":"A promised bride","text":"BRIDE. Thirty years ago, two fathers promised a Lagos boy a bride from the Plateau. The Chief tore the agreement up the day Nabyen was born."}},"memories":{"m_lagos":{"title":"Third Mainland at Dusk","background":"lagos","text":"Yellow danfos, a gold lagoon, and two words: earn it."},"m_beach":{"title":"Dawn at Lekki","background":"lagos_beach","text":"The Atlantic, a choice, and a woman he hadn't met yet."}},"keepsakes":{"k_voice_elise":{"type":"voice","title":"Recording: Elise Moreau","from":"Kolade's phone","text":"'Lagos deserves a king, Monsieur. And kings are made in Geneva.'"}},"epigraph":{"text":"Lagos never sleeps. Neither do the people who want what you have.","source":"A danfo driver"}},"chapters/c2_funeral.json":{"id":"c2_funeral","number":2,"title":"The Funeral","place":"Port Harcourt, Rivers State","teaser":"White lilies, gold columns, a furious widow, and a will that says the crown must be chosen.","start":"f1_hall","scenes":[{"id":"f1_hall","background":"mansion","memory":"m_funeral","lines":[{"speaker":"narrator","text":"Port Harcourt. White lilies, gold columns, and three hundred mourners pretending not to watch each other."},{"speaker":"narrator","text":"For the first time in years, all four houses stand under one roof."},{"speaker":"narrator","if":{"pov":"nabyen"},"text":"Nabyen keeps one hand in her pocket, closed tight around half a coral bracelet."},{"speaker":"narrator","if":{"pov":"tari"},"text":"Tari stands at the back, still smelling of the creeks, watching the doors."},{"speaker":"narrator","if":{"pov":"hadiza"},"text":"Hadiza counts the exits, then the guests, then the guards."},{"speaker":"narrator","if":{"pov":"kolade"},"text":"Kolade works the room like it's the opening of a new bank."},{"speaker":"ibiere","mood":"angry","text":"Four strangers at my husband's funeral. He collected people the way other men collect cars."},{"speaker":"narrator","text":"A thin Englishman with rain still on his coat clears his throat. Oliver Ashworth, the family's London solicitor."},{"speaker":"oliver","text":"Chief Okoro left instructions. The chairmanship of Confluence Holdings, what he called the Crown of the Confluence, is not inherited."},{"speaker":"oliver","text":"It is chosen, by the four houses together. Once they have brought back the second half of his will from Geneva, and the last seal from his brother."},{"speaker":"ibiere","mood":"surprised","text":"His brother? Gideon had no brother."},{"speaker":"oliver","mood":"worried","text":"He did, Madam. And the first half of the will is waiting in my office in London."},{"speaker":"narrator","text":"Then the lights die.","sfx":"thunder"},{"speaker":"narrator","text":"When they flicker back on, someone has slashed the Chief's portrait from corner to corner. Pinned to the canvas, a card in neat handwriting: 'One of you is next.'","sfx":"sting_reveal"},{"speaker":"ibiere","mood":"angry","text":"Who did this? WHO DID THIS?"}],"next":"f2_accuse","music":"sorrow"},{"id":"f2_accuse","background":"mansion","lines":[{"speaker":"ibiere","mood":"angry","text":"And this one. A trader from the hills? In my husband's will?"},{"speaker":"ibiere","text":"Do you know what they call girls like you, Nabyen Dalyop? Gold-diggers."},{"speaker":"nabyen","mood":"angry","text":"My mother dug tin, Madam. Not gold."}],"prompt":"Ibiere has drawn first blood.","choices":[{"id":"c_defend","if":{"notPov":"nabyen"},"text":"Step in front of Nabyen. \"Say that again, Madam. To me.\"","effects":{"affection":10,"reputation":-5,"loyalty":5},"setFlags":["defended_nabyen"],"response":[{"speaker":"nabyen","mood":"surprised","text":"...Thank you."},{"speaker":"ibiere","text":"How touching."}],"tag":"LOYALTY","rel":{"nabyen":{"intimacy":10}}},{"id":"c_answer","if":{"pov":"nabyen"},"text":"\"He was my father, Madam. And I didn't come here for his money.\"","effects":{"trust":10,"reputation":-5,"loyalty":10},"setFlags":["revealed_father"],"response":[{"speaker":"ibiere","mood":"surprised","text":"...Liar."},{"speaker":"narrator","text":"But her face has gone grey."}],"tag":"LOYALTY"},{"id":"c_accuse","text":"\"Where were YOU the night he died, Madam?\"","effects":{"trust":5,"reputation":-10,"control":5,"desire":5},"setFlags":["accused_ibiere"],"echo":"Ibiere will remember this.","response":[{"speaker":"ibiere","mood":"angry","text":"Get out of my house."},{"speaker":"narrator","text":"Three hundred people heard that. By evening, so has all of Port Harcourt."}],"tag":"CONTROL"},{"id":"c_calm","text":"\"We're all grieving. Let's bury him in peace.\"","effects":{"reputation":10,"control":10},"setFlags":["peacemaker"],"response":[{"speaker":"ibiere","mood":"sad","text":"...Fine. For him. Not for you."}],"tag":"CONTROL"},{"id":"c_lev_plea","leverage":"s_plea","tag":"LEVERAGE","text":"Turn the Chief's letter over and hand it to Ibiere. Pencilled on the back: 'Forgive me, Kaneng.'","effects":{"control":10,"reputation":10},"setFlags":["ibiere_softened"],"response":[{"speaker":"ibiere","mood":"sad","text":"...He wrote that? About her?"},{"speaker":"ibiere","mood":"angry","text":"Then he lied to both of us. Sit down, girl. You belong here more than I do."}]},{"id":"c_lev_greed","leverage":"s_greed","tag":"LEVERAGE","text":"Quote the ledger to the whole room: GREED, circled three times in his own hand.","effects":{"control":15,"reputation":5},"rel":{"kolade":{"tension":10}},"setFlags":["exposed_greed"],"response":[{"speaker":"narrator","text":"Three hundred mourners go silent. Somewhere at the back, a glass breaks."},{"speaker":"ibiere","mood":"surprised","text":"Someone was robbing him. In my house."}]},{"id":"c_lev_bride","leverage":"s_bride","tag":"LEVERAGE","text":"\"He once promised me a bride from the Plateau, Madam. Did you know that?\"","effects":{"desire":10,"reputation":-5},"rel":{"nabyen":{"tension":15,"intimacy":5}},"setFlags":["bride_revealed"],"response":[{"speaker":"nabyen","mood":"surprised","text":"...Excuse me?"},{"speaker":"ibiere","mood":"smile","text":"Oh, this funeral is getting interesting."}]},{"id":"c_lev_swear","leverage":"s_swear","tag":"LEVERAGE","text":"\"My father swore an oath on the Nun River to protect him. I swear the same: I'll find who did this.\"","effects":{"loyalty":15,"trust":10},"setFlags":["oath_sworn"],"response":[{"speaker":"narrator","text":"Old men from the creeks stand up at the back of the hall, one by one."},{"speaker":"ibiere","mood":"sad","text":"...Your father was a good man. Sit down, Tari."}]}],"puzzle":"f_funeral","next":"f3_garden","tension":true,"music":"tension"},{"id":"f3_garden","background":"ph_garden","memory":"m_garden","lines":[{"speaker":"narrator","text":"Midnight. The garden behind the mansion, fireflies over the fountain."},{"speaker":"narrator","text":"On the edge of the fountain, someone has left a white lily. Tied to its stem with black thread, a note.","sfx":"sting_reveal"},{"speaker":"note","text":"Welcome home, little sheep. — B.","flower":"lily"},{"speaker":"narrator","if":{"notPov":"tari"},"text":"And on the bench beside Nabyen, where nobody saw it placed, a single red rose."},{"speaker":"note","if":{"pov":"nabyen"},"text":"Breathe. I am here. — W.","flower":"rose"},{"speaker":"narrator","text":"On the stone bench: the Chief's tea tray, taken from his study before the police arrived. One silver spoon has gone black at the tip."},{"speaker":"hadiza","text":"And this. Four million dollars a year into Banque Moreau, Geneva. For ten years."},{"speaker":"tari","mood":"angry","text":"Moreau. The man I pulled out of the creek said a white woman was paying in francs."},{"speaker":"kolade","text":"Banks are boring. Let's talk about who flies to London tomorrow."},{"speaker":"narrator","if":{"pov":"kolade","flags":["elise_deal"]},"text":"In Kolade's pocket, his phone buzzes. Geneva. He doesn't answer it."}],"prompt":"Who do you trust most?","choices":[{"id":"c_trust_nabyen","if":{"notPov":"nabyen"},"text":"Nabyen. The Chief did.","effects":{"affection":5,"loyalty":5},"setFlags":["ally_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"Then I'll try to deserve it."}],"tag":"LOYALTY","rel":{"nabyen":{"intimacy":5}}},{"id":"c_trust_tari","if":{"notPov":"tari"},"text":"Tari. He's already bled for this.","effects":{"trust":5,"loyalty":5},"setFlags":["ally_tari"],"response":[{"speaker":"tari","text":"Nobody touches you while I'm breathing."}],"tag":"LOYALTY","rel":{"tari":{"intimacy":5}}},{"id":"c_trust_hadiza","if":{"notPov":"hadiza"},"text":"Hadiza. She found the money.","effects":{"reputation":5,"loyalty":5},"setFlags":["ally_hadiza"],"response":[{"speaker":"hadiza","mood":"smile","text":"Wise. Numbers don't lie. People do."}],"tag":"LOYALTY","rel":{"hadiza":{"intimacy":5}}},{"id":"c_trust_kolade","if":{"notPov":"kolade"},"text":"Kolade. Lagos knows Geneva.","effects":{"reputation":5,"trust":-5,"loyalty":-5},"setFlags":["ally_kolade"],"response":[{"speaker":"kolade","mood":"smile","text":"Finally, somebody with taste."}],"tag":"LUXURY","rel":{"kolade":{"intimacy":5,"tension":5}}}],"puzzle":"f_poison","next":"f4_moment","keepsake":"k_spoon","music":"night"},{"id":"f4_moment","background":"ph_garden","lines":[{"speaker":"narrator","if":{"notPov":"nabyen"},"text":"Later, everyone else has gone inside. Nabyen is still by the fountain, turning half a coral bracelet in her fingers."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"mood":"sad","text":"He was my father, you know. I never met him. I only ever saw him in newspapers."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"text":"Do you think he was a good man?"},{"speaker":"narrator","if":{"pov":"nabyen"},"text":"Midnight in the garden. The air is thick with night-blooming jasmine and unsaid promises."},{"speaker":"kolade","if":{"pov":"nabyen"},"mood":"intimate","text":"You shouldn't be out here alone, Nabyen. Port Harcourt is full of men who take what isn't offered."},{"speaker":"nabyen","if":{"pov":"nabyen"},"mood":"defiant","text":"And are you one of them, Mr Balogun?"},{"speaker":"kolade","if":{"pov":"nabyen"},"mood":"smile","text":"I prefer it when it's offered freely."},{"speaker":"narrator","if":{"pov":"nabyen"},"text":"Footsteps on the gravel. Tari, watching from the path, not pretending otherwise."}],"prompt":[{"if":{"pov":"nabyen"},"text":"Kolade steps into her shadow. She can feel the heat coming off his jacket."},{"text":"The fireflies are very bright tonight."}],"choices":[{"id":"c_close_distance","if":{"pov":"nabyen"},"tag":"DESIRE","risk":"High risk","gate":{"if":{"rel":{"kolade":{"minTension":50}}},"label":"Requires tension 50+ with Kolade"},"text":"Hold his gaze and step closer. \"Then make me an offer worth accepting.\"","effects":{"desire":15,"control":-5},"rel":{"kolade":{"intimacy":15,"tension":10}},"setFlags":["spark_kolade","kolade_tension_high"],"response":[{"speaker":"kolade","mood":"intimate","text":"Careful, Miss Dalyop. I might."},{"speaker":"narrator","text":"On the path, Tari turns and walks away without a word."}],"sfx":"sting_romance"},{"id":"c_use_secret","if":{"pov":"nabyen"},"leverage":"s_spoon","tag":"LEVERAGE","risk":"High risk","text":"Press the blackened spoon into his chest. \"Explain why Banque Moreau money runs through your bank.\"","effects":{"control":15,"desire":-5},"rel":{"kolade":{"tension":15}},"setFlags":["cornered_kolade"],"response":[{"speaker":"kolade","mood":"surprised","text":"...Where did you get that?"},{"speaker":"kolade","mood":"worried","text":"Not here. This house has ears. In London, I tell you everything."}]},{"id":"c_pillow_spoon","if":{"notPov":"nabyen"},"leverage":"s_spoon","tag":"LEVERAGE","text":"Show her the blackened spoon. \"Your father was murdered, Nabyen. I can prove it.\"","effects":{"trust":10,"desire":5},"rel":{"nabyen":{"intimacy":10,"tension":10}},"setFlags":["spark_nabyen","nabyen_knows_murder"],"response":[{"speaker":"nabyen","mood":"sad","text":"...Then we find who did it. Together. Promise me."},{"speaker":"narrator","text":"She doesn't let go of your hand for a long time."}]},{"id":"c_hold","if":{"notPov":"nabyen"},"text":"Take her hand. \"I think he loved you more than he knew how to say.\"","effects":{"affection":10,"desire":10},"setFlags":["spark_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"...You're kind. I didn't expect kind, here."}],"tag":"DESIRE","rel":{"nabyen":{"intimacy":15}},"sfx":"sting_romance"},{"id":"c_honest","if":{"notPov":"nabyen"},"text":"\"He was a great man. Not always a good one.\"","effects":{"trust":10,"control":5},"response":[{"speaker":"nabyen","text":"Honest. I'll take honest."}],"tag":"CONTROL","rel":{"nabyen":{"tension":5}}},{"id":"c_sit_tari","if":{"pov":"nabyen"},"text":"Turn to Tari. \"Sit with me. Just you.\"","effects":{"affection":10,"desire":5},"setFlags":["spark_tari"],"response":[{"speaker":"tari","mood":"smile","text":"I'll sit here until the sun comes up, if you want."}],"tag":"DESIRE","rel":{"tari":{"intimacy":15}},"sfx":"sting_romance"},{"id":"c_leave","text":"Leave the fireflies to their silence.","effects":{"reputation":5,"control":5},"response":[{"speaker":"narrator","text":"Tomorrow: London. Some conversations can wait."}],"tag":"CONTROL"}],"next":null,"tension":true,"music":"romance"}],"outcomes":[{"id":"f_blood","if":{"flags":["accused_ibiere"]},"title":"Blood on the Lilies","text":"You called the widow a murderer in front of three hundred people. If you're wrong, you've made a powerful enemy. If you're right, you've warned her."},{"id":"f_daughter","if":{"flags":["revealed_father"]},"title":"His Daughter","text":"Nabyen told the world whose daughter she is. There's no taking that back now."},{"id":"f_shield","if":{"flags":["defended_nabyen"]},"title":"Shield of the Rock","text":"You stood between Nabyen and the widow's anger. She noticed. Everyone noticed."},{"id":"f_peace","title":"The Peacemaker","text":"The Chief was buried in peace. Peace is rare in this family. Enjoy it."}],"reflections":[{"if":{"anyFlags":["spark_nabyen","spark_tari","spark_kolade"]},"text":"Something started by the fountain tonight."},{"if":{"flags":["clue_moreau"]},"text":"The name Moreau keeps coming up."}],"secrets":{"s_spoon":{"title":"The silver spoon","text":"SPOON. The poison was never in the tea. It was on the silver spoon, a gift from Geneva, engraved 'E.M.'"}},"memories":{"m_funeral":{"title":"White Lilies","background":"mansion","text":"Gold columns, three hundred mourners, and four heirs under one roof."},"m_garden":{"title":"Fireflies at Midnight","background":"ph_garden","text":"A blackened spoon, a fountain, and a hand held in the dark."}},"keepsakes":{"k_spoon":{"type":"memento","title":"The blackened spoon","from":"The Chief's tea tray","text":"Silver, engraved E.M. Gone black at the tip, the way silver does when it meets poison."}},"epigraph":{"text":"Every funeral is a gathering of the people who did not do it.","source":"Ibiere Okoro"}},"chapters/c3_london.json":{"id":"c3_london","number":3,"title":"Fog on the Thames","place":"London, United Kingdom","teaser":"Rain, red buses, a frightened solicitor, and a murder on the Embankment.","start":"l1_office","scenes":[{"id":"l1_office","background":"london","memory":"m_london","lines":[{"speaker":"narrator","text":"London. Rain that doesn't fall so much as hang in the air and wait for you."},{"speaker":"narrator","text":"Oliver Ashworth's office at Lincoln's Inn smells of old paper and older secrets."},{"speaker":"oliver","mood":"worried","text":"Someone was here last night. They took nothing. Which means they were looking for something they didn't find."},{"speaker":"oliver","text":"The first half of the will. And a key. The Chief said only his blood could open his box in Geneva."},{"speaker":"oliver","text":"I never understood what he meant. Perhaps one of you does."},{"speaker":"oliver","mood":"worried","text":"And one more thing. Near the end, the Chief told me Elise Moreau was never working alone. 'Every wolf has a shepherd,' he said. I thought he was being poetic."},{"speaker":"narrator","text":"Nabyen's hand closes around the coral bracelet in her pocket."}],"prompt":"Oliver looks like a man who hasn't slept in a week.","choices":[{"id":"c_invite","text":"\"Come with us to Geneva, Oliver. You're not safe here.\"","effects":{"trust":5,"affection":5,"loyalty":5},"setFlags":["invited_oliver"],"response":[{"speaker":"oliver","mood":"smile","text":"That's... very kind. I have one thing to collect first. Meet me on the Embankment at nine."}],"tag":"LOYALTY"},{"id":"c_doubt","text":"\"How do we know you're not part of this?\"","effects":{"trust":-5,"reputation":5,"control":10},"setFlags":["doubted_oliver"],"response":[{"speaker":"oliver","mood":"sad","text":"You don't. That's rather the point of trust."},{"speaker":"oliver","text":"The Embankment, nine o'clock. There's something you need to see."}],"tag":"CONTROL"}],"puzzle":"l_thames","next":"l2_embankment","music":"calm"},{"id":"l2_embankment","background":"london_night","setFlags":["dead_oliver"],"lines":[{"speaker":"narrator","text":"Nine o'clock. Fog on the Embankment, and lamps like drowned moons."},{"speaker":"narrator","text":"Oliver is late. Then he isn't late. He's lying on the stone steps down to the river.","sfx":"sting_reveal"},{"speaker":"oliver","mood":"sad","text":"...Moreau... and the shepherd... the shepherd..."},{"speaker":"narrator","text":"His hand opens. In his palm is a small brass key."},{"speaker":"narrator","text":"Footsteps, running. A shadow in a long coat is disappearing toward Waterloo Bridge.","sfx":"heartbeat"}],"prompt":"Oliver Ashworth is dying.","choices":[{"id":"c_stay_o","text":"Stay with Oliver.","effects":{"affection":5,"trust":5,"loyalty":10},"setFlags":["stayed_oliver","clue_moreau"],"response":[{"speaker":"oliver","mood":"sad","text":"Tell the girl... her father... was so proud..."},{"speaker":"narrator","text":"Oliver Ashworth, solicitor, sixty-one years old, dies on the steps of the Thames as the fog closes over him.","sfx":"sting_death"}],"tag":"LOYALTY"},{"id":"c_chase_s","text":"Chase the shadow.","effects":{"reputation":10,"desire":10},"setFlags":["chased_shadow"],"response":[{"speaker":"narrator","text":"Down the Embankment, across the bridge, and into a black car with Swiss diplomatic plates.","sfx":"engine"},{"speaker":"narrator","text":"When the chase is over, so is Oliver."}],"tag":"DESIRE"},{"id":"c_police","text":"Call the police. Do this properly.","effects":{"trust":10,"reputation":-5,"control":5},"setFlags":["called_police"],"response":[{"speaker":"narrator","text":"The Met arrive in eleven minutes. Oliver Ashworth has been dead for ten.","sfx":"sting_death"}],"tag":"CONTROL"}],"puzzle":"l_murder","next":[{"if":{"pov":"kolade","flags":["elise_deal"]},"to":"l3_dark"},{"to":"l3_pub"}],"tension":true,"keepsake":"k_voice_oliver","music":"tension"},{"id":"l3_pub","background":"london_night","lines":[{"speaker":"narrator","text":"A pub off the Strand, near closing. Nobody is drinking."},{"speaker":"narrator","if":{"notPov":"kolade","flags":["suspects_kolade"]},"text":"Kolade keeps checking his phone. Every time it buzzes, he turns it face down."},{"speaker":"tari","mood":"angry","text":"They killed him for a key. For a KEY."},{"speaker":"hadiza","text":"They killed him because he knew where the money went. And now so do we."}],"prompt":"London has already taken one life.","choices":[{"id":"c_confront_k","if":{"notPov":"kolade","flags":["suspects_kolade"]},"text":"\"Kolade. Who keeps calling you?\"","effects":{"trust":5,"control":5},"setFlags":["confronted_kolade"],"response":[{"speaker":"kolade","mood":"surprised","text":"My mother."},{"speaker":"narrator","text":"Nobody believes him. Nobody can prove otherwise, either."}],"tag":"CONTROL","rel":{"kolade":{"tension":15}}},{"id":"c_vow","text":"\"We finish this. For the Chief, and for Oliver.\"","effects":{"trust":5,"reputation":5,"loyalty":10},"setFlags":["vowed"],"response":[{"speaker":"hadiza","text":"For Oliver."},{"speaker":"tari","text":"For the Chief."}],"tag":"LOYALTY"},{"id":"c_lone","text":"Trust no one at this table.","effects":{"trust":-5,"reputation":5,"control":10,"loyalty":-5},"setFlags":["lone_wolf"],"response":[{"speaker":"narrator","text":"In this game, the cautious ones live longest."}],"tag":"CONTROL"},{"id":"c_lev_shame","leverage":"s_shame","tag":"LEVERAGE","text":"Read Oliver's diary aloud: \"My shame: I knew about Geneva for two years and said nothing.\"","effects":{"control":10,"trust":5},"setFlags":["group_united"],"response":[{"speaker":"hadiza","mood":"sad","text":"He knew. And he died trying to make it right."},{"speaker":"tari","text":"Then we finish what he started."}]},{"id":"c_lev_spoon_pub","leverage":"s_spoon","tag":"LEVERAGE","text":"Lay the blackened spoon on the table. \"E.M. Elise Moreau. She killed the Chief.\"","effects":{"control":10,"reputation":5},"setFlags":["named_killer"],"response":[{"speaker":"narrator","text":"Nobody touches it. Everybody stares at it."},{"speaker":"hadiza","mood":"angry","text":"Then Geneva is not a bank visit. It is a hunt."}]}],"next":"l4_bridge","music":"night"},{"id":"l3_dark","background":"london_night","lines":[{"speaker":"narrator","text":"A pub off the Strand, near closing. Kolade's phone buzzes. Geneva."},{"speaker":"phone","text":"Unfortunate about the solicitor. Bring me the key, Monsieur Balogun. Then the crown is yours."},{"speaker":"tari","mood":"angry","text":"They killed him for a key. For a KEY."},{"speaker":"narrator","text":"Across the table, Nabyen is crying without making a sound."}],"prompt":"Elise wants the key. The others are watching Kolade.","choices":[{"id":"c_confess","text":"Tell them everything about Elise's offer.","effects":{"trust":15,"reputation":-10,"loyalty":20},"setFlags":["confessed"],"response":[{"speaker":"tari","mood":"angry","text":"You WHAT?"},{"speaker":"hadiza","text":"...Then she trusts him. That's useful. Very useful."},{"speaker":"nabyen","mood":"sad","text":"Thank you for telling us. Don't ever lie to me again."}],"tag":"LOYALTY"},{"id":"c_betray","text":"Say nothing. Text Elise one word: 'Soon.'","effects":{"reputation":10,"trust":-15,"loyalty":-25,"desire":5},"setFlags":["betrayer"],"echo":"There is no undoing this.","response":[{"speaker":"narrator","text":"Sent. Delivered. Read."}],"tag":"LUXURY"}],"next":"l4_bridge","tension":true,"music":"tension"},{"id":"l4_bridge","background":"london_night","memory":"m_bridge","lines":[{"speaker":"narrator","text":"On the parapet, under a lamp, someone has left a white lily. Nobody touches it.","sfx":"whisper"},{"speaker":"narrator","if":{"notPov":"nabyen"},"text":"Westminster Bridge, two in the morning. Nabyen has been crying, and is pretending she hasn't."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"mood":"sad","text":"Everyone who gets close to this ends up dead."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"text":"Maybe you should go home."},{"speaker":"narrator","if":{"pov":"nabyen","flags":["spark_tari"]},"text":"Westminster Bridge, two in the morning. Tari found her, because Tari always finds her."},{"speaker":"tari","if":{"pov":"nabyen","flags":["spark_tari"]},"mood":"sad","text":"I'm not going home. Not without you."},{"speaker":"tari","if":{"pov":"nabyen","flags":["spark_tari"]},"mood":"sad","text":"The roses. Every birthday since you were twelve. The notes. W."},{"speaker":"tari","if":{"pov":"nabyen","flags":["spark_tari"]},"mood":"intimate","text":"The Chief asked me to watch over you. I never told him I had fallen in love with you."},{"speaker":"nabyen","if":{"pov":"nabyen","flags":["spark_tari"]},"mood":"surprised","text":"...You. It was always you."},{"speaker":"narrator","if":{"pov":"nabyen","flags":["spark_kolade"]},"text":"Westminster Bridge, two in the morning. Kolade found her, with two cups of terrible coffee."},{"speaker":"kolade","if":{"pov":"nabyen","flags":["spark_kolade"]},"mood":"smile","text":"Lagos can wait. You can't."},{"speaker":"narrator","if":{"pov":"nabyen","notFlags":["spark_tari","spark_kolade"]},"text":"Westminster Bridge, two in the morning. She's alone, and that's how she wanted it."}],"prompt":"Big Ben strikes two.","choices":[{"id":"c_kiss_n","if":{"notPov":"nabyen","flags":["spark_nabyen"]},"text":"Kiss her.","effects":{"affection":15,"desire":15},"setFlags":["romance_nabyen"],"response":[{"speaker":"narrator","text":"Her mouth tastes of rain and London and something like home. The fog swallows the bridge, the river, the whole city, until there is nobody left in London but the two of you."},{"speaker":"nabyen","mood":"smile","text":"...Okay. So that happened."}],"tag":"DESIRE","rel":{"nabyen":{"intimacy":20,"tension":5}},"gate":{"if":{"rel":{"nabyen":{"minIntimacy":30}}},"label":"Requires intimacy 30+ with Nabyen"},"risk":"High risk","sfx":"sting_romance"},{"id":"c_stay_n","if":{"notPov":"nabyen"},"text":"\"I'm not going anywhere.\"","effects":{"affection":5,"trust":5,"loyalty":5},"setFlags":["promised_nabyen"],"response":[{"speaker":"nabyen","mood":"smile","text":"Good. I'd hate to have to come and find you."}],"tag":"LOYALTY","rel":{"nabyen":{"intimacy":5}}},{"id":"c_walk_back","if":{"notPov":"nabyen"},"text":"Walk her back to the hotel without a word.","effects":{"trust":5,"control":5},"response":[{"speaker":"narrator","text":"Some silences say more than speeches. This is one of them."}],"tag":"CONTROL","rel":{"nabyen":{"tension":5}}},{"id":"c_kiss_tari","if":{"pov":"nabyen","flags":["spark_tari"]},"text":"Kiss Tari.","effects":{"affection":15,"desire":15},"setFlags":["romance_tari"],"response":[{"speaker":"narrator","text":"He kisses her like a man who has waited twenty years and is done waiting. Big Ben strikes again. Neither of them hears it."},{"speaker":"tari","mood":"smile","text":"Twenty years I've wanted to do that."}],"tag":"DESIRE","rel":{"tari":{"intimacy":20}},"gate":{"if":{"rel":{"tari":{"minIntimacy":30}}},"label":"Requires intimacy 30+ with Tari"},"risk":"High risk","sfx":"sting_romance"},{"id":"c_kiss_kolade","if":{"pov":"nabyen","flags":["spark_kolade"]},"text":"Kiss Kolade.","effects":{"affection":15,"desire":15},"setFlags":["romance_kolade"],"response":[{"speaker":"narrator","text":"The coffee goes into the Thames. His hand at the small of her back, careful, as if she might vanish. For once, Kolade Balogun isn't performing for anyone."},{"speaker":"kolade","mood":"smile","text":"For once in my life, I have nothing clever to say."}],"tag":"DESIRE","rel":{"kolade":{"intimacy":20,"tension":-5}},"gate":{"if":{"rel":{"kolade":{"minIntimacy":30}}},"label":"Requires intimacy 30+ with Kolade"},"risk":"High risk","sfx":"sting_romance"},{"id":"c_call_mama","if":{"pov":"nabyen"},"text":"Call Mama Kaneng in Jos.","effects":{"affection":5,"trust":5,"loyalty":5},"response":[{"speaker":"kaneng","mood":"sad","text":"My daughter. Come home in one piece. That is all I'm asking."}],"tag":"LOYALTY"}],"next":null,"tension":true,"music":"romance"}],"outcomes":[{"id":"l_betray","if":{"flags":["betrayer"]},"title":"Thirty Pieces of Silver","text":"Kolade chose Elise. Nobody knows yet. Everybody will."},{"id":"l_confess","if":{"flags":["confessed"]},"title":"The Confession","text":"Kolade told the truth when lying would have been easier. That's rarer than gold."},{"id":"l_kiss","if":{"anyFlags":["romance_nabyen","romance_tari","romance_kolade"]},"title":"A Kiss in the Fog","text":"A man died tonight, and something else began. London is like that."},{"id":"l_death","title":"Death on the Embankment","text":"Oliver Ashworth died for a brass key. The killers are already in Geneva."}],"reflections":[{"if":{"flags":["stayed_oliver"]},"text":"Oliver's last words were for Nabyen."},{"if":{"flags":["chased_shadow"]},"text":"Swiss diplomatic plates. Whoever this is, they're protected."}],"secrets":{"s_shame":{"title":"Oliver's diary","text":"SHAME. From Oliver's diary, found in his coat: 'My shame: I knew about Geneva for two years and said nothing.'"}},"memories":{"m_london":{"title":"Rain at Lincoln's Inn","background":"london","text":"Red buses, old paper, and a frightened man with a key."},"m_bridge":{"title":"Westminster, 2 a.m.","background":"london_night","text":"Fog, lamplight, and Big Ben striking two."}},"keepsakes":{"k_voice_oliver":{"type":"voice","title":"Oliver's last voicemail","from":"Oliver Ashworth, 8:52 pm","text":"If you're hearing this, I didn't make it to the Embankment. The key opens the vault. The blood opens the truth. And look after the girl. Please."}},"epigraph":{"text":"London keeps its secrets the way the Thames keeps its dead.","source":"Oliver Ashworth's diary"}},"chapters/c4_alps.json":{"id":"c4_alps","number":4,"title":"The Vault in the Alps","place":"Geneva and Zermatt, Switzerland","teaser":"A blue lake, a vault that only opens for blood, and a choice on the mountain that someone won't come back from.","start":"a0_montreux","scenes":[{"id":"a0_montreux","background":"montreux_night","music":"romance","tension":true,"memory":"m_montreux","lines":[{"speaker":"narrator","text":"Montreux. The night before the bank. A grand old hotel on the lake, and nobody can sleep."},{"speaker":"narrator","if":{"notPov":"nabyen"},"text":"Nabyen is on the balcony in borrowed silk, barefoot, watching the lights shiver on the water."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"mood":"intimate","text":"Tomorrow we walk into the bank that killed my father. Tonight, I just want to pretend we are two people on holiday."},{"speaker":"tari","if":{"pov":"nabyen","anyFlags":["spark_tari","romance_tari"]},"mood":"intimate","text":"I used to dream about this. Not the bank. You, somewhere quiet, not running."},{"speaker":"kolade","if":{"pov":"nabyen","anyFlags":["spark_kolade","romance_kolade"]},"mood":"intimate","text":"I booked the suite with the best view. Don't look at me like that. I booked two."},{"speaker":"narrator","if":{"pov":"nabyen","notFlags":["spark_tari","romance_tari","spark_kolade","romance_kolade"]},"text":"Nabyen is alone on the balcony. Someone has left a single red rose on the railing. No card."},{"speaker":"narrator","text":"Then, from the corridor, a sound. A key card trying the door. Once. Twice.","sfx":"knock"}],"prompt":"Someone is trying the door.","choices":[{"id":"c_dance_n","if":{"notPov":"nabyen"},"tag":"DESIRE","risk":"High risk","sfx":"sting_romance","text":"Ignore it. Pull her close and dance to the music drifting up from the lobby.","effects":{"desire":15,"control":-5},"rel":{"nabyen":{"intimacy":15,"tension":5}},"setFlags":["spark_nabyen","danced"],"response":[{"speaker":"narrator","text":"Slow, barefoot, the lake glittering below. Her head on your shoulder. The handle stops turning."},{"speaker":"nabyen","mood":"intimate","text":"Whoever it was will come back."},{"speaker":"nabyen","mood":"smile","text":"Let them. Not yet. Not tonight."}]},{"id":"c_dance_t","if":{"pov":"nabyen","anyFlags":["spark_tari","romance_tari"]},"tag":"DESIRE","risk":"High risk","sfx":"sting_romance","text":"Ignore it. Take Tari's hands and dance on the balcony.","effects":{"desire":15,"control":-5},"rel":{"tari":{"intimacy":15}},"setFlags":["danced"],"response":[{"speaker":"narrator","text":"He dances like a man who learned on a riverboat, which he did. She laughs for the first time since the funeral. The handle stops turning."},{"speaker":"tari","mood":"intimate","text":"Whoever it was, they can wait until morning."}]},{"id":"c_dance_k","if":{"pov":"nabyen","anyFlags":["spark_kolade","romance_kolade"]},"tag":"DESIRE","risk":"High risk","sfx":"sting_romance","text":"Ignore it. Let Kolade lead her into a slow dance.","effects":{"desire":15,"control":-5},"rel":{"kolade":{"intimacy":15,"tension":5}},"setFlags":["danced"],"response":[{"speaker":"narrator","text":"He is a beautiful dancer, of course he is. His heartbeat, though, is not as calm as his smile. The handle stops turning."},{"speaker":"kolade","mood":"intimate","text":"I have never been afraid of anything in my life. I am afraid of how much I want this."}]},{"id":"c_fight_door","tag":"CONTROL","risk":"High risk","sfx":"door","text":"Grab the iron poker from the fireplace. Throw the door open.","effects":{"control":10,"desire":5},"setFlags":["fought_intruder"],"keepsake":"k_syringe","response":[{"speaker":"narrator","text":"A man in a hotel uniform, a syringe in his gloved hand. The poker finds his wrist first.","sfx":"glass"},{"speaker":"narrator","text":"Glass, shouting, footsteps pounding down the service stairs. He is gone. The syringe is not."},{"speaker":"narrator","text":"It smells of nothing at all. Like thallium. Like the Chief's tea.","sfx":"sting_reveal"}]},{"id":"c_hide","tag":"LOYALTY","sfx":"heartbeat","text":"Kill the lights. Stay very still. Very close.","effects":{"loyalty":10,"desire":5},"setFlags":["hid_together"],"response":[{"speaker":"narrator","text":"In the dark, two heartbeats, far too loud. The handle turns. Stops. Footsteps walk slowly away."},{"speaker":"narrator","text":"Nobody moves for a long time. Nobody wants to."}]}],"next":"a1_geneva"},{"id":"a1_geneva","background":"geneva","memory":"m_geneva","lines":[{"speaker":"narrator","text":"Geneva. A lake so blue it looks painted, and a fountain throwing water a hundred and forty metres into the sky."},{"speaker":"narrator","text":"Banque Moreau is a grey stone building with no sign on the door."},{"speaker":"elise","mood":"smile","text":"Welcome. Elise Moreau. I was so sorry to hear about Mr Ashworth. London is a dangerous city."},{"speaker":"elise","if":{"flags":["betrayer"]},"mood":"smile","text":"And Monsieur Balogun. How nice to see a familiar face."},{"speaker":"narrator","if":{"flags":["betrayer"]},"text":"Every head turns toward Kolade."},{"speaker":"elise","text":"Chief Okoro's box requires his key and the blood of an Okoro. I'm afraid none of you qualify."}],"next":"a2_vault","music":"calm"},{"id":"a2_vault","background":"vault","memory":"m_vault","lines":[{"speaker":"narrator","text":"Ten floors underground, a round steel door older than the bank above it."},{"speaker":"narrator","text":"The brass key turns. The vault doesn't open. Beside the lock is a small glass plate, the size of a fingertip."},{"speaker":"nabyen","mood":"worried","text":"The blood of an Okoro..."},{"speaker":"narrator","text":"Nabyen presses her finger to the glass. A needle, a single drop of red, and the great door begins to turn.","sfx":"door"},{"speaker":"elise","mood":"surprised","text":"That's... impossible."},{"speaker":"narrator","text":"Inside: the second half of the will, half of a coral bracelet that matches Nabyen's exactly, and a ledger bound in black leather."},{"speaker":"narrator","text":"Nabyen fits the two halves of coral together. They are warm. Every candle in the vault gutters at once, though there is no wind, and a woman's voice says, very close: \"The river has chosen.\"","sfx":"whisper"},{"speaker":"letter","text":"To my daughter Nabyen, and to the three children I chose: the crown belongs to whoever you choose, together. Elise Moreau has robbed me for ten years. The proof is in this book. — G.O."},{"speaker":"narrator","text":"On the last page of the ledger, under every stolen transfer, two initials: E.M. And beneath them, smaller, a single letter in a different hand: B.","sfx":"sting_reveal"},{"speaker":"elise","mood":"angry","text":"Guards!","sfx":"sting_reveal"}],"prompt":"Elise Moreau's guards are pounding down the stairs.","choices":[{"id":"c_grab","text":"Grab the ledger and run.","effects":{"reputation":5,"control":5},"setFlags":["has_ledger"],"response":[{"speaker":"narrator","text":"Up the stairs, through the lobby, out into the sunlight with alarms screaming."}],"tag":"CONTROL"},{"id":"c_hold","text":"Hold the vault door so the others can get out.","effects":{"trust":10,"reputation":5,"loyalty":10},"setFlags":["has_ledger","held_door"],"response":[{"speaker":"narrator","text":"Steel against shoulder, ten seconds that feel like ten years. Long enough."}],"tag":"LOYALTY"}],"puzzle":"a_geneva","next":"a3_train","tension":true,"keepsake":"k_coral_whole","music":"tension"},{"id":"a3_train","background":"alps","lines":[{"speaker":"narrator","text":"The mountain train to Zermatt. Snow, pines, and a red carriage crawling up the edge of the world."},{"speaker":"narrator","text":"Elise's men are two carriages behind them."},{"speaker":"narrator","text":"Two carriages back, a window shatters.","sfx":"glass"},{"speaker":"narrator","text":"A shot whines off the steel rail beside your head.","sfx":"gunshot"},{"speaker":"hadiza","mood":"worried","text":"There's a footpath from the next station down to the police post at Täsch. Steep, and in this weather, deadly."},{"speaker":"hadiza","text":"One person carries the ledger down. The rest of us lead them up the mountain."},{"speaker":"narrator","if":{"flags":["betrayer"]},"text":"Kolade is texting. Elise's men know exactly which carriage they're in."}],"prompt":"Who carries the ledger down the mountain?","choices":[{"id":"c_send_tari","if":{"notPov":"tari"},"text":"Tari. He's the strongest of us.","effects":{"trust":5,"control":10},"setFlags":["sent_tari","dead_tari","elise_caught"],"echo":"Nobody says goodbye properly.","response":[{"speaker":"tari","mood":"smile","text":"Easy. It's only downhill."}],"tag"
