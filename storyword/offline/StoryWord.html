<style>
/* StoryWord: Crown of the Confluence. Colourful, warm, cinematic. Mobile first. */

:root {
  --bg: #1a0b24;
  --bg-2: #2a0f3a;
  --surface: #2e1640;
  --surface-2: #3d1f52;
  --ink: #fff6ec;
  --muted: #c9b5d6;
  --accent: #ff6b4a;
  --accent-2: #ffb703;
  --teal: #19c3b4;
  --gold: #ffcc4d;
  --ok: #2fbf71;
  --danger: #e5484d;
  --line: rgba(255, 246, 236, 0.14);
  --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
  --radius: 20px;
  --serif: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --kente: repeating-linear-gradient(90deg, #ffb703 0 14px, #19c3b4 14px 22px, #ff6b4a 22px 36px, #2a0f3a 36px 40px, #2fbf71 40px 50px, #2a0f3a 50px 54px);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(circle at 20% 0%, #4a1460 0, transparent 55%), radial-gradient(circle at 100% 100%, #5a1a2a 0, transparent 50%), var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.muted-light { color: rgba(255, 255, 255, 0.75); margin: 0; }
.center { text-align: center; }

/* --- Scene layer ---------------------------------------------------------- */

#scene { position: fixed; inset: 0; z-index: 0; transition: opacity 0.5s, filter 0.5s; }
#scene svg { width: 100%; height: 100%; display: block; }
body[data-scene='none'] #scene { opacity: 0; }
body[data-scene='dim'] #scene { opacity: 0.55; filter: saturate(1.1) blur(1.5px); }
body[data-scene='full'] #scene { opacity: 1; }
#app { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; min-height: 100dvh; }

.screen {
  min-height: 100dvh;
  padding: max(12px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 14px;
  animation: fade-in 0.35s ease;
}
.screen.center { justify-content: center; align-items: center; text-align: center; }
@keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Scene animations */
.drift { animation: drift linear infinite alternate; }
@keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
.shimmer { animation: shimmer 3s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: 0.08; } }
.twinkle { animation: twinkle 3.5s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: 0.2; } }
.flicker { animation: flicker 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flicker { 0%, 100% { opacity: 1; transform: scaleY(1); } 30% { opacity: 0.8; transform: scaleY(1.08); } 60% { opacity: 0.92; transform: scaleY(0.94); } }
.rain { animation: rain 0.9s linear infinite; }
@keyframes rain { from { transform: translate(0, -60px); } to { transform: translate(-12px, 120px); } }
.snow { animation: snow linear infinite; }
@keyframes snow { from { transform: translate(0, -720px); } to { transform: translate(30px, 40px); } }
.palm { animation: sway 4s ease-in-out infinite; transform-box: fill-box; transform-origin: 0 0; }
@keyframes sway { 50% { transform: rotate(4deg); } }
.bob { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }
.jet { animation: jet 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes jet { 50% { transform: scaleY(0.94); opacity: 0.85; } }
.fly { animation: fly 30s linear infinite; }
@keyframes fly { from { transform: translateX(-160px); } to { transform: translateX(480px); } }
.flash { animation: flash 7s infinite; }
@keyframes flash { 0%, 88%, 92%, 100% { opacity: 0; } 89%, 91% { opacity: 0.55; } }
.firefly { animation: firefly ease-in-out infinite alternate; }
@keyframes firefly { 0% { opacity: 0; transform: translate(0, 0); } 50% { opacity: 1; } 100% { opacity: 0.2; transform: translate(18px, -24px); } }
.train { animation: train 22s linear infinite; }
@keyframes train { from { transform: translateX(-200px); } to { transform: translateX(440px); } }
.spin { animation: spin 18s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Portrait animations */
.breathe { animation: breathe 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: translateY(1.2px) scale(1.006); } }
.lid { animation: blink 5.5s infinite; }
@keyframes blink { 0%, 95%, 100% { transform: scaleY(0.02); } 97% { transform: scaleY(1); } }
.sway { animation: earring 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
.sway-alt { animation-delay: -1.4s; }
@keyframes earring { 50% { transform: rotate(6deg); } }
.sway-slow { animation: hair 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes hair { 50% { transform: rotate(0.8deg); } }

/* --- Top bar & shared controls ------------------------------------------ */

.topbar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.topbar-label { flex: 1; text-align: center; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.85); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6); }
.home .topbar { justify-content: flex-end; }
.pill {
  padding: 6px 12px; border-radius: 999px; background: rgba(20, 8, 30, 0.55); backdrop-filter: blur(8px);
  font-size: 0.9rem; font-weight: 650; white-space: nowrap; border: 1px solid var(--line);
}
.pill-spacer { width: 44px; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(20, 8, 30, 0.55);
  backdrop-filter: blur(8px); font-size: 1.15rem; display: grid; place-items: center; flex: none;
}
.btn {
  border: 0; border-radius: 999px; padding: 14px 20px; background: var(--surface-2);
  font-weight: 700; letter-spacing: 0.02em; transition: transform 0.12s ease, opacity 0.2s;
}
.btn:active, .icon-btn:active, .tile:active, .choice:active, .char-card:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.45; }
.btn.primary { background: linear-gradient(135deg, var(--accent), #e8336d); color: #fff; box-shadow: 0 10px 24px rgba(232, 51, 109, 0.4); }
.btn.big { font-size: 1.15rem; padding: 18px; letter-spacing: 0.08em; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.link { background: none; box-shadow: none; }
.btn.link.danger { color: #ff8a8f; margin-top: auto; }

/* --- Home ------------------------------------------------------------------ */

.logo { text-align: center; font-size: 2.3rem; letter-spacing: 0.18em; margin-top: 4px; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
.logo span { background: linear-gradient(90deg, var(--accent-2), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero {
  position: relative; border-radius: 26px; padding: 18px 16px 0; overflow: hidden;
  background: linear-gradient(160deg, rgba(255, 107, 74, 0.35), rgba(58, 12, 163, 0.45)), rgba(20, 8, 30, 0.55);
  backdrop-filter: blur(6px); border: 1px solid var(--line); box-shadow: var(--shadow);
  display: grid; grid-template-columns: 46% 1fr; align-items: end; gap: 8px; min-height: 250px;
}
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--kente); }
.hero-portrait { align-self: end; margin-bottom: 6px; }
.hero-portrait .portrait-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45)); }
.hero-text { padding-bottom: 22px; display: flex; flex-direction: column; gap: 6px; }
.hero-text h2 { font-size: 1.45rem; line-height: 1.15; }
.hero-text p { margin: 0; font-size: 0.9rem; color: rgba(255, 255, 255, 0.88); line-height: 1.4; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin: 0; }
.places { margin: 0; text-align: center; font-size: 0.74rem; letter-spacing: 0.06em; color: var(--muted); }
.home-links { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.link-card {
  border: 1px solid var(--line); border-radius: var(--radius); background: rgba(20, 8, 30, 0.6); backdrop-filter: blur(8px);
  padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; font-weight: 700;
}
.link-card small { color: var(--muted); font-weight: 400; font-size: 0.78rem; }

/* --- Story ----------------------------------------------------------------- */

.screen.story { gap: 0; cursor: pointer; user-select: none; }
.stage { flex: 1; display: flex; align-items: flex-end; justify-content: center; min-height: 170px; }
.portrait { width: min(70vw, 290px); }
.portrait.enter { animation: rise 0.45s ease; }
.portrait.small { width: min(48vw, 200px); }
.portrait-svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.45)); }
.portrait.mood-surprised .portrait-svg { animation: jolt 0.3s 0.05s; }
.portrait.mood-angry .portrait-svg { animation: jolt 0.22s 0.05s 2; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes jolt { 50% { transform: translateY(-6px); } }

.dialogue {
  position: relative; background: rgba(22, 10, 32, 0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-radius: 22px; padding: 20px 20px 14px; margin-top: 12px; min-height: 150px; border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px; animation: fade-in 0.25s ease; overflow: hidden;
}
.dialogue::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--kente); opacity: 0.9; }
.speaker { margin: 0; font-weight: 800; font-size: 0.84rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent, var(--gold)); }
.speaker em { font-style: normal; color: var(--muted); letter-spacing: 0.04em; text-transform: none; font-weight: 600; }
.line { margin: 0; font-family: var(--serif); font-size: 1.2rem; line-height: 1.45; }
.narration .line { font-style: italic; }
.tap { margin-top: auto; align-self: flex-end; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.55; animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { opacity: 0.2; } }
.message-line { min-height: 0; background: none; backdrop-filter: none; border: 0; }
.message-line::before { display: none; }

.phone {
  width: min(80vw, 310px); background: #f7f7fa; color: #1b1b22; border-radius: 28px;
  padding: 18px 16px 22px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); animation: rise 0.4s ease;
}
.phone-from { margin: 0 0 10px; text-align: center; font-size: 0.78rem; color: #777; letter-spacing: 0.05em; }
.bubble { margin: 0; background: #e6e6ec; border-radius: 18px 18px 18px 4px; padding: 12px 14px; font-size: 1.05rem; line-height: 1.4; }

.letter-card {
  position: relative; width: min(84vw, 330px); background: linear-gradient(170deg, #fbf1dc, #f0dcb4); color: #3a2414;
  border-radius: 6px; padding: 30px 22px 22px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5); animation: unfold 0.5s ease;
  transform: rotate(-1.2deg);
}
.letter-card p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.12rem; line-height: 1.5; }
.seal { position: absolute; top: -14px; left: 50%; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #e04a3a, #8e1b14); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4); }
@keyframes unfold { from { opacity: 0; transform: rotate(-1.2deg) scaleY(0.6); } to { opacity: 1; transform: rotate(-1.2deg); } }

.choices { cursor: default; gap: 10px; }
.prompt-line { margin: 0 0 4px; font-family: var(--serif); font-style: italic; font-size: 1.1rem; color: var(--gold); }
.choice {
  border: 1px solid rgba(255, 255, 255, 0.24); background: rgba(255, 255, 255, 0.08); color: #fff;
  border-radius: 16px; padding: 14px 16px; text-align: left; font-size: 1rem; line-height: 1.35;
  transition: background 0.15s, transform 0.12s, border-color 0.15s;
}
.choice:hover { background: rgba(255, 255, 255, 0.16); border-color: var(--gold); }

/* --- Character select ------------------------------------------------------ */

.screen.select { background: linear-gradient(180deg, rgba(20, 8, 30, 0.55), rgba(20, 8, 30, 0.85)); }
.select-title { text-align: center; font-size: 1.6rem; margin-top: 4px; }
.char-grid { display: flex; flex-direction: column; gap: 12px; }
.char-card {
  display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: end; text-align: left;
  border: 1px solid var(--line); border-radius: 22px; padding: 10px 14px 0 8px; overflow: hidden; position: relative;
  background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 38%, transparent), rgba(20, 8, 30, 0.75));
  box-shadow: var(--shadow); transition: transform 0.15s, border-color 0.15s;
}
.char-card:hover { border-color: var(--accent); }
.char-card.heroine { border: 2px solid var(--gold); box-shadow: 0 0 0 4px rgba(255, 204, 77, 0.15), var(--shadow); }
.char-portrait .portrait-svg { width: 100%; height: auto; display: block; }
.char-info { display: flex; flex-direction: column; gap: 3px; padding-bottom: 12px; }
.char-info b { font-family: var(--serif); font-size: 1.15rem; }
.char-info .house { font-size: 0.74rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gold); }
.char-info .tagline { font-size: 0.86rem; line-height: 1.35; color: rgba(255, 255, 255, 0.85); }
.badge { align-self: flex-start; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; background: var(--gold); color: #3a2414; padding: 3px 8px; border-radius: 999px; }

/* --- Puzzle ---------------------------------------------------------------- */

.screen.puzzle { gap: 10px; }
.puzzle-card { background: rgba(22, 10, 32, 0.72); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 22px; padding: 16px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; }
.puzzle-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--kente); }
.prompt { margin: 4px 0 0; font-family: var(--serif); font-style: italic; font-size: 1.1rem; line-height: 1.4; text-align: center; }
.clue { margin: 0; text-align: center; color: var(--gold); font-size: 0.88rem; }
.rows { display: flex; flex-direction: column; align-items: center; gap: 7px; margin: 6px 0 0; }
.row { display: flex; gap: 5px; }
.slot {
  width: 36px; height: 40px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
  display: grid; place-items: center; font-weight: 800; font-size: 1.15rem;
}
.row.found .slot { background: linear-gradient(160deg, var(--teal), #0f8f84); color: #fff; border-color: transparent; animation: flip 0.35s ease backwards; }
.row.found .slot:nth-child(2) { animation-delay: 0.04s; }
.row.found .slot:nth-child(3) { animation-delay: 0.08s; }
.row.found .slot:nth-child(4) { animation-delay: 0.12s; }
.row.found .slot:nth-child(5) { animation-delay: 0.16s; }
.row.found .slot:nth-child(6) { animation-delay: 0.2s; }
.row.found .slot:nth-child(7) { animation-delay: 0.24s; }
.row.found .slot:nth-child(8) { animation-delay: 0.28s; }
@keyframes flip { from { transform: rotateX(90deg); } to { transform: none; } }
.bonus { margin: 0; text-align: center; font-size: 0.82rem; color: var(--accent-2); font-weight: 700; }
.guess {
  align-self: center; min-width: 60%; min-height: 54px; border: 0; border-bottom: 2px solid var(--gold);
  background: none; font-size: 1.8rem; font-weight: 800; letter-spacing: 0.2em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}
.guess.empty { font-size: 0.9rem; font-weight: 400; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.7); }
.guess.shake { animation: shake 0.35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.feedback { margin: 0; text-align: center; min-height: 1.3em; font-size: 0.92rem; color: #fff; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: auto 0 6px; padding-top: 8px; }
.tile {
  width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35);
  background: radial-gradient(circle at 35% 30%, #ffd88a, #ff9a3c 60%, #e8603c); color: #3a1406;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35); font-size: 1.5rem; font-weight: 900; transition: transform 0.12s, opacity 0.2s;
}
.tile.used { opacity: 0.25; }
.tile.off { opacity: 0.08; transform: scale(0.85); }
.puzzle-actions { display: flex; gap: 10px; align-items: center; justify-content: center; }
.puzzle-actions .btn.primary { flex: 1; }
.btn.hint { background: linear-gradient(135deg, #ffd166, #ffb703); color: #3a2414; }

/* --- Overlay --------------------------------------------------------------- */

.overlay {
  position: fixed; inset: 0; background: rgba(10, 4, 16, 0.6); display: grid; place-items: end center;
  padding: 16px; z-index: 10; animation: fade-in 0.2s ease; backdrop-filter: blur(3px);
}
.sheet {
  width: 100%; max-width: 448px; background: linear-gradient(170deg, #3d1f52, #2a0f3a); color: var(--ink); border-radius: 26px;
  padding: 24px 20px; display: flex; flex-direction: column; gap: 12px; text-align: center; box-shadow: var(--shadow);
  border: 1px solid var(--line); position: relative; overflow: hidden;
}
.sheet::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: var(--kente); }
.sheet p { margin: 0; }
.pop { animation: pop 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
@keyframes pop { from { transform: translateY(40px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
.stars { font-size: 2.4rem; letter-spacing: 0.15em; color: rgba(255, 255, 255, 0.18); }
.stars .on { color: var(--gold); text-shadow: 0 0 18px rgba(255, 204, 77, 0.6); }
.reward-line { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chip { background: rgba(255, 255, 255, 0.1); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; }

/* --- Results, profile, memories -------------------------------------------- */

.card { background: rgba(46, 22, 64, 0.85); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.results h1 { font-size: 2rem; }
.outcome { position: relative; overflow: hidden; }
.outcome::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--kente); }
.outcome h2 { font-size: 1.35rem; margin-bottom: 6px; color: var(--gold); }
.outcome p { margin: 0; line-height: 1.5; font-family: var(--serif); font-size: 1.05rem; }
.outcome ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); line-height: 1.5; }
.fallen h3 { font-size: 1rem; color: #ff8a8f; margin-bottom: 4px; }
.fallen p { margin: 0; font-family: var(--serif); font-style: italic; }
.stat { display: grid; grid-template-columns: 90px 1fr 32px; align-items: center; gap: 10px; padding: 4px 0; font-size: 0.9rem; }
.stat b { text-align: right; }
.bar { height: 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--gold), var(--accent)); border-radius: inherit; }
.reward-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
.reward-grid div { display: flex; flex-direction: column; gap: 2px; }
.reward-grid span { font-size: 0.75rem; color: var(--muted); }
.path h3 { font-size: 1.1rem; }
.path p { margin: 4px 0 8px; font-size: 0.85rem; }
.path ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.path li { line-height: 1.35; }
.path li > div { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.mini { flex: none; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 1px 9px; font-size: 0.85rem; }
.actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
.actions:has(.btn + .btn) { grid-template-columns: 1fr 1.6fr; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.kv b { text-align: right; }
.kv:last-child { border-bottom: 0; }

.memory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.memory {
  margin: 0; aspect-ratio: 3 / 4; border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; align-items: flex-end; overflow: hidden; position: relative; color: #fff; border: 1px solid var(--line);
}
.memory-art { position: absolute; inset: 0; }
.memory-art svg { width: 100%; height: 100%; display: block; }
.memory::after { content: ''; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(0, 0, 0, 0.7)); }
.memory figcaption { position: relative; z-index: 1; padding: 12px; display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; line-height: 1.35; }
.memory figcaption b { font-family: var(--serif); font-size: 1rem; }
.memory.locked { background: rgba(255, 255, 255, 0.05); color: var(--muted); }
.memory.locked::after { display: none; }
.memories h3 small { color: var(--muted); font-family: var(--sans); font-size: 0.85rem; }
.secrets { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.secrets li { background: rgba(46, 22, 64, 0.85); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; font-size: 0.88rem; line-height: 1.4; }
.secrets li b { color: var(--gold); }
.secrets li.locked { opacity: 0.6; }

/* --- Toasts ---------------------------------------------------------------- */

#toasts { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 54px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 20; }
.toast {
  background: linear-gradient(135deg, #ffd166, #ffb703); color: #3a2414; padding: 10px 16px; border-radius: 999px; font-size: 0.88rem;
  font-weight: 700; box-shadow: var(--shadow); animation: fade-in 0.25s ease; transition: opacity 0.4s, transform 0.4s;
  max-width: calc(100% - 32px);
}
.toast.out { opacity: 0; transform: translateY(-8px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .lid { transform: scaleY(0.02); }
  .flash { opacity: 0; }
}
