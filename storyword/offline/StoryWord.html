:"CONTROL"},{"id":"c_send_hadiza","if":{"notPov":"hadiza"},"text":"Hadiza. She knows exactly what the ledger proves.","effects":{"trust":5,"control":10},"setFlags":["sent_hadiza","dead_hadiza","elise_caught"],"echo":"Nobody says goodbye properly.","response":[{"speaker":"hadiza","text":"Page by page. Don't wait for me."}],"tag":"CONTROL"},{"id":"c_send_kolade","if":{"notPov":"kolade"},"text":"Kolade. Lagos men run fast.","effects":{"trust":5,"control":10},"setFlags":["sent_kolade","dead_kolade","elise_caught"],"echo":"Nobody says goodbye properly.","response":[{"speaker":"kolade","mood":"smile","text":"Finally, a job that pays in glory."}],"tag":"CONTROL"},{"id":"c_send_self","text":"Carry it yourself.","effects":{"reputation":10,"loyalty":10,"desire":5},"setFlags":["went_self","elise_escaped"],"response":[{"speaker":"narrator","text":"{pov} zips the ledger into a coat pocket and steps off the train into the white."}],"tag":"LOYALTY"}],"puzzle":"a_snow","next":"a4_storm","tension":true,"music":"danger"},{"id":"a4_storm","background":"alps_storm","memory":"m_storm_alps","lines":[{"speaker":"narrator","text":"The storm comes in off the Matterhorn like the end of the world.","sfx":"thunder"},{"speaker":"narrator","if":{"flags":["sent_tari"]},"text":"Tari reaches the police post at Täsch with the ledger inside his jacket. The police find two bullets in him, and not one in the ledger.","sfx":"gunshot"},{"speaker":"tari","if":{"flags":["sent_tari"]},"mood":"sad","text":"Tell Nabyen... I owe her... a fish..."},{"speaker":"narrator","if":{"flags":["sent_tari"]},"text":"Tari Ebiowei, Prince of the Creeks, dies in the snow, very far from the river.","sfx":"sting_death"},{"speaker":"narrator","if":{"flags":["sent_hadiza"]},"text":"Hadiza reaches the police post at Täsch an hour after dark, the ledger dry and every page in order. Then she sits down in the snow and doesn't get up."},{"speaker":"hadiza","if":{"flags":["sent_hadiza"]},"mood":"sad","text":"Count it... properly... all of it..."},{"speaker":"narrator","if":{"flags":["sent_hadiza"]},"text":"Hadiza Lawan, the sharpest mind in Kano, dies with the numbers balanced.","sfx":"sting_death"},{"speaker":"narrator","if":{"flags":["sent_kolade"]},"text":"Kolade reaches the police post at Täsch running on pride and nothing else. Elise's men reach it a minute later.","sfx":"gunshot"},{"speaker":"kolade","if":{"flags":["sent_kolade"]},"mood":"sad","text":"Tell Lagos... I earned it..."},{"speaker":"narrator","if":{"flags":["sent_kolade"]},"text":"Kolade Balogun dies with his phone still recording. The recording is enough to convict Elise twice over.","sfx":"sting_death"},{"speaker":"narrator","if":{"flags":["elise_caught"]},"text":"The Swiss police arrest Elise Moreau at her chalet before midnight. Her lawyers arrive by breakfast. It won't help her."},{"speaker":"narrator","if":{"flags":["went_self"]},"text":"{pov} carries the ledger down alone. Frostbitten, half-blind, alive."},{"speaker":"narrator","if":{"flags":["went_self"]},"text":"But by the time the police reach the chalet, Elise Moreau is gone. Everyone else came down the mountain."},{"speaker":"narrator","if":{"flags":["betrayer"]},"text":"The others know now what Kolade did. Elise made sure of it, out of spite."}],"prompt":"The storm is passing.","choices":[{"id":"c_lev_wolf","if":{"flags":["elise_caught"]},"leverage":"s_wolf","tag":"LEVERAGE","risk":"High risk","text":"Lean close to the glass. \"Hello, Le Loup.\" Watch the mask slip.","effects":{"control":15},"setFlags":["elise_broken","justice"],"response":[{"speaker":"elise","mood":"angry","text":"...Who told you that name?"},{"speaker":"narrator","text":"By the time her lawyers arrive, Elise Moreau has confessed to everything. The poison. The spoon. Oliver."},{"speaker":"elise","mood":"smile","text":"You think I'm the wolf? Every wolf has a shepherd, darling. Ask yourself who knew exactly how your Chief took his tea.","sfx":"sting_reveal"}]},{"id":"c_justice","if":{"flags":["elise_caught"]},"text":"Hand everything to the Swiss courts. Let the law have her.","effects":{"trust":10,"loyalty":10},"setFlags":["justice"],"response":[{"speaker":"narrator","text":"Elise Moreau will spend the next twenty years looking at a very small piece of Swiss sky."}],"tag":"LOYALTY"},{"id":"c_deal","if":{"flags":["elise_caught"]},"text":"Offer Elise a deal: return every franc, and she walks.","effects":{"reputation":10,"trust":-10,"loyalty":-15,"control":10},"setFlags":["deal_elise"],"response":[{"speaker":"elise","mood":"smile","text":"You're more like him than you know."},{"speaker":"narrator","text":"Forty million dollars comes home. The woman who stole it walks free."}],"tag":"LUXURY"},{"id":"c_hunt","if":{"flags":["elise_escaped"]},"text":"\"Wherever she runs, we'll find her.\"","effects":{"reputation":5,"desire":10},"setFlags":["vengeance"],"response":[{"speaker":"narrator","text":"Somewhere, a woman with pale hair is buying a ticket to somewhere warm."}],"tag":"DESIRE"},{"id":"c_let","if":{"flags":["elise_escaped"]},"text":"Let her go. You have the truth, and everyone is alive.","effects":{"affection":10,"loyalty":5},"setFlags":["mercy"],"response":[{"speaker":"narrator","text":"Everyone is alive. In this story, that's the rarest treasure of all."}],"tag":"LOYALTY"}],"next":null,"tension":true,"music":"sorrow"}],"outcomes":[{"id":"a_tari","if":{"flags":["dead_tari"]},"title":"The Prince Falls","text":"Tari carried the ledger down the mountain and gave his life for it. The creeks will sing about him for a hundred years."},{"id":"a_hadiza","if":{"flags":["dead_hadiza"]},"title":"The Last Ledger","text":"Hadiza carried the proof down the mountain, every page in order. Kano has lost its sharpest mind."},{"id":"a_kolade","if":{"flags":["dead_kolade"]},"title":"The Banker's Debt","text":"Kolade wanted to earn it. On the mountain, he paid in full."},{"id":"a_self","title":"Alone on the Mountain","text":"You carried it yourself. Everyone lived. Elise escaped. Every choice has a price."}],"reflections":[{"if":{"flags":["held_door"]},"text":"Ten seconds at the vault door. The others won't forget them."},{"if":{"flags":["deal_elise"]},"text":"The money came home. Justice didn't."}],"secrets":{"s_wolf":{"title":"Le Loup","text":"WOLF. In Banque Moreau's private files, Elise signed every stolen transfer 'Le Loup'. The wolf."}},"memories":{"m_geneva":{"title":"The Blue Lake","background":"geneva","text":"A fountain touching the sky, and a bank with no sign."},"m_vault":{"title":"Blood and Steel","background":"vault","text":"One drop of red, and a door that remembered who her father was."},"m_storm_alps":{"title":"The Storm on the Pass","background":"alps_storm","text":"Somebody didn't come back down the mountain."},"m_montreux":{"title":"Montreux, Midnight","background":"montreux_night","text":"Silk, a moonlit lake, and a key card trying the door."}},"keepsakes":{"k_coral_whole":{"type":"memento","title":"The coral bracelet, whole","from":"Vault 7, Banque Moreau","text":"Two halves, thirty years apart. A perfect fit."},"k_syringe":{"type":"memento","title":"A hotel syringe","from":"The intruder in Montreux","text":"Thallium. Enough to stop a heart in a day and leave no trace by morning."}},"epigraph":{"text":"Only blood opens what blood built.","source":"Inscription, Vault 7"}},"chapters/c5_caribbean.json":{"id":"c5_caribbean","number":5,"title":"Where the Rivers Meet","place":"Tobago, the Caribbean","teaser":"Turquoise water, a pink house on the hill, the Chief's long-lost brother, and the vote for the crown.","start":"c1_beach","scenes":[{"id":"c1_beach","background":"caribbean","memory":"m_tobago","lines":[{"speaker":"narrator","text":"Tobago. Water the colour of a peacock's throat, sand like sugar, and a pink house on the hill above Castara Bay."},{"speaker":"narrator","text":"At sunset, far out on the water, Nabyen sees a woman in white standing on the sea. Nobody else turns to look.","sfx":"whisper"},{"speaker":"marcus","mood":"smile","text":"So. The children my brother collected. Come, come. There's fish on the fire and rum in the shade."},{"speaker":"marcus","text":"I'm Marcus, Gideon's little brother. Our mother was from Trinidad. He got the empire and I got the sea. I think I got the better deal."},{"speaker":"marcus","if":{"flags":["dead_tari"]},"mood":"sad","text":"I'm sorry about the boy from the creeks. Gideon wrote about him every Christmas."},{"speaker":"marcus","if":{"flags":["dead_hadiza"]},"mood":"sad","text":"Gideon said the Lawan girl could count the stars and tell you which ones were missing. I'm so sorry."},{"speaker":"marcus","if":{"flags":["dead_kolade"]},"mood":"sad","text":"The Lagos boy. Gideon said he was all ambition and no peace. I hope he has peace now."},{"speaker":"narrator","text":"His hands are perfectly steady as he pours. Too steady, for a man who has just lost his only brother."},{"speaker":"marcus","text":"I have the last seal, and his last instruction: you choose. Together."},{"speaker":"tari","if":{"pov":"nabyen","notFlags":["spark_tari","dead_tari"]},"mood":"sad","text":"The roses were from me. All of them. Every birthday. I just wanted you to know, before this ends."}],"prompt":"Marcus pours the rum.","choices":[{"id":"c_toast","text":"Raise a glass to Chief Gideon.","effects":{"affection":5,"loyalty":5},"response":[{"speaker":"marcus","mood":"smile","text":"To my big, loud, impossible brother."}],"tag":"LOYALTY"},{"id":"c_toast_fallen","text":"Raise a glass to everyone this crown has cost.","effects":{"trust":5,"loyalty":5},"response":[{"speaker":"marcus","mood":"sad","text":"To Oliver. To all of them."}],"tag":"LOYALTY"}],"puzzle":"c_island","next":"c2_ibiere","keepsake":"k_letters_marcus","music":"calm"},{"id":"c2_ibiere","background":"caribbean","lines":[{"speaker":"narrator","text":"Then a seaplane lands in the bay, and out steps Ibiere Okoro in purple lace and a temper."},{"speaker":"ibiere","if":{"flags":["accused_ibiere"]},"mood":"angry","text":"You called me a murderer in my own house. I'm here to make sure none of you wear his crown."},{"speaker":"ibiere","if":{"notFlags":["accused_ibiere"]},"mood":"sad","text":"I'm not here to fight. I didn't know about the money. I didn't know about any of it."},{"speaker":"ibiere","if":{"notFlags":["accused_ibiere"]},"text":"I didn't know him at all, it seems. But I want his wish carried out."},{"speaker":"ibiere","if":{"flags":["betrayer"]},"text":"And I know what the Lagos boy did. Elise's lawyers sent me everything."}],"prompt":"The widow has arrived.","choices":[{"id":"c_apologise","if":{"flags":["accused_ibiere"]},"text":"Apologise. You were wrong about her.","effects":{"trust":10,"reputation":-5,"loyalty":5},"setFlags":["apologised"],"response":[{"speaker":"ibiere","mood":"sad","text":"...Accepted. Barely."}],"tag":"LOYALTY"},{"id":"c_stand","if":{"flags":["accused_ibiere"]},"text":"Stand your ground. Let her fight it in court.","effects":{"reputation":10,"trust":-5,"control":10},"setFlags":["ibiere_enemy"],"response":[{"speaker":"ibiere","mood":"angry","text":"Then I'll see you in court. All of you."}],"tag":"CONTROL"},{"id":"c_welcome","if":{"notFlags":["accused_ibiere"]},"text":"Welcome her to the table.","effects":{"trust":5,"affection":5,"loyalty":5},"setFlags":["ibiere_ally"],"response":[{"speaker":"ibiere","mood":"smile","text":"Thank you. He would have liked that."}],"tag":"LOYALTY"},{"id":"c_wary","if":{"notFlags":["accused_ibiere"]},"text":"Keep her at arm's length.","effects":{"reputation":5,"control":5},"response":[{"speaker":"ibiere","text":"Wise. I would too."}],"tag":"CONTROL"}],"next":"c3_vote","tension":true,"music":"tension"},{"id":"c3_vote","background":"caribbean_sunset","lines":[{"speaker":"narrator","text":"Sunset. The sky turns pink, then gold, then violet. Steel pan drifts up from the village."},{"speaker":"marcus","text":"One crown. The ships, the tin, the cloth, the banks. Everything my brother built goes to whoever you choose."}],"prompt":"Who wears the Crown of the Confluence?","choices":[{"id":"c_crown_self","text":"\"I will.\"","effects":{"reputation":15,"affection":-5,"control":15},"setFlags":["crowned_self"],"response":[{"speaker":"marcus","text":"Then wear it well. It's heavier than it looks."}],"tag":"CONTROL"},{"id":"c_crown_nabyen","if":{"notPov":"nabyen"},"text":"\"Nabyen. It was always hers.\"","effects":{"affection":10,"trust":5,"loyalty":10},"setFlags":["crowned_nabyen"],"response":[{"speaker":"nabyen","mood":"surprised","text":"Me? A girl who sells stones in Jos?"},{"speaker":"marcus","mood":"smile","text":"The best kind of queen."}],"tag":"LOYALTY","rel":{"nabyen":{"intimacy":5}}},{"id":"c_council","text":"\"Nobody. A council of the houses, every voice equal.\"","effects":{"trust":10,"affection":5,"loyalty":10},"setFlags":["council"],"response":[{"speaker":"marcus","mood":"smile","text":"Ha! He'd have hated that. Which is how I know it's right."}],"tag":"LOYALTY"}],"puzzle":"c_palms","next":"c4_shepherd","tension":true,"music":"night"},{"id":"c4_shepherd","background":"caribbean_sunset","music":"danger","tension":true,"lines":[{"speaker":"narrator","text":"The vote is barely counted when the steel band stops playing.","sfx":"sting_reveal"},{"speaker":"narrator","text":"Marcus is standing at the top of the steps. The rum glass is gone. In its place, a small black pistol."},{"speaker":"marcus","mood":"smile","text":"Forty years of Christmas letters. 'Next year I will come, little brother.' He never came."},{"speaker":"marcus","mood":"angry","text":"He got the empire. I got a pink house and a promise. So I made my own arrangements."},{"speaker":"narrator","text":"Somewhere behind you, a glass hits the floor.","sfx":"glass"},{"speaker":"ibiere","mood":"surprised","text":"You. It was you. Elise worked for you."},{"speaker":"marcus","mood":"smile","text":"Elise worked for money. I gave her a reason. Le Berger, she called me. The shepherd. B, on the last page of every ledger."},{"speaker":"narrator","if":{"flags":["s_psalm"]},"text":"The Lord is my shepherd. The psalm he hums every sunset was never a prayer. It was a signature."},{"speaker":"marcus","text":"Now. Which of you wants to hand me the seal?"}],"prompt":"Marcus has the gun, the seal, and nothing left to lose.","choices":[{"id":"c_lev_psalm","leverage":"s_psalm","tag":"LEVERAGE","risk":"High risk","text":"\"'The Lord is my shepherd.' Every sunset you hummed your own confession, Marcus. Le Berger.\"","effects":{"control":15},"setFlags":["shepherd_exposed","marcus_caught"],"response":[{"speaker":"marcus","mood":"surprised","text":"...Clever. Gideon would have liked you."},{"speaker":"narrator","text":"His hand wavers for half a second. It's enough. Ibiere's bodyguards were never just guests. Marcus is face down in the sand before the steel band's last note fades.","sfx":"heartbeat"}]},{"id":"c_shield","if":{"any":[{"flags":["romance_nabyen"]},{"flags":["romance_tari"],"notFlags":["dead_tari"]},{"flags":["romance_kolade"],"notFlags":["dead_kolade"]}]},"tag":"DESIRE","risk":"High risk","text":"Step between the gun and the one you love.","effects":{"desire":15,"loyalty":10},"setFlags":["shielded_partner","marcus_caught"],"response":[{"speaker":"narrator","text":"The shot is louder than the steel band ever was.","sfx":"gunshot"},{"speaker":"narrator","text":"{pov} goes down on the sand. The bullet passes clean through the shoulder. Bleeding. Alive."},{"speaker":"nabyen","if":{"flags":["romance_nabyen"]},"mood":"worried","text":"Look at me. LOOK at me. You do not get to leave me on a beach."},{"speaker":"tari","if":{"flags":["romance_tari"],"notFlags":["dead_tari"]},"mood":"worried","text":"Nabyen! Nabyen, stay with me. Stay with me!"},{"speaker":"kolade","if":{"flags":["romance_kolade"],"notFlags":["dead_kolade"]},"mood":"worried","text":"No. No, no, no. Somebody call a doctor! I will buy the whole island a hospital!"},{"speaker":"narrator","text":"In the chaos, Ibiere breaks a bottle over Marcus's head. Nobody has ever seen her look happier."}]},{"id":"c_talk_down","tag":"LOYALTY","text":"\"He kept every letter you ever sent him, Marcus. Every one. They were in the vault.\"","effects":{"loyalty":10,"trust":10},"setFlags":["marcus_broken","marcus_caught"],"response":[{"speaker":"marcus","mood":"sad","text":"...He kept them?"},{"speaker":"narrator","text":"The gun lowers, an inch at a time. Marcus sits down heavily on the steps and sets it on the sand."},{"speaker":"marcus","mood":"sad","text":"Call whoever you like. I am tired. I have been tired for forty years."}]},{"id":"c_go_gun","tag":"CONTROL","risk":"High risk","text":"Go for the gun.","effects":{"control":10,"desire":10},"setFlags":["fought_marcus"],"response":[{"speaker":"narrator","if":{"min":{"control":70}},"text":"{pov} is faster. The gun skids across the sand and into the surf.","sfx":"splash"},{"speaker":"narrator","if":{"min":{"control":70}},"text":"Marcus is still reaching for it when the Tobago police come up the steps."},{"speaker":"narrator","if":{"max":{"control":69}},"text":"The gun goes off. The lantern above Ibiere's head explodes in a shower of glass.","sfx":"gunshot"},{"speaker":"narrator","if":{"max":{"control":69}},"text":"In the chaos, Marcus is gone: down the beach, into the seaplane, into the dark.","sfx":"engine"}]}],"next":[{"if":{"flags":["betrayer"]},"to":"end_betrayal"},{"if":{"flags":["romance_tari","dead_tari"]},"to":"end_ashes"},{"if":{"flags":["romance_kolade","dead_kolade"]},"to":"end_ashes"},{"if":{"any":[{"flags":["romance_nabyen"]},{"flags":["romance_tari"]},{"flags":["romance_kolade"]}],"anyFlags":["crowned_self","crowned_nabyen"],"min":{"control":65}},"to":"end_power_couple"},{"if":{"any":[{"flags":["romance_nabyen"],"rel":{"nabyen":{"minTension":70}}},{"flags":["romance_tari"],"rel":{"tari":{"minTension":70}}},{"flags":["romance_kolade"],"rel":{"kolade":{"minTension":70}}}]},"to":"end_rival_passion"},{"if":{"anyFlags":["romance_nabyen","romance_tari","romance_kolade"],"min":{"affection":60}},"to":"end_wedding"},{"if":{"notFlags":["romance_nabyen","romance_tari","romance_kolade"],"any":[{"flags":["crowned_nabyen"]},{"pov":["nabyen","hadiza"],"flags":["crowned_self"]}],"min":{"control":60}},"to":"end_empress"},{"if":{"flags":["crowned_self"]},"to":"end_crown"},{"to":"end_council"}]},{"id":"end_wedding","background":"caribbean_sunset","setFlags":["end_wedding"],"memory":"m_wedding","lines":[{"speaker":"narrator","text":"Three months later. The same beach, the same pink sky, a hundred lanterns in the palms."},{"speaker":"narrator","if":{"flags":["romance_nabyen"]},"text":"{pov} and Nabyen Dalyop are married barefoot in the sand."},{"speaker":"narrator","if":{"flags":["romance_tari"]},"text":"Nabyen Dalyop marries Tari Ebiowei barefoot in the sand. He finally brings her a fish. It's enormous."},{"speaker":"narrator","if":{"flags":["romance_kolade"]},"text":"Nabyen Dalyop marries Kolade Balogun barefoot in the sand. Lagos sends three hundred guests and a live band."},{"speaker":"nabyen","mood":"smile","text":"Look at us. A girl from the rocks, married on a beach on the other side of the world. I'm the happiest woman between Jos and Tobago."},{"speaker":"kaneng","mood":"smile","text":"My daughter. Look at you. Your father would have cried. Loudly."},{"speaker":"narrator","if":{"flags":["crowned_nabyen"]},"text":"The bride wears a crown of coral and gold. Confluence Holdings has never had a chairwoman before. It does now."},{"speaker":"narrator","if":{"pov":"nabyen","flags":["crowned_self"]},"text":"The bride wears a crown of coral and gold. Confluence Holdings has never had a chairwoman before. It does now."},{"speaker":"narrator","if":{"flags":["council"]},"text":"At the head table sit the four houses, every voice equal, and nobody wearing a crown at all."},{"speaker":"narrator","mood":"smile","text":"Some stories end in blood. This one ends in dancing."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"romance"},{"id":"end_crown","background":"ph_day","setFlags":["end_crown"],"lines":[{"speaker":"narrator","text":"Port Harcourt. The top floor of Confluence Tower, looking over the Bonny River."},{"speaker":"narrator","text":"{pov} sits at the head of the table. No crown, just the whole empire in one pair of hands."},{"speaker":"narrator","text":"Ships, tin, cloth, money. Four rivers, one hand."},{"speaker":"ibiere","if":{"flags":["ibiere_ally"]},"mood":"smile","text":"He'd be proud. Terrified, but proud."},{"speaker":"narrator","text":"Some nights the tower is very quiet. Power is a beautiful view from a lonely room."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"title"},{"id":"end_council","background":"caribbean","setFlags":["end_council"],"lines":[{"speaker":"narrator","text":"Every year after that, on the day the Chief died, the houses meet on the beach at Castara Bay."},{"speaker":"narrator","text":"Jos brings gemstones. The creeks bring fish. Kano brings cloth, and Lagos brings far too much champagne."},{"speaker":"narrator","if":{"anyFlags":["dead_tari","dead_hadiza","dead_kolade"]},"text":"They always set one extra place at the table."},{"speaker":"narrator","mood":"smile","text":"The Chief built an empire. They built something harder: a family."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"triumph"},{"id":"end_ashes","background":"creek_night","setFlags":["end_ashes"],"lines":[{"speaker":"narrator","text":"They scatter the ashes on the water at dawn, the way he would have wanted."},{"speaker":"nabyen","if":{"flags":["dead_tari"]},"mood":"sad","text":"He promised me a fish. A big one. He never got to keep his promise."},{"speaker":"nabyen","if":{"flags":["dead_kolade"]},"mood":"sad","text":"Lagos never sleeps. Neither do I, anymore."},{"speaker":"narrator","text":"The crown is decided. It weighs more than anything Nabyen has ever carried."},{"speaker":"kaneng","mood":"sad","text":"Come home to the rocks, my daughter. Rocks don't leave."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"sorrow"},{"id":"end_betrayal","background":"lagos_night","setFlags":["end_betrayal"],"lines":[{"speaker":"narrator","text":"Elise kept her word, even from a cell. Her lawyers made sure the board voted the way she'd promised."},{"speaker":"narrator","text":"Kolade Balogun wears the Crown of the Confluence in a glass tower on Victoria Island."},{"speaker":"narrator","text":"Nobody from Jos, the creeks or Kano ever takes his calls again."},{"speaker":"kolade","mood":"sad","text":"I earned it, old man. Just like you said."},{"speaker":"narrator","text":"The view is spectacular. The rooms are very, very empty."}],"next":null,"music":"sorrow"},{"id":"end_power_couple","background":"lagos_night","setFlags":["end_power_couple"],"tension":true,"lines":[{"speaker":"narrator","text":"Six months later. The top floor of Confluence Tower, the whole city lit up below like money."},{"speaker":"narrator","if":{"flags":["romance_nabyen"]},"text":"{pov} and Nabyen Dalyop run the empire together. Boardrooms go quiet when they walk in."},{"speaker":"narrator","if":{"flags":["romance_tari"]},"text":"Nabyen Dalyop and Tari Ebiowei run the empire together, from the Plateau to the creeks. Boardrooms go quiet when they walk in."},{"speaker":"narrator","if":{"flags":["romance_kolade"]},"text":"Nabyen Dalyop and Kolade Balogun run the empire together. Lagos has never seen a partnership like it, and Lagos has seen everything."},{"speaker":"narrator","text":"Rivals sign whatever is put in front of them. Ministers return their calls within the hour."},{"speaker":"nabyen","if":{"notPov":"nabyen"},"mood":"intimate","text":"They're afraid of us, you know."},{"speaker":"kolade","if":{"flags":["romance_kolade"]},"mood":"intimate","text":"They're afraid of you. I'm just the one who gets to hold your hand."},{"speaker":"tari","if":{"flags":["romance_tari"]},"mood":"smile","text":"Let them be afraid. I only care that you come home at night."},{"speaker":"narrator","text":"Love, it turns out, is the most dangerous alliance of all."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"triumph"},{"id":"end_rival_passion","background":"caribbean_sunset","setFlags":["end_rival_passion"],"lines":[{"speaker":"narrator","text":"They never stopped arguing. Not in London, not on the mountain, not on the beach in Tobago, where it finally ended in a kiss that silenced the steel band."},{"speaker":"kolade","if":{"flags":["romance_kolade"]},"mood":"intimate","text":"You still drive me mad, you know."},{"speaker":"nabyen","if":{"flags":["romance_kolade"]},"mood":"defiant","text":"Good. Keep up, Mr Balogun."},{"speaker":"tari","if":{"flags":["romance_tari"]},"mood":"smile","text":"Twenty years of fighting with you. I want fifty more."},{"speaker":"nabyen","if":{"flags":["romance_nabyen"]},"mood":"defiant","text":"Don't think this means you win the argument."},{"speaker":"narrator","text":"Every argument since has ended the same way."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"romance"},{"id":"end_empress","background":"mansion","setFlags":["end_empress"],"lines":[{"speaker":"narrator","if":{"any":[{"flags":["crowned_nabyen"]},{"pov":"nabyen"}]},"text":"Nabyen Dalyop takes her father's chair at the head of the Confluence table. The girl from the rocks of Jos runs ships, tin, cloth and money now."},{"speaker":"narrator","if":{"pov":"hadiza","flags":["crowned_self"]},"text":"Hadiza Lawan takes the Chief's chair at the head of the Confluence table. Kano always knew she'd count everyone's money one day."},{"speaker":"narrator","text":"She answers to no husband, no council and no ghost. The empire has never been better run."},{"speaker":"narrator","text":"Some nights she stands at the window alone, and finds she does not mind at all."}],"next":[{"if":{"count":{"of":["s_plea","s_swear","s_greed","s_bride","s_spoon","s_shame","s_wolf","s_psalm"],"min":4}},"to":"epi_homecoming"},{"to":null}],"music":"title"},{"id":"epi_homecoming","background":"jos","setFlags":["end_secret"],"lines":[{"speaker":"narrator","text":"Secret ending. One year later: Jos, the rocks at sunrise."},{"speaker":"narrator","text":"Mama Kaneng opens the last letter the Chief ever wrote. It was hidden in the ledger, among the secrets only the curious would find."},{"speaker":"letter","text":"Kaneng. I was a coward for thirty years. I built four rivers because I was too afraid to come back to one. Tell our daughter she was the only treasure I never deserved. — Gideon."},{"speaker":"kaneng","mood":"sad","text":"Foolish, loud, wonderful man."},{"speaker":"narrator","text":"That night, for the first time in three generations, a woman of the Rock dreams of the river and nobody dies. The woman in white only smiles, and sinks gently out of sight.","sfx":"whisper"},{"speaker":"nabyen","mood":"smile","text":"Come on, Mama. Let's go home."}],"next":null,"music":"calm"}],"outcomes":[{"id":"end_betrayal","if":{"flags":["end_betrayal"]},"title":"The Price of Gold","text":"Kolade won the crown and lost everyone. Lagos never sleeps, and now neither does he."},{"id":"end_ashes","if":{"flags":["end_ashes"]},"title":"Ashes on the Water","text":"Love was found and lost on the same mountain. The crown was won. It was not worth it."},{"id":"end_power_couple","if":{"flags":["end_power_couple"]},"title":"Dangerous Power Couple","text":"Love and the crown, in the same two pairs of hands. Nobody in four countries dares say no to you."},{"id":"end_rival_passion","if":{"flags":["end_rival_passion"]},"title":"Rivalry Turned Passion","text":"You fought each other across three continents. In the end, the fighting was the love story."},{"id":"end_wedding","if":{"flags":["end_wedding"]},"title":"Where the Rivers Meet","text":"A wedding on a Caribbean beach. Four houses, one family. Some stories end in blood. This one ended in dancing."},{"id":"end_empress","if":{"flags":["end_empress"]},"title":"Solitary Empress","text":"She took the crown and kept her heart to herself. The empire has never been better run, and she has never been freer."},{"id":"end_crown","if":{"flags":["end_crown"]},"title":"The Crown of the Confluence","text":"You took the crown. The empire is yours, and so is the silence at the top of the tower."},{"id":"end_council","title":"Four Rivers, One Sea","text":"No crown. A council. A family that meets on a beach in Tobago once a year, and argues, and laughs, and remembers."}],"reflections":[{"if":{"flags":["shepherd_exposed"]},"text":"Le Berger sits in a Tobago cell, humming his psalm to an empty room."},{"if":{"flags":["shielded_partner"]},"text":"You took a bullet for love. The scar on your shoulder is shaped like a river."},{"if":{"flags":["marcus_broken"]},"text":"Marcus confessed to everything, and asked for the letters to be sent to his cell."},{"if":{"flags":["fought_marcus"],"max":{"control":69}},"text":"Marcus escaped in the seaplane. Somewhere, the shepherd is still counting his sheep."},{"if":{"flags":["end_secret"]},"text":"Secret ending unlocked: The Seventh Seal. You found the hidden words, and the letter the Chief was too afraid to send."},{"if":{"flags":["justice"]},"text":"Elise Moreau is in a Swiss prison."},{"if":{"flags":["vengeance"]},"text":"Somewhere warm, the wolf is still running. Not for long."},{"if":{"flags":["ibiere_ally"]},"text":"The widow became a friend. Nobody saw that coming."},{"if":{"flags":["ibiere_enemy"]},"text":"Ibiere's lawyers are already in court."},{"if":{"notFlags":["end_secret"]},"text":"There's a secret ending. Find at least four hidden words in one story to unlock it."}],"secrets":{"s_psalm":{"title":"The Chief's psalm","text":"PSALM. Every evening at sunset Marcus hums the Chief's favourite, Psalm 23. 'He made me learn it for both of us,' he says."}},"memories":{"m_tobago":{"title":"Castara Bay","background":"caribbean","text":"A pink house, fish on the fire, and the Chief's long-lost brother."},"m_wedding":{"title":"Barefoot in the Sand","background":"caribbean_sunset","text":"A hundred lanterns, a wedding, and a mother dancing."}},"keepsakes":{"k_letters_marcus":{"type":"letter","title":"Forty years of Christmas letters","from":"Gideon to Marcus","text":"Every one ends the same way: 'Next year, little brother, I'll come.' He never did."}},"epigraph":{"text":"When the two halves meet, the river will choose.","source":"Nana Rinji's diary"}},"plus.enc.json":{"v":1,"setup":{"iter":250000,"salt":"U2rJEe5zgHrcsbjTNRa0bw==","iv":"BDsxLrzKOabDwz/A","wrapped":"Hfl01tTwOnW5svXHj+UGvXyh+27svHG+JF5F4Vjo6xFJUvFUMNirP5FOQcnnGr0V"},"iv":"W2yZpv0ChMLT2oSD","data":"oOMZACHOgvTG7iyYE1O5x1TdFloT8rmRRCYJH3CaeW7yW4nCgvr0pYpqaqc46IBc/153tW5YomliiIatLYruYFi5I1C9jHJBTkBr7s3L6INbHP+NH0LIk8I1cCcDmFuMM+soIESIb1wxSWUUhMnpavrJ/nciyhpM+8+FeX/6q99ECvbgyDcwvV/TmPHrdc2eiAeeSOkTfaMcWKTO8tQVs3VgJNCVkcmJ3wuUmzBuo1z6BiwuXThToEH1VX/0iPEb7LxOVUEH3uH56AKSSEfLYHld3eC+PS1PXtIk07G6tzJWvFkBCr1gcBXxV6CYhQUg655Z+KHVDhIXAT///8DL5iJtP66faFDcY7rOcKxRM1InZyDBP8vuyThm3W0KDR9Z4oo88L41O1QO9ZpGMLxxOOaYm3OCVvMcCW3vq1BUnT34SJcVwClhyenHzjdxQ20ZNG16+qE2WbUz5QHPabur8k42DW5r7jhRH4jad7ooPBBf6Q77U6EmHGli2XkbtA9JcV1xhb2ItUMt37vvA0Hd/1s5ARefcrAtShj66ID9LTepY8PRks1Yj4apH/+iM2NkDFnyubYiQ2u0zticVHO3ICdnSp0uERLgC8vQ85R+L3ZZtLmoTsvapvtqsRqjqr1E4A2wM0s519ERdKu5zkvGQcJHZRWTFHn/01mNVKQdXErgEkg07srFac0G2Gmtu3WI8dm9RHDFbuldIYjivb6fVjs
